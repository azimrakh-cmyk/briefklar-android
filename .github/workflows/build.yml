name: Build Android app

# Builds Briefklar for Android in the cloud and publishes the APK as a release.
# Download link: https://github.com/<owner>/<repo>/releases/latest/download/Briefklar.apk
# If the build fails, an issue with the error log is opened automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          (
            set -ex
            echo "ANDROID_HOME=$ANDROID_HOME"; java -version; node -v
            npm install --no-audit --no-fund
            npx cap add android
            for f in res/*; do
              n=$(basename "$f"); d=${n%%__*}; b=${n#*__}
              mkdir -p "android/app/src/main/res/$d"
              cp "$f" "android/app/src/main/res/$d/$b"
            done
            sed -i '/android.permission.INTERNET/d' android/app/src/main/AndroidManifest.xml
            sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle
            npx cap sync android
            chmod +x android/gradlew
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk Briefklar.apk
          ) 2>&1 | tee build.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          { echo "Build #${{ github.run_number }} failed. Last lines of the log:"; echo '```'; tail -c 50000 build.log; echo '```'; } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Build #${{ github.run_number }} failed" --body-file body.md

      - uses: actions/upload-artifact@v4
        with:
          name: Briefklar-apk
          path: Briefklar.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Briefklar 2.0.${{ github.run_number }}
          body: Тестовая версия Briefklar для Android. Скачайте Briefklar.apk и установите на телефон.
          files: Briefklar.apk
          make_latest: true
