name: Build Android app

# Builds Briefklar for Android in the cloud and publishes the APK as a release.
# Download link: https://github.com/<owner>/<repo>/releases/latest/download/Briefklar.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          for f in res/*; do
            n=$(basename "$f"); d=${n%%__*}; b=${n#*__}
            mkdir -p "android/app/src/main/res/$d"
            cp "$f" "android/app/src/main/res/$d/$b"
          done
          sed -i '/android.permission.INTERNET/d' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
          chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Briefklar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Briefklar-apk
          path: Briefklar.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Briefklar 2.0.${{ github.run_number }}
          body: Тестовая версия Briefklar для Android. Скачайте Briefklar.apk и установите на телефон.
          files: Briefklar.apk
          make_latest: true
