task({id:"kindergeld",ph:2,ic:"coins",prio:16,off:"famkasse",links:["famkasse","famportal"],when:p=>kids(p)||has(p.family,"baby")||has(p.ev,"baby")},{
ru:["Подать на Kindergeld","Kindergeld — 259 € в месяц на каждого ребёнка (2026 год), обычно до 18 лет, а при учёбе или Ausbildung — до 25. Задним числом платят только за 6 месяцев — не откладывайте.",
["Проверьте право: граждане не из ЕС обычно получают Kindergeld, если их ВНЖ разрешает работать.","Подайте заявление онлайн в Familienkasse (нужны Steuer-ID родителя и ребёнка).","Для детей старше 18 приложите справку о школе, учёбе или Ausbildung.","При небольшом доходе проверьте и Kinderzuschlag — дополнительные деньги к Kindergeld."],
["Steuer-ID родителя и ребёнка","Свидетельство о рождении","ВНЖ","IBAN","Справка о школе/учёбе (для детей старше 18)"]],
uz:["Kindergeld uchun ariza berish","Kindergeld — har bir bola uchun oyiga 259 € (2026-yil), odatda 18 yoshgacha, oʻqish yoki Ausbildungda — 25 yoshgacha. Orqaga faqat 6 oy uchun toʻlanadi — kechiktirmang.",
["Huquqni tekshiring: YeIdan boʻlmagan fuqarolar odatda yashash ruxsatnomasi ishlashga ruxsat bersa, Kindergeld oladi.","Familienkassega onlayn ariza bering (ota-ona va bolaning Steuer-ID raqamlari kerak).","18 yoshdan katta bolalar uchun maktab, oʻqish yoki Ausbildung maʼlumotnomasini ilova qiling.","Daromad kichik boʻlsa, Kinderzuschlagni ham tekshiring — Kindergeldga qoʻshimcha pul."],
["Ota-ona va bolaning Steuer-ID raqamlari","Tugʻilganlik guvohnomasi","Yashash ruxsatnomasi","IBAN","Maktab/oʻqish maʼlumotnomasi (18 yoshdan kattalar uchun)"]],
en:["Apply for child benefit (Kindergeld)","Kindergeld is €259 per month for each child (2026), usually up to 18, or up to 25 in education or training. Back payments cover only 6 months — don't wait.",
["Check eligibility: non-EU citizens usually get it if their residence permit allows them to work.","Apply online at the Familienkasse (you need the tax IDs of parent and child).","For children over 18, attach proof of school, studies or Ausbildung.","On a low income, also check the Kinderzuschlag — extra money on top of Kindergeld."],
["Tax ID of parent and child","Birth certificate","Residence permit","IBAN","Proof of school/studies (children over 18)"]],
de:["Kindergeld beantragen","Kindergeld beträgt 2026 259 € pro Kind und Monat, meist bis 18, in Ausbildung oder Studium bis 25. Rückwirkend wird nur für 6 Monate gezahlt — nicht warten.",
["Anspruch prüfen: Nicht-EU-Staatsangehörige bekommen es meist, wenn der Aufenthaltstitel Erwerbstätigkeit erlaubt.","Online bei der Familienkasse beantragen (Steuer-ID von Elternteil und Kind nötig).","Für Kinder über 18 Schul-, Studien- oder Ausbildungsbescheinigung beilegen.","Bei geringem Einkommen auch den Kinderzuschlag prüfen."],
["Steuer-ID von Elternteil und Kind","Geburtsurkunde","Aufenthaltstitel","IBAN","Schul-/Studienbescheinigung (über 18)"]]
});

task({id:"flat_search",ph:2,ic:"key",prio:22,tpl:["wohnungsbewerbung"],off:"mieter",links:["mieterbund","schufa"],when:p=>has(p.extra,"flat")||p.housing==="none"||(p.housing==="temp"&&p.purpose!=="protection")},{
ru:["Найти квартиру и не попасться мошенникам","Рынок жилья в крупных городах очень сложный: на одну квартиру бывают сотни заявок. Выигрывает тот, кто быстро отвечает и сразу присылает полный пакет документов.",
["Ищите на ImmoScout24, Immowelt, Kleinanzeigen, WG-Gesucht и в жилищных кооперативах (Genossenschaften); при небольшом доходе получите Wohnberechtigungsschein (WBS) для социального жилья.","Подготовьте одну PDF-папку: анкета (Mieterselbstauskunft), SCHUFA, 3 последние зарплаты, справка об отсутствии долгов по аренде, копия ВНЖ.","Отвечайте на объявления в первые часы, вежливым письмом на немецком (шаблон ниже).","Никогда не платите до осмотра и подписания договора. «Хозяин за границей, пришлёт ключи после перевода» — это мошенничество.","Залог (Kaution) — не больше трёх месячных Kaltmiete, его можно платить тремя частями."],
["Mieterselbstauskunft","SCHUFA-Auskunft","Справки о доходах за 3 месяца","Mietschuldenfreiheitsbescheinigung","Паспорт / ВНЖ"]],
uz:["Kvartira topish va firibgarlarga aldanmaslik","Katta shaharlarda uy-joy bozori juda qiyin: bitta kvartiraga yuzlab ariza tushadi. Tez javob berib, darhol toʻliq hujjatlar paketini yuborgan yutadi.",
["ImmoScout24, Immowelt, Kleinanzeigen, WG-Gesucht va uy-joy kooperativlarida (Genossenschaften) qidiring; daromad kichik boʻlsa, ijtimoiy uy-joy uchun Wohnberechtigungsschein (WBS) oling.","Bitta PDF jild tayyorlang: anketa (Mieterselbstauskunft), SCHUFA, oxirgi 3 ta maosh, ijara qarzi yoʻqligi haqida maʼlumotnoma, yashash ruxsatnomasi nusxasi.","Eʼlonlarga birinchi soatlarda, nemis tilida xushmuomala xat bilan javob bering (pastdagi shablon).","Koʻrishdan va shartnoma imzolashdan oldin hech qachon pul toʻlamang. «Egasi chet elda, pul oʻtkazganingizdan keyin kalitlarni yuboradi» — bu firibgarlik.","Garov (Kaution) — uch oylik Kaltmietedan koʻp emas, uni uch qismda toʻlash mumkin."],
["Mieterselbstauskunft","SCHUFA-Auskunft","3 oylik daromad maʼlumotnomalari","Mietschuldenfreiheitsbescheinigung","Pasport / yashash ruxsatnomasi"]],
en:["Find a flat and avoid scams","Housing in big cities is very tight: hundreds of people apply for one flat. Those who reply fast with a complete set of documents win.",
["Search on ImmoScout24, Immowelt, Kleinanzeigen, WG-Gesucht and housing cooperatives (Genossenschaften); on a low income, get a Wohnberechtigungsschein (WBS) for social housing.","Prepare one PDF folder: tenant self-disclosure (Mieterselbstauskunft), SCHUFA, last 3 payslips, confirmation of no rent arrears, copy of your residence permit.","Reply within the first hours with a polite message in German (template below).","Never pay before a viewing and a signed contract. “The owner is abroad and will post the keys after payment” is a scam.","The deposit (Kaution) is at most three months' basic rent and may be paid in three instalments."],
["Mieterselbstauskunft","SCHUFA report","Proof of income for 3 months","Confirmation of no rent arrears","Passport / residence permit"]],
de:["Wohnung finden — ohne auf Betrug hereinzufallen","In Großstädten bewerben sich oft Hunderte auf eine Wohnung. Gute Chancen hat, wer schnell antwortet und gleich vollständige Unterlagen schickt.",
["Auf ImmoScout24, Immowelt, Kleinanzeigen, WG-Gesucht und bei Genossenschaften suchen; bei geringem Einkommen einen Wohnberechtigungsschein (WBS) beantragen.","Eine PDF-Mappe vorbereiten: Mieterselbstauskunft, SCHUFA, letzte 3 Gehaltsnachweise, Mietschuldenfreiheitsbescheinigung, Kopie des Aufenthaltstitels.","In den ersten Stunden mit einer höflichen Nachricht antworten (Vorlage unten).","Nie vor Besichtigung und Vertrag zahlen. „Vermieter im Ausland schickt die Schlüssel nach Überweisung“ ist Betrug.","Die Kaution beträgt höchstens drei Nettokaltmieten und darf in drei Raten gezahlt werden."],
["Mieterselbstauskunft","SCHUFA-Auskunft","Einkommensnachweise (3 Monate)","Mietschuldenfreiheitsbescheinigung","Pass / Aufenthaltstitel"]]
});

task({id:"chancen",ph:2,ic:"search",prio:15,off:"abh",links:["miig","ba"],when:p=>p.purpose==="jobsearch"},{
ru:["Правила Chancenkarte и поиска работы","Chancenkarte даёт до года на поиск работы. Пока ищете, можно подрабатывать до 20 часов в неделю и пробовать работу у работодателя до 2 недель.",
["Ищите работу по своей квалификации: с ней вы потом получите обычный рабочий ВНЖ.","Используйте Jobbörse Агентства, LinkedIn, сайты фирм; Agentur für Arbeit консультирует и иностранных соискателей.","Нашли подходящую работу — подайте заявление на рабочий ВНЖ в Ausländerbehörde до окончания Chancenkarte.","Сохраняйте страховку и средства на жизнь — это условие Chancenkarte."],
["Chancenkarte","Резюме и дипломы на немецком","Подтверждение признания диплома","Подтверждение средств"]],
uz:["Chancenkarte va ish qidirish qoidalari","Chancenkarte ish qidirish uchun bir yilgacha vaqt beradi. Qidirayotganda haftasiga 20 soatgacha ishlash va ish beruvchida 2 haftagacha sinov ishida boʻlish mumkin.",
["Malakangiz boʻyicha ish qidiring: u bilan keyin oddiy ish yashash ruxsatnomasini olasiz.","Agentlik Jobbörsesi, LinkedIn, firma saytlaridan foydalaning; Agentur für Arbeit chet ellik izlovchilarga ham maslahat beradi.","Mos ish topsangiz — Chancenkarte tugashidan oldin Ausländerbehördega ish yashash ruxsatnomasi uchun ariza bering.","Sugʻurta va yashash uchun mablagʻni saqlang — bu Chancenkarte sharti."],
["Chancenkarte","Nemischa rezyume va diplomlar","Diplom tan olinganlik tasdigʻi","Mablagʻ tasdigʻi"]],
en:["Opportunity Card (Chancenkarte) and job search","The Chancenkarte gives you up to a year to find work. Meanwhile you may work up to 20 hours a week and do trial work with an employer for up to 2 weeks.",
["Look for work that matches your qualification — that's what gets you a regular work permit.","Use the agency's job portal, LinkedIn and company websites; the employment agency also advises foreign job seekers.","Once you find a suitable job, apply for a work permit at the Ausländerbehörde before your Chancenkarte expires.","Keep your insurance and means of support — they're conditions of the card."],
["Chancenkarte","CV and certificates in German","Proof of recognition","Proof of funds"]],
de:["Chancenkarte und Jobsuche","Die Chancenkarte gibt bis zu ein Jahr Zeit für die Jobsuche. Nebenher sind bis zu 20 Stunden Arbeit pro Woche und Probebeschäftigungen bis zu 2 Wochen erlaubt.",
["Einen Job passend zur Qualifikation suchen — damit gibt es später den regulären Aufenthaltstitel zur Beschäftigung.","Jobbörse der Agentur, LinkedIn und Firmenseiten nutzen; die Agentur für Arbeit berät auch internationale Fachkräfte.","Mit passendem Job vor Ablauf der Chancenkarte den Aufenthaltstitel bei der Ausländerbehörde beantragen.","Krankenversicherung und Lebensunterhalt sichern — das sind Bedingungen der Chancenkarte."],
["Chancenkarte","Lebenslauf und Zeugnisse auf Deutsch","Anerkennungsbescheid","Finanzierungsnachweis"]]
});

task({id:"uni_work",ph:2,ic:"cap",prio:35,links:["stw","bafoeg"],when:p=>(p.purpose==="study"||has(p.doing,"uni"))&&nonEU(p)},{
ru:["Подработка во время учёбы — по правилам","Студенты не из ЕС могут работать 140 полных или 280 половинных дней в году без разрешения. Превышение может стоить ВНЖ.",
["Ведите учёт рабочих дней. Работа в вузе (studentische Hilfskraft) обычно не входит в этот лимит.","Werkstudent — удобный формат: до 20 часов в неделю во время семестра, меньше взносов.","Обязательная практика по учебному плану в лимит не входит.","Проверьте, положен ли вам BAföG — для некоторых статусов да."],[]],
uz:["Oʻqish davomida qoidaga muvofiq ishlash","YeIdan boʻlmagan talabalar ruxsatsiz yiliga 140 toʻliq yoki 280 yarim kun ishlashi mumkin. Oshirib yuborish yashash ruxsatnomasiga zarar yetkazishi mumkin.",
["Ish kunlarini hisobga oling. OTMdagi ish (studentische Hilfskraft) odatda bu limitga kirmaydi.","Werkstudent — qulay format: semestr davomida haftasiga 20 soatgacha, kamroq badallar.","Oʻquv rejasidagi majburiy amaliyot limitga kirmaydi.","Sizga BAföG berilishini tekshiring — baʼzi maqomlar uchun ha."],[]],
en:["Working while studying — within the rules","Non-EU students may work 140 full or 280 half days a year without permission. Going over can put your residence permit at risk.",
["Keep track of your working days. Jobs at the university (studentische Hilfskraft) usually don't count.","Working as a Werkstudent is practical: up to 20 hours a week during term, lower contributions.","Mandatory internships in your curriculum don't count towards the limit.","Check whether you qualify for BAföG — some statuses do."],[]],
de:["Jobben im Studium — nach den Regeln","Studierende aus Nicht-EU-Staaten dürfen ohne Erlaubnis 140 ganze oder 280 halbe Tage im Jahr arbeiten. Wer mehr arbeitet, gefährdet den Aufenthaltstitel.",
["Arbeitstage notieren. Studentische Hilfskraftjobs an der Hochschule zählen meist nicht mit.","Werkstudentenjobs sind praktisch: bis 20 Stunden pro Woche im Semester, geringere Abgaben.","Pflichtpraktika laut Studienordnung zählen nicht zum Limit.","Prüfen, ob BAföG möglich ist — für manche Aufenthaltsstatus ja."],[]]
});

task({id:"bab",ph:2,ic:"tools",prio:20,off:"aa",links:["bab","ba"],when:p=>p.purpose==="ausb"||has(p.doing,"ausb")},{
ru:["Ausbildung: BAB и ваши права","Если вы живёте не у родителей и зарплаты в Ausbildung не хватает, Agentur für Arbeit может доплачивать BAB (Berufsausbildungsbeihilfe). Деньги платят только с месяца подачи заявления.",
["Подайте заявление на BAB онлайн в Agentur für Arbeit как можно раньше — можно до начала Ausbildung. Право зависит от вашего ВНЖ — уточните.","BAB не положен — проверьте Wohngeld.","Знайте права: письменный договор, испытательный срок 1–4 месяца, минимальная оплата Ausbildung, работа только по профессии.","Ведите Berichtsheft (отчётный журнал) — без него не допустят к экзамену.","Проблемы с работодателем — обратитесь в Handelskammer (IHK/HWK): там есть консультанты по Ausbildung."],
["Ausbildungsvertrag","Договор аренды","Справки о доходах (ваших и родителей)","ВНЖ","IBAN"]],
uz:["Ausbildung: BAB va huquqlaringiz","Ota-onangiz bilan yashamasangiz va Ausbildung maoshi yetmasa, Agentur für Arbeit BAB (Berufsausbildungsbeihilfe) toʻlashi mumkin. Pul faqat ariza berilgan oydan toʻlanadi.",
["BAB arizasini Agentur für Arbeitga onlayn imkon qadar erta bering — Ausbildung boshlanishidan oldin ham mumkin. Huquq yashash ruxsatnomangizga bogʻliq — aniqlang.","BAB berilmasa — Wohngeldni tekshiring.","Huquqlaringizni biling: yozma shartnoma, 1–4 oylik sinov muddati, Ausbildungning eng kam toʻlovi, faqat kasb boʻyicha ish.","Berichtsheft (hisobot jurnali) yuriting — usiz imtihonga qoʻyishmaydi.","Ish beruvchi bilan muammo boʻlsa — Handelskammer (IHK/HWK)ga murojaat qiling: u yerda Ausbildung maslahatchilari bor."],
["Ausbildungsvertrag","Ijara shartnomasi","Daromad maʼlumotnomalari (sizniki va ota-onangizniki)","Yashash ruxsatnomasi","IBAN"]],
en:["Ausbildung: BAB and your rights","If you don't live with your parents and your training pay isn't enough, the employment agency may top it up with BAB (Berufsausbildungsbeihilfe). It's paid only from the month you apply.",
["Apply for BAB online at the employment agency as early as possible — even before your Ausbildung starts. Eligibility depends on your residence permit — check.","If you can't get BAB, check Wohngeld.","Know your rights: written contract, probation of 1–4 months, minimum training pay, only tasks related to your trade.","Keep your Berichtsheft (training log) — without it you can't take the final exam.","Problems with your employer? Contact the chamber (IHK/HWK): they have training advisers."],
["Training contract","Tenancy agreement","Proof of income (yours and your parents')","Residence permit","IBAN"]],
de:["Ausbildung: BAB und Ihre Rechte","Wohnen Sie nicht bei den Eltern und reicht die Ausbildungsvergütung nicht, kann die Agentur für Arbeit Berufsausbildungsbeihilfe (BAB) zahlen — erst ab dem Monat der Antragstellung.",
["BAB so früh wie möglich online beantragen — auch schon vor Ausbildungsbeginn. Der Anspruch hängt vom Aufenthaltstitel ab.","Kein BAB-Anspruch? Wohngeld prüfen.","Rechte kennen: schriftlicher Vertrag, Probezeit 1–4 Monate, Mindestausbildungsvergütung, nur ausbildungsbezogene Aufgaben.","Berichtsheft führen — ohne es keine Zulassung zur Prüfung.","Probleme im Betrieb? Ausbildungsberatung der IHK oder HWK kontaktieren."],
["Ausbildungsvertrag","Mietvertrag","Einkommensnachweise (eigene und der Eltern)","Aufenthaltstitel","IBAN"]]
});

task({id:"family_reunion",ph:2,ic:"users",prio:30,off:"abh",tpl:["sachstand"],links:["aa","miig"],when:p=>has(p.family,"abroad")},{
ru:["Перевезти семью в Германию","Супруг и несовершеннолетние дети могут получить визу для воссоединения семьи. Ожидание термина в посольстве бывает долгим — начинайте рано.",
["Обычно нужно: достаточный доход без пособий, достаточно большое жильё и медстраховка для семьи.","Супругу часто нужен немецкий A1, но для семей специалистов и обладателей Blue Card это требование обычно не действует.","Семья подаёт заявление в посольстве Германии в своей стране — для многих виз теперь онлайн через Auslandsportal.","Подготовьте свидетельства о браке и рождении с апостилем и переводом. Ausländerbehörde в Германии может согласовать заявление заранее (Vorabzustimmung) — спросите."],
["Свидетельства о браке и рождении с апостилем и переводом","Ваш ВНЖ","Договор о работе и 3 последние зарплаты","Договор аренды","Сертификат A1 супруга (если требуется)"]],
uz:["Oilani Germaniyaga olib kelish","Turmush oʻrtogʻingiz va voyaga yetmagan bolalaringiz oila birlashuvi vizasini olishi mumkin. Elchixonada termin kutish uzoq boʻladi — erta boshlang.",
["Odatda kerak: nafaqasiz yetarli daromad, yetarlicha katta uy-joy va oila uchun tibbiy sugʻurta.","Turmush oʻrtogʻiga koʻpincha nemis tili A1 kerak, lekin mutaxassislar va Blue Card egalarining oilalari uchun bu talab odatda amal qilmaydi.","Oila oʻz mamlakatidagi Germaniya elchixonasiga ariza beradi — koʻp vizalar uchun endi Auslandsportal orqali onlayn.","Apostil va tarjima bilan nikoh va tugʻilganlik guvohnomalarini tayyorlang. Germaniyadagi Ausländerbehörde arizani oldindan kelishishi mumkin (Vorabzustimmung) — soʻrang."],
["Apostil va tarjimali nikoh va tugʻilganlik guvohnomalari","Yashash ruxsatnomangiz","Ish shartnomasi va oxirgi 3 ta maosh","Ijara shartnomasi","Turmush oʻrtogʻining A1 sertifikati (talab qilinsa)"]],
en:["Bring your family to Germany","Your spouse and minor children can get a family reunion visa. Waiting times for embassy appointments can be long — start early.",
["Usually required: enough income without benefits, enough living space and health insurance for the family.","Spouses often need A1 German, but this usually doesn't apply to families of skilled workers and Blue Card holders.","Your family applies at the German embassy in their country — many visas can now be applied for online via the Auslandsportal.","Prepare marriage and birth certificates with apostille and translation. The Ausländerbehörde can give prior approval (Vorabzustimmung) — ask."],
["Marriage and birth certificates with apostille and translation","Your residence permit","Employment contract and last 3 payslips","Tenancy agreement","Spouse's A1 certificate (if required)"]],
de:["Familie nach Deutschland holen","Ehepartner/in und minderjährige Kinder können ein Visum zum Familiennachzug bekommen. Die Wartezeiten bei Botschaften sind oft lang — früh anfangen.",
["Meist nötig: ausreichendes Einkommen ohne Sozialleistungen, genug Wohnraum und Krankenversicherung für die Familie.","Ehepartner brauchen oft A1-Deutsch — bei Familien von Fachkräften und Inhabern der Blauen Karte meist nicht.","Die Familie beantragt das Visum bei der deutschen Botschaft im Heimatland — viele Visa inzwischen online über das Auslandsportal.","Heirats- und Geburtsurkunden mit Apostille und Übersetzung vorbereiten. Die Ausländerbehörde kann vorab zustimmen (Vorabzustimmung) — nachfragen."],
["Heirats- und Geburtsurkunden mit Apostille und Übersetzung","Ihr Aufenthaltstitel","Arbeitsvertrag und letzte 3 Gehaltsnachweise","Mietvertrag","A1-Zertifikat (falls nötig)"]]
});

task({id:"wohngeld",ph:2,ic:"home",prio:45,off:"wohngeld",links:["wohngeld"],when:p=>arrived(p)&&(p.housing==="own"||p.housing==="wg")&&(working(p)||kids(p))&&!has(p.doing,"jc")},{
ru:["Проверить право на Wohngeld","Wohngeld — государственная доплата к аренде для людей с небольшим доходом, которые не получают Grundsicherungsgeld. Многие имеют на неё право и не знают.",
["Посчитайте примерно в официальном калькуляторе Wohngeld.","Подайте заявление в Wohngeldstelle своего города — во многих городах онлайн.","Деньги платят с месяца подачи заявления, поэтому подавайте сразу.","Если в Ausbildung вам положен BAB — Wohngeld обычно не дают."],
["Договор аренды","Подтверждение оплаты аренды","Справки о доходах всех членов семьи","Паспорт / ВНЖ","IBAN"]],
uz:["Wohngeld huquqini tekshirish","Wohngeld — Grundsicherungsgeld olmaydigan kam daromadli odamlar uchun ijaraga davlat qoʻshimchasi. Koʻpchilikning bunga haqi bor, lekin bilmaydi.",
["Rasmiy Wohngeld kalkulyatorida taxminan hisoblang.","Shahringiz Wohngeldstellesiga ariza bering — koʻp shaharlarda onlayn.","Pul ariza berilgan oydan toʻlanadi, shuning uchun darhol bering.","Ausbildungda BAB berilsa — Wohngeld odatda berilmaydi."],
["Ijara shartnomasi","Ijara toʻlovi tasdigʻi","Barcha oila aʼzolarining daromad maʼlumotnomalari","Pasport / yashash ruxsatnomasi","IBAN"]],
en:["Check if you can get Wohngeld","Wohngeld is a state rent subsidy for people on a low income who don't receive Grundsicherungsgeld. Many people qualify without knowing it.",
["Get a rough estimate with the official Wohngeld calculator.","Apply at your city's Wohngeldstelle — online in many cities.","It's paid from the month you apply, so apply straight away.","If you are entitled to BAB during your Ausbildung, you usually can't get Wohngeld."],
["Tenancy agreement","Proof of rent payments","Proof of income for all household members","Passport / residence permit","IBAN"]],
de:["Wohngeld prüfen","Wohngeld ist ein staatlicher Mietzuschuss für Menschen mit geringem Einkommen ohne Grundsicherungsgeld. Viele haben Anspruch und wissen es nicht.",
["Mit dem offiziellen Wohngeldrechner grob ausrechnen.","Antrag bei der Wohngeldstelle der Stadt stellen — vielerorts online.","Gezahlt wird ab dem Antragsmonat — also gleich beantragen.","Wer in der Ausbildung BAB-berechtigt ist, bekommt meist kein Wohngeld."],
["Mietvertrag","Nachweis der Mietzahlung","Einkommensnachweise aller Haushaltsmitglieder","Pass / Aufenthaltstitel","IBAN"]]

task({id:"debts",ph:2,ic:"coins",prio:13,off:"schuldner",tpl:["raten","bestreiten"],links:["schulden","vz"],when:p=>has(p.extra,"debts")},{
ru:["Взять долги под контроль","Долги в Германии быстро растут из-за пеней и коллекторов, но есть сильная защита и бесплатная помощь. Главное — не игнорировать письма.",
["Запишитесь в бесплатную Schuldnerberatung (Caritas, Diakonie, AWO, Verbraucherzentrale) — туда бывает очередь, поэтому сразу.","Сначала платите самое важное: аренду, свет и газ, медстраховку.","Попросите банк перевести ваш счёт в P-Konto (Pfändungsschutzkonto) — так базовая сумма защищена от ареста. Банк обязан это сделать.","Проверяйте каждое требование: не всякий Inkasso прав. Неверные долги оспаривайте письменно, верные — договаривайтесь о рассрочке (шаблоны ниже).","Пришёл Mahnbescheid из суда — у вас 2 недели на Widerspruch."],
["Все письма с требованиями","Выписки из банка","Договоры","Справки о доходах"]],
uz:["Qarzlarni nazoratga olish","Germaniyada qarzlar penya va kollektorlar tufayli tez oʻsadi, lekin kuchli himoya va bepul yordam bor. Eng muhimi — xatlarni eʼtiborsiz qoldirmaslik.",
["Bepul Schuldnerberatungga yoziling (Caritas, Diakonie, AWO, Verbraucherzentrale) — u yerda navbat boʻladi, shuning uchun darhol.","Avval eng muhimini toʻlang: ijara, elektr va gaz, tibbiy sugʻurta.","Bankdan hisobingizni P-Konto (Pfändungsschutzkonto)ga oʻtkazishni soʻrang — shunda asosiy summa xatlovdan himoyalanadi. Bank buni qilishga majbur.","Har bir talabni tekshiring: har bir Inkasso haq emas. Notoʻgʻri qarzlarga yozma eʼtiroz bildiring, toʻgʻrilarini boʻlib toʻlashga kelishing (pastdagi shablonlar).","Suddan Mahnbescheid kelsa — Widerspruch uchun 2 haftangiz bor."],
["Talablar bilan barcha xatlar","Bank koʻchirmalari","Shartnomalar","Daromad maʼlumotnomalari"]],
en:["Get your debts under control","Debts in Germany grow fast through fees and debt collectors, but there's strong protection and free help. Above all, don't ignore letters.",
["Book free debt advice (Caritas, Diakonie, AWO, consumer advice centre) — there are waiting lists, so do it now.","Pay the essentials first: rent, electricity and gas, health insurance.","Ask your bank to turn your account into a P-Konto (Pfändungsschutzkonto) — a basic amount is then protected from seizure. The bank must do this.","Check every claim: not every debt collector is right. Dispute wrong claims in writing; agree instalments for valid ones (templates below).","If a court sends a Mahnbescheid, you have 2 weeks to object."],
["All letters with claims","Bank statements","Contracts","Proof of income"]],
de:["Schulden in den Griff bekommen","Schulden wachsen in Deutschland durch Gebühren und Inkasso schnell — es gibt aber starken Schutz und kostenlose Hilfe. Das Wichtigste: Briefe nicht ignorieren.",
["Termin bei einer kostenlosen Schuldnerberatung machen (Caritas, Diakonie, AWO, Verbraucherzentrale) — Wartezeiten, also sofort.","Zuerst das Wichtigste zahlen: Miete, Strom und Gas, Krankenversicherung.","Konto bei der Bank in ein P-Konto (Pfändungsschutzkonto) umwandeln lassen — dann ist ein Grundbetrag vor Pfändung geschützt. Die Bank muss das tun.","Jede Forderung prüfen: nicht jedes Inkasso hat recht. Falsche Forderungen schriftlich bestreiten, berechtigte in Raten zahlen (Vorlagen unten).","Kommt ein Mahnbescheid vom Gericht: 2 Wochen Zeit für den Widerspruch."],
["Alle Forderungsschreiben","Kontoauszüge","Verträge","Einkommensnachweise"]]
});

task({id:"work_rights",ph:3,ic:"briefcase",prio:10,tpl:["krank_ag","kuend_arbeit"],links:["faire","ba"],when:p=>has(p.doing,"job")||has(p.ev,"newjob")||p.purpose==="work"},{
ru:["Знать свои права на работе","Работодатели иногда пользуются тем, что новички не знают правил. Эти права есть у всех работников в Германии, независимо от гражданства.",
["Требуйте письменный договор и ежемесячный расчётный лист (Lohnabrechnung). Минимальная оплата в 2026 году — 13,90 € в час брутто.","Заболели — сообщите работодателю в первый день до начала смены. Больничный врач передаёт в кассу электронно; работодатель получает его сам.","Отпуск — минимум 4 недели в год (20 дней при 5-дневной неделе). Испытательный срок — не больше 6 месяцев.","Не платят, заставляют работать без оформления, забирают паспорт — обратитесь в бесплатную консультацию «Faire Integration» или в профсоюз.","Хотите уволиться — только письменно и с подписью от руки (шаблон ниже)."],
["Трудовой договор","Расчётные листы","Учёт отработанных часов"]],
uz:["Ishdagi huquqlaringizni bilish","Ish beruvchilar baʼzan yangi kelganlar qoidalarni bilmasligidan foydalanadi. Bu huquqlar fuqaroligidan qatʼi nazar Germaniyadagi barcha xodimlarda bor.",
["Yozma shartnoma va oylik hisob varaqasini (Lohnabrechnung) talab qiling. 2026-yilda eng kam ish haqi — soatiga 13,90 € brutto.","Kasal boʻlsangiz — birinchi kuni smena boshlanishidan oldin ish beruvchiga xabar bering. Kasallik varaqasini shifokor kassaga elektron yuboradi; ish beruvchi uni oʻzi oladi.","Taʼtil — yiliga kamida 4 hafta (5 kunlik haftada 20 kun). Sinov muddati — 6 oydan koʻp emas.","Pul toʻlamasa, rasmiylashtirmasdan ishlatsa, pasportingizni olib qoʻysa — bepul «Faire Integration» maslahatiga yoki kasaba uyushmasiga murojaat qiling.","Ishdan ketmoqchi boʻlsangiz — faqat yozma va qoʻlda imzolangan holda (pastdagi shablon)."],
["Mehnat shartnomasi","Hisob varaqalari","Ishlagan soatlar hisobi"]],
en:["Know your rights at work","Some employers take advantage of newcomers not knowing the rules. These rights apply to every employee in Germany, whatever their nationality.",
["Insist on a written contract and a monthly payslip (Lohnabrechnung). The minimum wage in 2026 is €13.90 per hour gross.","If you're sick, tell your employer on the first day before your shift. The doctor sends the sick note to your insurer electronically; your employer retrieves it.","Holiday is at least 4 weeks a year (20 days on a 5-day week). Probation is at most 6 months.","Unpaid wages, work without papers or your passport taken away? Contact the free “Faire Integration” advice service or a trade union.","To resign, do it in writing with a handwritten signature (template below)."],
["Employment contract","Payslips","Record of hours worked"]],
de:["Ihre Rechte bei der Arbeit kennen","Manche Arbeitgeber nutzen aus, dass Neue die Regeln nicht kennen. Diese Rechte gelten für alle Beschäftigten in Deutschland — unabhängig von der Staatsangehörigkeit.",
["Schriftlichen Vertrag und monatliche Lohnabrechnung verlangen. Der Mindestlohn 2026 beträgt 13,90 € brutto pro Stunde.","Bei Krankheit am ersten Tag vor Arbeitsbeginn beim Arbeitgeber melden. Die AU übermittelt die Praxis elektronisch; der Arbeitgeber ruft sie ab.","Urlaub: mindestens 4 Wochen im Jahr (20 Tage bei 5-Tage-Woche). Probezeit: höchstens 6 Monate.","Lohn nicht gezahlt, Schwarzarbeit verlangt, Pass einbehalten? Kostenlose Beratung „Faire Integration“ oder Gewerkschaft kontaktieren.","Kündigen nur schriftlich mit eigenhändiger Unterschrift (Vorlage unten)."],
["Arbeitsvertrag","Lohnabrechnungen","Arbeitszeitnachweise"]]
});

task({id:"steuer",ph:3,ic:"doc",prio:30,off:"fa",links:["elster"],when:p=>working(p)||has(p.doing,"self")},{
ru:["Подать налоговую декларацию","Большинство работников получают после декларации деньги назад — за проезд на работу, рабочие расходы, переезд, курсы. Добровольно можно подать за 4 прошлых года.",
["Зарегистрируйтесь в ELSTER (бесплатно; код активации придёт по почте через 1–2 недели).","Соберите годовую справку о зарплате (Lohnsteuerbescheinigung) от работодателя и чеки расходов.","Если подача для вас обязательна (например, классы III/V, несколько работ, пособия больше 410 € в год), срок без консультанта — 31 июля следующего года.","Можно воспользоваться программой для деклараций или обществом помощи по налогам (Lohnsteuerhilfeverein).","Решение (Steuerbescheid) проверьте — на ошибку можно подать Einspruch в течение месяца."],
["Steuer-ID","Lohnsteuerbescheinigung","Чеки рабочих расходов","Расстояние до работы и дни поездок"]],
uz:["Soliq deklaratsiyasini topshirish","Koʻp xodimlar deklaratsiyadan keyin pulni qaytarib oladi — ishga qatnov, ish xarajatlari, koʻchish, kurslar uchun. Ixtiyoriy ravishda oʻtgan 4 yil uchun topshirish mumkin.",
["ELSTERda roʻyxatdan oʻting (bepul; faollashtirish kodi 1–2 haftada pochta orqali keladi).","Ish beruvchidan yillik maosh maʼlumotnomasini (Lohnsteuerbescheinigung) va xarajat cheklarini yigʻing.","Agar topshirish siz uchun majburiy boʻlsa (masalan, III/V sinflar, bir nechta ish, yiliga 410 € dan koʻp nafaqa), maslahatchisiz muddat — keyingi yilning 31-iyuli.","Deklaratsiya dasturi yoki soliq yordami jamiyatidan (Lohnsteuerhilfeverein) foydalanish mumkin.","Qarorni (Steuerbescheid) tekshiring — xatoga bir oy ichida Einspruch berish mumkin."],
["Steuer-ID","Lohnsteuerbescheinigung","Ish xarajatlari cheklari","Ishgacha masofa va qatnov kunlari"]],
en:["File your tax return","Most employees get money back after filing — for commuting, work expenses, moving, courses. You can file voluntarily for the past 4 years.",
["Register with ELSTER (free; the activation code arrives by post in 1–2 weeks).","Collect your annual pay certificate (Lohnsteuerbescheinigung) from your employer and receipts for expenses.","If filing is mandatory for you (e.g. tax classes III/V, several jobs, benefits over €410 a year), the deadline without an adviser is 31 July of the following year.","You can use tax software or a payroll tax help association (Lohnsteuerhilfeverein).","Check your tax assessment (Steuerbescheid) — you can object within one month."],
["Steuer-ID","Lohnsteuerbescheinigung","Receipts for work expenses","Distance to work and commuting days"]],
de:["Steuererklärung abgeben","Die meisten Beschäftigten bekommen Geld zurück — für Fahrtkosten, Arbeitsmittel, Umzug, Fortbildung. Freiwillig geht das 4 Jahre rückwirkend.",
["Bei ELSTER registrieren (kostenlos; der Aktivierungscode kommt in 1–2 Wochen per Post).","Lohnsteuerbescheinigung vom Arbeitgeber und Belege sammeln.","Bei Pflichtveranlagung (z. B. Steuerklassen III/V, mehrere Jobs, Lohnersatzleistungen über 410 € im Jahr) ist die Frist ohne Berater der 31. Juli des Folgejahres.","Steuersoftware oder ein Lohnsteuerhilfeverein helfen.","Steuerbescheid prüfen — Einspruch innerhalb eines Monats möglich."],
["Steuer-ID","Lohnsteuerbescheinigung","Belege für Werbungskosten","Entfernung zur Arbeit und Arbeitstage"]]
});

task({id:"steuerklasse",ph:3,ic:"heart",prio:40,off:"fa",links:["elster"],when:p=>has(p.ev,"marry")||(has(p.family,"partner")&&working(p))},{
ru:["Женаты? Выберите налоговый класс","После регистрации брака в Германии супругам автоматически дают класс IV/IV. Если доходы сильно отличаются, комбинация III/V даёт больше денег каждый месяц.",
["Сравните варианты в калькуляторе налогов или с Lohnsteuerhilfeverein.","Смена класса — через ELSTER (форма «Antrag auf Steuerklassenwechsel»).","Ждёте ребёнка — класс влияет на Elterngeld. Менять его нужно заранее, примерно за 7 месяцев до начала Mutterschutz.","При классах III/V налоговая декларация обязательна."],
["Steuer-ID обоих супругов","Свидетельство о браке"]],
uz:["Turmush qurdingizmi? Soliq sinfini tanlang","Germaniyada nikoh roʻyxatdan oʻtgach, er-xotinga avtomatik IV/IV sinf beriladi. Daromadlar juda farq qilsa, III/V kombinatsiyasi har oy koʻproq pul beradi.",
["Variantlarni soliq kalkulyatorida yoki Lohnsteuerhilfeverein bilan solishtiring.","Sinfni almashtirish — ELSTER orqali («Antrag auf Steuerklassenwechsel» shakli).","Farzand kutayotgan boʻlsangiz — sinf Elterngeldga taʼsir qiladi. Uni oldindan, Mutterschutz boshlanishidan taxminan 7 oy oldin almashtirish kerak.","III/V sinflarda soliq deklaratsiyasi majburiy."],
["Ikkala turmush oʻrtogʻining Steuer-ID raqami","Nikoh guvohnomasi"]],
en:["Married? Choose your tax classes","After your marriage is registered in Germany you're put in classes IV/IV automatically. If your incomes differ a lot, III/V gives you more money each month.",
["Compare options with a tax calculator or a Lohnsteuerhilfeverein.","Change classes via ELSTER (form “Antrag auf Steuerklassenwechsel”).","Expecting a baby? Your class affects Elterngeld — change it early, about 7 months before maternity protection starts.","With classes III/V, filing a tax return is mandatory."],
["Tax IDs of both spouses","Marriage certificate"]],
de:["Verheiratet? Steuerklassen wählen","Nach der Heirat werden Ehepaare automatisch in IV/IV eingestuft. Bei sehr unterschiedlichen Einkommen bringt III/V monatlich mehr Netto.",
["Mit einem Steuerrechner oder dem Lohnsteuerhilfeverein vergleichen.","Wechsel über ELSTER („Antrag auf Steuerklassenwechsel“).","Baby unterwegs? Die Steuerklasse beeinflusst das Elterngeld — rechtzeitig wechseln, etwa 7 Monate vor Beginn des Mutterschutzes.","Bei III/V ist die Steuererklärung Pflicht."],
["Steuer-ID beider Ehepartner","Heiratsurkunde"]]
});

task({id:"move",ph:3,ic:"truck",prio:15,off:"buergeramt",due:null,tpl:["kuend_wohnung","kaution","wgb"],links:["mieterbund"],when:p=>has(p.ev,"move")},{
ru:["Переезд: ничего не забыть","При переезде легко пропустить сроки: расторжение старой квартиры, регистрацию, возврат залога.",
["Расторгните старый договор письменно — обычно за 3 месяца (шаблон ниже).","При сдаче квартиры составьте протокол (Übergabeprotokoll) с фото и показаниями счётчиков.","В течение 2 недель после переезда сделайте Ummeldung в Bürgeramt (новый адрес наклеят и на карту ВНЖ).","Оформите пересылку почты (Nachsendeauftrag) и сообщите адрес: работодатель, банк, больничная касса, Jobcenter, Familienkasse, Rundfunkbeitrag.","Потребуйте назад залог (Kaution) — шаблон ниже. Если у вас ограничение по месту жительства (Wohnsitzauflage) — сначала спросите Ausländerbehörde."],
["Паспорт / ВНЖ","Новая Wohnungsgeberbestätigung","Старый и новый договор аренды"]],
uz:["Koʻchish: hech narsani unutmaslik","Koʻchishda muddatlarni oʻtkazib yuborish oson: eski kvartirani bekor qilish, roʻyxatdan oʻtish, garovni qaytarish.",
["Eski shartnomani yozma ravishda bekor qiling — odatda 3 oy oldin (pastdagi shablon).","Kvartirani topshirishda suratlar va hisoblagich koʻrsatkichlari bilan bayonnoma (Übergabeprotokoll) tuzing.","Koʻchgandan keyin 2 hafta ichida Bürgeramtda Ummeldung qiling (yangi manzil yashash ruxsatnomasi kartasiga ham yopishtiriladi).","Pochtani qayta yuborishni (Nachsendeauftrag) rasmiylashtiring va manzilni xabar qiling: ish beruvchi, bank, kassa, Jobcenter, Familienkasse, Rundfunkbeitrag.","Garovni (Kaution) qaytarishni talab qiling — pastdagi shablon. Yashash joyi cheklovi (Wohnsitzauflage) boʻlsa — avval Ausländerbehördedan soʻrang."],
["Pasport / yashash ruxsatnomasi","Yangi Wohnungsgeberbestätigung","Eski va yangi ijara shartnomasi"]],
en:["Moving house: don't miss a thing","Moving makes it easy to miss deadlines: terminating the old flat, re-registering, getting your deposit back.",
["Terminate the old tenancy in writing — usually 3 months' notice (template below).","When handing over the flat, make a handover record (Übergabeprotokoll) with photos and meter readings.","Within 2 weeks of moving, re-register (Ummeldung) at the Bürgeramt — the new address is also put on your residence card.","Set up mail forwarding (Nachsendeauftrag) and tell everyone your address: employer, bank, insurer, Jobcenter, Familienkasse, broadcasting fee.","Ask for your deposit back — template below. If you have a residence obligation (Wohnsitzauflage), ask the Ausländerbehörde first."],
["Passport / residence permit","New Wohnungsgeberbestätigung","Old and new tenancy agreement"]],
de:["Umzug: nichts vergessen","Beim Umzug gehen leicht Fristen unter: Kündigung der alten Wohnung, Ummeldung, Kaution.",
["Alte Wohnung schriftlich kündigen — meist 3 Monate Frist (Vorlage unten).","Bei der Übergabe ein Protokoll mit Fotos und Zählerständen machen.","Innerhalb von 2 Wochen beim Bürgeramt ummelden (die neue Adresse kommt auch auf den Aufenthaltstitel).","Nachsendeauftrag einrichten und Adresse mitteilen: Arbeitgeber, Bank, Krankenkasse, Jobcenter, Familienkasse, Rundfunkbeitrag.","Kaution zurückfordern — Vorlage unten. Bei Wohnsitzauflage vorher die Ausländerbehörde fragen."],
["Pass / Aufenthaltstitel","Neue Wohnungsgeberbestätigung","Alter und neuer Mietvertrag"]]
});

task({id:"joblost",ph:3,ic:"alert",prio:5,off:"aa",links:["ba","faire"],when:p=>has(p.ev,"joblost")},{
ru:["Потеряли работу: что делать в первые дни","Здесь важны дни: сроки для пособия и для оспаривания увольнения очень короткие.",
["В течение 3 дней после получения увольнения сообщите в Agentur für Arbeit, что ищете работу.","Считаете увольнение несправедливым — иск в суд по трудовым делам можно подать только в течение 3 недель. Сразу идите в профсоюз или к юристу.","Попросите у работодателя Arbeitszeugnis и Arbeitsbescheinigung; проверьте оплату неиспользованного отпуска.","Если ваш ВНЖ привязан к работе — сразу сообщите в Ausländerbehörde и получите консультацию: обычно есть время найти новую работу.","Ничего не подписывайте (например, Aufhebungsvertrag) без консультации — это может стоить пособия."],
["Письмо об увольнении","Трудовой договор","Расчётные листы","ВНЖ"]],
uz:["Ishni yoʻqotdingiz: dastlabki kunlarda nima qilish kerak","Bu yerda kunlar muhim: nafaqa va ishdan boʻshatishga eʼtiroz muddatlari juda qisqa.",
["Ishdan boʻshatish xatini olgandan keyin 3 kun ichida Agentur für Arbeitga ish qidirayotganingizni xabar qiling.","Boʻshatish adolatsiz deb hisoblasangiz — mehnat sudiga daʼvo faqat 3 hafta ichida beriladi. Darhol kasaba uyushmasi yoki advokatga boring.","Ish beruvchidan Arbeitszeugnis va Arbeitsbescheinigung soʻrang; foydalanilmagan taʼtil toʻlovini tekshiring.","Yashash ruxsatnomangiz ishga bogʻliq boʻlsa — darhol Ausländerbehördega xabar bering va maslahat oling: odatda yangi ish topishga vaqt bor.","Maslahatsiz hech narsaga imzo chekmang (masalan, Aufhebungsvertrag) — bu nafaqadan mahrum qilishi mumkin."],
["Ishdan boʻshatish xati","Mehnat shartnomasi","Hisob varaqalari","Yashash ruxsatnomasi"]],
en:["Lost your job: the first days","Days matter here: the deadlines for benefits and for challenging a dismissal are very short.",
["Within 3 days of receiving notice, tell the employment agency you're looking for work.","If the dismissal seems unfair, you can only sue at the labour court within 3 weeks. Go to a union or lawyer straight away.","Ask your employer for a reference (Arbeitszeugnis) and the Arbeitsbescheinigung; check payment for unused holiday.","If your residence permit is tied to your job, inform the Ausländerbehörde and get advice — there's usually time to find a new job.","Don't sign anything (e.g. a termination agreement) without advice — it can cost you benefits."],
["Notice of dismissal","Employment contract","Payslips","Residence permit"]],
de:["Job verloren: die ersten Tage","Jetzt zählen Tage: Die Fristen für Arbeitslosengeld und für eine Kündigungsschutzklage sind sehr kurz.",
["Innerhalb von 3 Tagen nach Erhalt der Kündigung bei der Agentur für Arbeit arbeitsuchend melden.","Kündigung unfair? Kündigungsschutzklage nur innerhalb von 3 Wochen möglich — sofort zur Gewerkschaft oder Anwält/in.","Arbeitszeugnis und Arbeitsbescheinigung anfordern; Abgeltung des Resturlaubs prüfen.","Hängt der Aufenthaltstitel am Job, die Ausländerbehörde informieren und beraten lassen — meist bleibt Zeit für eine neue Stelle.","Nichts unterschreiben (z. B. Aufhebungsvertrag) ohne Beratung — das kann eine Sperrzeit auslösen."],
["Kündigungsschreiben","Arbeitsvertrag","Lohnabrechnungen","Aufenthaltstitel"]]
});

task({id:"baby",ph:3,ic:"baby",prio:20,links:["famportal","elterngeld"],when:p=>has(p.family,"baby")||has(p.ev,"baby")},{
ru:["Ждём ребёнка: что подготовить","Многое лучше сделать до родов: потом не будет ни времени, ни сил, а некоторые сроки строгие.",
["Сообщите работодателю о беременности — с этого момента действует защита от увольнения. Mutterschutz: 6 недель до и 8 недель после родов, зарплата сохраняется.","Найдите акушерку (Hebamme) как можно раньше — её услуги оплачивает больничная касса, но свободных мало.","Хотите Elternzeit — подайте заявление работодателю не позже чем за 7 недель.","Заранее разберитесь с Elterngeld и налоговым классом — от них зависит сумма.","Найдите детского врача и выберите роддом, запишитесь на экскурсию."],
["Mutterpass","Карта больничной кассы","ВНЖ"]],
uz:["Farzand kutyapmiz: nimani tayyorlash kerak","Koʻp narsani tugʻruqdan oldin qilgan maʼqul: keyin vaqt ham, kuch ham boʻlmaydi, baʼzi muddatlar esa qatʼiy.",
["Ish beruvchiga homiladorlik haqida xabar bering — shu paytdan boshlab ishdan boʻshatishdan himoya amal qiladi. Mutterschutz: tugʻruqdan 6 hafta oldin va 8 hafta keyin, maosh saqlanadi.","Doyani (Hebamme) imkon qadar erta toping — xizmatini kassa toʻlaydi, lekin boʻshlari kam.","Elternzeit olmoqchi boʻlsangiz — ish beruvchiga kamida 7 hafta oldin ariza bering.","Elterngeld va soliq sinfi bilan oldindan shugʻullaning — summa ularga bogʻliq.","Bolalar shifokorini toping va tugʻruqxonani tanlang, ekskursiyaga yoziling."],
["Mutterpass","Kassa kartasi","Yashash ruxsatnomasi"]],
en:["Expecting a baby: what to prepare","A lot is easier before the birth — afterwards there's little time or energy, and some deadlines are strict.",
["Tell your employer about the pregnancy — from then on you're protected from dismissal. Maternity protection: 6 weeks before and 8 weeks after birth, with pay.","Find a midwife (Hebamme) as early as possible — the insurer pays, but few are free.","If you want parental leave (Elternzeit), apply to your employer at least 7 weeks in advance.","Sort out Elterngeld and your tax class early — they decide the amount.","Find a paediatrician and choose a hospital; book a tour."],
["Mutterpass","Health insurance card","Residence permit"]],
de:["Baby unterwegs: was vorbereiten","Vieles ist vor der Geburt leichter — danach fehlen Zeit und Kraft, und manche Fristen sind streng.",
["Arbeitgeber über die Schwangerschaft informieren — ab dann gilt Kündigungsschutz. Mutterschutz: 6 Wochen vor und 8 Wochen nach der Geburt, bei vollem Lohn.","So früh wie möglich eine Hebamme suchen — die Kasse zahlt, aber freie Hebammen sind knapp.","Elternzeit spätestens 7 Wochen vorher beim Arbeitgeber anmelden.","Elterngeld und Steuerklasse früh klären — sie bestimmen die Höhe.","Kinderarztpraxis suchen und Geburtsklinik auswählen."],
["Mutterpass","Gesundheitskarte","Aufenthaltstitel"]]
});

task({id:"born",ph:3,ic:"baby",prio:8,off:"standesamt",links:["elterngeld","famkasse","famportal"],when:p=>has(p.ev,"born")},{
ru:["Ребёнок родился: документы","Без свидетельства о рождении нельзя получить Kindergeld, Elterngeld и страховку для малыша. Elterngeld задним числом платят только за 3 месяца.",
["Зарегистрируйте рождение в Standesamt в течение недели (часто роддом передаёт документы сам) — получите Geburtsurkunde.","Внесите ребёнка в семейную страховку больничной кассы.","Подайте на Kindergeld и Elterngeld — Elterngeld в первые 3 месяца.","Если родители не граждане ЕС — оформите ребёнку документ на пребывание в Ausländerbehörde. Ребёнок может сразу получить немецкое гражданство, если один из родителей законно живёт в Германии 5 лет и имеет бессрочный ВНЖ.","Steuer-ID ребёнка придёт сама по почте — сохраните её."],
["Справка о рождении из роддома","Паспорта родителей","Свидетельство о браке с переводом","ВНЖ родителей"]],
uz:["Farzand tugʻildi: hujjatlar","Tugʻilganlik guvohnomasisiz Kindergeld, Elterngeld va chaqaloq uchun sugʻurta olib boʻlmaydi. Elterngeld orqaga faqat 3 oy uchun toʻlanadi.",
["Tugʻilishni bir hafta ichida Standesamtda roʻyxatdan oʻtkazing (koʻpincha tugʻruqxona hujjatlarni oʻzi yuboradi) — Geburtsurkunde olasiz.","Bolani kassaning oilaviy sugʻurtasiga kiriting.","Kindergeld va Elterngeldga ariza bering — Elterngeldni birinchi 3 oyda.","Ota-ona YeI fuqarosi boʻlmasa — Ausländerbehördeda bolaga yashash hujjatini rasmiylashtiring. Ota-onadan biri Germaniyada 5 yil qonuniy yashagan va muddatsiz ruxsatnomaga ega boʻlsa, bola darhol Germaniya fuqaroligini olishi mumkin.","Bolaning Steuer-ID raqami pochta orqali oʻzi keladi — uni saqlang."],
["Tugʻruqxonadan tugʻilganlik maʼlumotnomasi","Ota-onaning pasportlari","Tarjimali nikoh guvohnomasi","Ota-onaning yashash ruxsatnomalari"]],
en:["Baby is born: the paperwork","Without a birth certificate you can't get Kindergeld, Elterngeld or insurance for your baby. Elterngeld is paid back only for 3 months.",
["Register the birth at the Standesamt within a week (the hospital often sends the papers) — you get the Geburtsurkunde.","Add your baby to your family health insurance.","Apply for Kindergeld and Elterngeld — Elterngeld within the first 3 months.","If the parents aren't EU citizens, get a residence document for the baby at the Ausländerbehörde. The child can be German from birth if one parent has lived here lawfully for 5 years and holds an unlimited residence permit.","The baby's tax ID arrives by post — keep it."],
["Hospital birth notice","Parents' passports","Marriage certificate with translation","Parents' residence permits"]],
de:["Baby ist da: die Papiere","Ohne Geburtsurkunde kein Kindergeld, kein Elterngeld und keine Versicherung für das Baby. Elterngeld gibt es rückwirkend nur für 3 Monate.",
["Geburt innerhalb einer Woche beim Standesamt anzeigen (oft übernimmt das die Klinik) — Sie erhalten die Geburtsurkunde.","Kind in die Familienversicherung der Krankenkasse aufnehmen.","Kindergeld und Elterngeld beantragen — Elterngeld in den ersten 3 Monaten.","Haben die Eltern keinen EU-Pass, für das Kind einen Aufenthaltstitel bei der Ausländerbehörde beantragen. Das Kind wird mit Geburt deutsch, wenn ein Elternteil seit 5 Jahren rechtmäßig hier lebt und ein unbefristetes Aufenthaltsrecht hat.","Die Steuer-ID des Kindes kommt per Post — aufbewahren."],
["Geburtsbescheinigung der Klinik","Pässe der Eltern","Heiratsurkunde mit Übersetzung","Aufenthaltstitel der Eltern"]]
});

task({id:"permit_extend",ph:3,ic:"clock",prio:12,off:"abh",due:{from:"valid"},tpl:["abh_termin","sachstand"],links:["bamf"],when:p=>["permit","bluecard","fiktion"].includes(p.status)||has(p.ev,"permitend")},{
ru:["Вовремя продлить ВНЖ","Ausländerbehörde во многих городах перегружены. Если срок карты истечёт без поданного заявления, вы теряете законное пребывание и право работать.",
["Укажите ниже, до какого числа действует ваша карта, — мы напомним о сроке.","Запросите термин за 2–3 месяца до окончания, лучше письменно (шаблон ниже).","Термина нет, а срок подходит — отправьте заявление о продлении письменно ДО окончания карты и сохраните доказательство. Тогда до решения вы остаётесь легально (Fiktionswirkung).","Затягивается решение — отправьте запрос о статусе (Sachstandsanfrage)."],
["Паспорт","Текущая карта ВНЖ","Биометрическое фото","Договор о работе и 3 последние зарплаты (или справка об учёбе)","Договор аренды","Подтверждение медстраховки","Сертификаты немецкого"]],
uz:["Yashash ruxsatnomasini oʻz vaqtida uzaytirish","Koʻp shaharlarda Ausländerbehörde haddan tashqari band. Karta muddati ariza berilmasdan tugasa, qonuniy yashash va ishlash huquqidan mahrum boʻlasiz.",
["Kartangiz qaysi sanagacha amal qilishini pastda koʻrsating — muddatni eslatamiz.","Tugashidan 2–3 oy oldin terminni soʻrang, yaxshisi yozma (pastdagi shablon).","Termin yoʻq, muddat yaqinlashsa — uzaytirish arizasini karta tugashidan OLDIN yozma yuboring va isbotni saqlang. Shunda qaror chiqquncha qonuniy qolasiz (Fiktionswirkung).","Qaror choʻzilsa — holat soʻrovini (Sachstandsanfrage) yuboring."],
["Pasport","Joriy yashash ruxsatnomasi kartasi","Biometrik surat","Ish shartnomasi va oxirgi 3 ta maosh (yoki oʻqish maʼlumotnomasi)","Ijara shartnomasi","Tibbiy sugʻurta tasdigʻi","Nemis tili sertifikatlari"]],
en:["Extend your residence permit on time","Immigration offices in many cities are overloaded. If your card expires without an application, you lose your lawful stay and right to work.",
["Enter your card's expiry date below — we'll remind you of the deadline.","Request an appointment 2–3 months before it expires, ideally in writing (template below).","No appointment and time running out? Send your extension application in writing BEFORE the card expires and keep proof. You then stay lawfully until the decision (Fiktionswirkung).","Decision taking long? Send a status enquiry (Sachstandsanfrage)."],
["Passport","Current residence card","Biometric photo","Employment contract and last 3 payslips (or certificate of enrolment)","Tenancy agreement","Proof of health insurance","German certificates"]],
de:["Aufenthaltstitel rechtzeitig verlängern","Viele Ausländerbehörden sind überlastet. Läuft die Karte ohne Antrag ab, verlieren Sie den rechtmäßigen Aufenthalt und die Arbeitserlaubnis.",
["Ablaufdatum unten eintragen — wir erinnern Sie an die Frist.","2–3 Monate vor Ablauf einen Termin anfragen, am besten schriftlich (Vorlage unten).","Kein Termin in Sicht? Den Verlängerungsantrag VOR Ablauf schriftlich stellen und den Nachweis aufbewahren. Dann gilt der Aufenthalt bis zur Entscheidung fort (Fiktionswirkung).","Dauert es lange, eine Sachstandsanfrage schicken."],
["Pass","Aktuelle Aufenthaltskarte","Biometrisches Foto","Arbeitsvertrag und letzte 3 Gehaltsnachweise (oder Studienbescheinigung)","Mietvertrag","Nachweis Krankenversicherung","Deutschzertifikate"]]
});

task({id:"niederlassung",ph:4,ic:"check",prio:10,off:"abh",tpl:["abh_termin"],links:["bamf","oet"],when:p=>nonEU(p)&&["visa","permit","bluecard","fiktion"].includes(p.status)},{
ru:["Путь к ПМЖ (Niederlassungserlaubnis)","Бессрочный вид на жительство не нужно продлевать, и он даёт больше свободы в работе. Сроки зависят от вашего статуса — готовиться стоит заранее.",
["Специалисты (§ 18c): через 3 года с ВНЖ для специалистов и 36 месяцев взносов в пенсионную кассу.","Blue Card: через 27 месяцев работы, а с немецким B1 — через 21 месяц.","Общее правило: 5 лет ВНЖ и 60 месяцев пенсионных взносов, B1 и тест «Leben in Deutschland».","Везде нужны: обеспеченность без пособий, жильё, медстраховка. Проверьте свой стаж взносов в Deutsche Rentenversicherung.","Запросите термин в Ausländerbehörde заранее."],
["Паспорт и ВНЖ","Выписка о пенсионных взносах (Versicherungsverlauf)","Договор о работе и зарплаты","Сертификат немецкого","Сертификат «Leben in Deutschland»","Договор аренды"]],
uz:["Doimiy yashashga yoʻl (Niederlassungserlaubnis)","Muddatsiz yashash ruxsatnomasini uzaytirish shart emas va u ishda koʻproq erkinlik beradi. Muddatlar maqomingizga bogʻliq — oldindan tayyorlaning.",
["Mutaxassislar (§ 18c): mutaxassis yashash ruxsatnomasi bilan 3 yil va pensiya kassasiga 36 oylik badaldan keyin.","Blue Card: 27 oy ishlagandan keyin, nemis tili B1 bilan — 21 oydan keyin.","Umumiy qoida: 5 yillik yashash ruxsatnomasi va 60 oylik pensiya badali, B1 va «Leben in Deutschland» testi.","Hamma joyda kerak: nafaqasiz taʼminlanganlik, uy-joy, tibbiy sugʻurta. Deutsche Rentenversicherungda badal stajingizni tekshiring.","Ausländerbehördedan terminni oldindan soʻrang."],
["Pasport va yashash ruxsatnomasi","Pensiya badallari koʻchirmasi (Versicherungsverlauf)","Ish shartnomasi va maoshlar","Nemis tili sertifikati","«Leben in Deutschland» sertifikati","Ijara shartnomasi"]],
en:["Path to permanent residence (Niederlassungserlaubnis)","A permanent permit never needs extending and gives you more freedom at work. The timeline depends on your status — prepare early.",
["Skilled workers (§ 18c): after 3 years with a skilled-worker permit and 36 months of pension contributions.","Blue Card: after 27 months of work — or 21 months with B1 German.","General rule: 5 years with a residence permit and 60 months of pension contributions, B1 and the “Leben in Deutschland” test.","Always required: secure income without benefits, housing, health insurance. Check your contribution record with the Deutsche Rentenversicherung.","Request an appointment at the Ausländerbehörde in good time."],
["Passport and residence permit","Pension contribution record (Versicherungsverlauf)","Employment contract and payslips","German certificate","“Leben in Deutschland” certificate","Tenancy agreement"]],
de:["Weg zur Niederlassungserlaubnis","Die Niederlassungserlaubnis muss nie verlängert werden und gibt mehr Freiheit im Beruf. Die Fristen hängen vom Status ab — früh vorbereiten.",
["Fachkräfte (§ 18c): nach 3 Jahren mit Fachkräfte-Titel und 36 Monaten Rentenbeiträgen.","Blaue Karte: nach 27 Monaten Beschäftigung, mit Deutsch B1 nach 21 Monaten.","Allgemein: 5 Jahre Aufenthaltserlaubnis, 60 Monate Rentenbeiträge, B1 und Test „Leben in Deutschland“.","Immer nötig: gesicherter Lebensunterhalt ohne Sozialleistungen, Wohnraum, Krankenversicherung. Versicherungsverlauf bei der Deutschen Rentenversicherung prüfen.","Rechtzeitig einen Termin bei der Ausländerbehörde anfragen."],
["Pass und Aufenthaltstitel","Versicherungsverlauf","Arbeitsvertrag und Gehaltsnachweise","Deutschzertifikat","Zertifikat „Leben in Deutschland“","Mietvertrag"]]
});

task({id:"einbuergerung",ph:4,ic:"star",prio:20,off:"einb",tpl:["sachstand"],links:["oet","bamf"],when:p=>nonEU(p)&&p.status!=="duldung"&&p.status!=="gestattung"},{
ru:["Гражданство Германии","С 2024 года можно стать гражданином, сохранив прежнее гражданство (если это разрешает и ваша страна). Ускоренное получение за 3 года отменено с 30 октября 2025 года.",
["Обычно нужно: 5 лет законного проживания, немецкий B1, тест на гражданство (Einbürgerungstest), обеспеченность без пособий, отсутствие серьёзных судимостей.","Супруги граждан Германии: часто достаточно 3 лет проживания, если брак длится больше 2 лет.","Тренируйте тест бесплатно на сайте BAMF и сдайте его в Volkshochschule.","Подайте заявление в Einbürgerungsbehörde вашего города — во многих городах онлайн. Ожидание бывает долгим.","Госпошлина — 255 € за взрослого."],
["Паспорт и ВНЖ","Сертификат B1","Сертификат Einbürgerungstest","Справки о доходах и договор о работе","Свидетельства о рождении и браке","Meldebescheinigung"]],
uz:["Germaniya fuqaroligi","2024-yildan avvalgi fuqarolikni saqlagan holda fuqaro boʻlish mumkin (agar mamlakatingiz ham ruxsat bersa). 3 yilda tezlashtirilgan olish 2025-yil 30-oktabrdan bekor qilingan.",
["Odatda kerak: 5 yil qonuniy yashash, nemis tili B1, fuqarolik testi (Einbürgerungstest), nafaqasiz taʼminlanganlik, jiddiy sudlanganlik yoʻqligi.","Germaniya fuqarolarining turmush oʻrtoqlari: nikoh 2 yildan oshgan boʻlsa, koʻpincha 3 yil yashash yetarli.","Testni BAMF saytida bepul mashq qiling va Volkshochschuleda topshiring.","Shahringiz Einbürgerungsbehördesiga ariza bering — koʻp shaharlarda onlayn. Kutish uzoq boʻladi.","Davlat boji — kattalar uchun 255 €."],
["Pasport va yashash ruxsatnomasi","B1 sertifikati","Einbürgerungstest sertifikati","Daromad maʼlumotnomalari va ish shartnomasi","Tugʻilganlik va nikoh guvohnomalari","Meldebescheinigung"]],
en:["German citizenship","Since 2024 you can become German and keep your old citizenship (if your country allows it). The fast track after 3 years was abolished on 30 October 2025.",
["Usually required: 5 years of lawful residence, B1 German, the citizenship test (Einbürgerungstest), secure income without benefits and no serious criminal record.","Spouses of German citizens: often 3 years of residence if married for more than 2 years.","Practise the test for free on the BAMF website and take it at a Volkshochschule.","Apply at your city's naturalisation office — online in many cities. Waiting times can be long.","The fee is €255 per adult."],
["Passport and residence permit","B1 certificate","Citizenship test certificate","Proof of income and employment contract","Birth and marriage certificates","Meldebescheinigung"]],
de:["Deutsche Staatsangehörigkeit","Seit 2024 können Sie Deutsche/r werden und Ihre bisherige Staatsangehörigkeit behalten (wenn Ihr Herkunftsland es zulässt). Die Einbürgerung nach 3 Jahren wurde zum 30. Oktober 2025 abgeschafft.",
["Meist nötig: 5 Jahre rechtmäßiger Aufenthalt, Deutsch B1, Einbürgerungstest, gesicherter Lebensunterhalt ohne Sozialleistungen, keine erheblichen Straftaten.","Ehepartner von Deutschen: oft 3 Jahre Aufenthalt, wenn die Ehe seit über 2 Jahren besteht.","Den Test kostenlos beim BAMF üben und an einer Volkshochschule ablegen.","Antrag bei der Einbürgerungsbehörde stellen — vielerorts online. Die Wartezeiten sind oft lang.","Die Gebühr beträgt 255 € pro erwachsener Person."],
["Pass und Aufenthaltstitel","B1-Zertifikat","Einbürgerungstest-Zertifikat","Einkommensnachweise und Arbeitsvertrag","Geburts- und Heiratsurkunden","Meldebescheinigung"]]
});

n:t4("Попросить Wohnungsgeberbestätigung","Wohnungsgeberbestätigung soʻrash","Ask for the Wohnungsgeberbestätigung","Wohnungsgeberbestätigung anfordern"),
w:t4("Без этой справки от арендодателя нельзя сделать Anmeldung. Арендодатель обязан выдать её в течение 2 недель после въезда.","Uy egasidan bu maʼlumotnomasiz Anmeldung qilib boʻlmaydi. Uy egasi uni koʻchib kirgandan keyin 2 hafta ichida berishi shart.","You can't register without this form from your landlord. They must issue it within 2 weeks of your move-in.","Ohne sie keine Anmeldung. Der Vermieter muss sie innerhalb von 2 Wochen nach Einzug ausstellen."),
s:v=>`Bitte um Wohnungsgeberbestätigung – ${v.objekt||"…"}`,
b:v=>`ich bin${v.einzug?` am ${v.einzug}`:""} in die Wohnung ${v.objekt||"…"} eingezogen. Für die Anmeldung beim Bürgeramt benötige ich die Wohnungsgeberbestätigung nach § 19 Bundesmeldegesetz.\n\nIch bitte Sie, mir diese möglichst bald auszustellen und zuzusenden, gerne auch per E-Mail. Die Frist für die Anmeldung beträgt zwei Wochen.\n\nVielen Dank für Ihre Unterstützung.`},
{id:"wohnungsbewerbung",cat:"home",f:["to","objekt","personen","beruf","einzug","tel"],
n:t4("Отклик на квартиру","Kvartiraga javob","Apply for a flat","Bewerbung um eine Wohnung"),
w:t4("Короткое вежливое письмо арендодателю — отправляйте в первые часы после объявления.","Uy egasiga qisqa xushmuomala xat — eʼlondan keyingi birinchi soatlarda yuboring.","A short, polite message to the landlord — send it within hours of the listing.","Kurze, höfliche Nachricht an den Vermieter — schnell nach der Anzeige senden."),
s:v=>`Anfrage zur Wohnung ${v.objekt||""}`.trim(),
b:v=>`mit großem Interesse habe ich Ihre Anzeige für die Wohnung ${v.objekt||"…"} gelesen und würde mich sehr über einen Besichtigungstermin freuen.\n\nKurz zu mir: Ich bin ${v.beruf||"…"} und habe ein regelmäßiges Einkommen. Einziehen würden ${v.personen||"…"}. Pünktliche Mietzahlungen und ein gutes Verhältnis zur Nachbarschaft sind für mich selbstverständlich.${v.einzug?` Ein Einzug wäre ab dem ${v.einzug} möglich.`:""}\n\nMieterselbstauskunft, SCHUFA-Auskunft, Einkommensnachweise und Mietschuldenfreiheitsbescheinigung kann ich Ihnen sofort zusenden.\n\n${v.tel?`Sie erreichen mich telefonisch unter ${v.tel} oder per E-Mail.`:"Sie erreichen mich jederzeit per E-Mail."} Ich freue mich auf Ihre Rückmeldung.`},
{id:"maengel",cat:"home",f:["to","objekt","mangel","beschr","seitm","fristm"],
n:t4("Жалоба на неисправность: плесень, отопление (Mängelanzeige)","Nosozlik haqida shikoyat: mogʻor, isitish (Mängelanzeige)","Report a defect: mould, heating (Mängelanzeige)","Mängelanzeige an den Vermieter"),
w:t4("В квартире плесень, не работает отопление или вода. Письменное уведомление защищает вас и даёт право на снижение аренды, пока проблему не устранят.","Kvartirada mogʻor bor, isitish yoki suv ishlamaydi. Yozma xabarnoma sizni himoya qiladi va muammo tuzatilguncha ijara haqini kamaytirish huquqini beradi.","Mould, no heating or no water. Written notice protects you and lets you reduce the rent until it's fixed.","Schimmel, Heizung oder Wasser defekt. Die schriftliche Anzeige schützt Sie und ermöglicht eine Mietminderung."),
s:v=>`Mängelanzeige – ${v.objekt||"meine Wohnung"}`,
b:v=>{const m=(v.mangel||[]).map(k=>pick("mangel",k)).filter(Boolean);return `hiermit zeige ich Ihnen folgende Mängel in meiner Wohnung ${v.objekt||"…"} an, die seit dem ${v.seitm} bestehen:\n\n${m.length?m.map(x=>"– "+x).join("\n"):"– …"}${v.beschr?`\n\n${v.beschr}`:""}\n\nIch fordere Sie auf, die Mängel bis zum ${v.fristm} zu beseitigen, und bitte um kurzfristige Mitteilung eines Termins für die Besichtigung bzw. Reparatur.\n\nDie Miete zahle ich ab sofort nur unter Vorbehalt. Eine Mietminderung nach § 536 BGB sowie weitere Ansprüche behalte ich mir ausdrücklich vor.`}},
{id:"kuend_wohnung",cat:"home",f:["to","objekt","kzum"],
n:t4("Расторгнуть аренду квартиры (вы — арендатор)","Kvartira ijarasini bekor qilish (siz — ijarachi)","End your tenancy (as tenant)","Kündigung der Wohnung durch den Mieter"),
w:t4("Вы съезжаете. Обычно срок — 3 месяца; письмо должно дойти до 3-го рабочего дня месяца. Подпишите от руки и отправьте Einschreiben.","Koʻchib ketyapsiz. Odatda muddat — 3 oy; xat oyning 3-ish kunigacha yetib borishi kerak. Qoʻlda imzolang va Einschreiben bilan yuboring.","You're moving out. Notice is usually 3 months and must arrive by the 3rd working day of the month. Sign by hand and send by registered mail.","Sie ziehen aus. Frist meist 3 Monate; Zugang bis zum 3. Werktag des Monats. Eigenhändig unterschreiben, per Einschreiben."),
s:v=>`Kündigung des Mietverhältnisses – ${v.objekt||"…"}`,
b:v=>`hiermit kündige ich das Mietverhältnis über die Wohnung ${v.objekt||"…"} fristgerecht ${v.kzum?`zum ${v.kzum}`:"zum nächstmöglichen Zeitpunkt"}.\n\nBitte bestätigen Sie mir den Eingang der Kündigung und das Ende des Mietverhältnisses schriftlich. Für die Wohnungsübergabe bitte ich um einen Terminvorschlag.\n\nDie Mietkaution bitte ich nach Rückgabe der Wohnung auf mein Konto zu überweisen; die Bankverbindung teile ich Ihnen bei der Übergabe mit.`},
{id:"kaution",cat:"home",f:["to","objekt","auszug","betrag","iban"],
n:t4("Потребовать назад залог (Kaution)","Garovni (Kaution) qaytarishni talab qilish","Ask for your deposit back","Rückzahlung der Mietkaution"),
w:t4("Вы съехали, а залог не вернули. Обычно у арендодателя есть несколько месяцев на расчёт, но бесспорную часть можно требовать раньше.","Koʻchib ketdingiz, garov qaytarilmadi. Odatda uy egasida hisob-kitob uchun bir necha oy bor, lekin bahssiz qismini oldinroq talab qilish mumkin.","You moved out and haven't got your deposit back. Landlords usually get a few months to settle, but the undisputed part can be claimed sooner.","Sie sind ausgezogen, die Kaution fehlt noch. Vermieter haben einige Monate Zeit, den unstrittigen Teil kann man früher verlangen."),
s:v=>`Rückzahlung der Mietkaution – ${v.objekt||"…"}`,
b:v=>`das Mietverhältnis über die Wohnung ${v.objekt||"…"} ist beendet; die Wohnung habe ich am ${v.auszug} ordnungsgemäß an Sie zurückgegeben.\n\nIch bitte Sie, mir die Mietkaution${v.betrag?` in Höhe von ${v.betrag} €`:""} zuzüglich Zinsen innerhalb von zwei Wochen auf folgendes Konto zu überweisen:\n\n${v.iban||"IBAN: …"}\n\nSollten Sie einen Teil der Kaution für eine noch ausstehende Betriebskostenabrechnung einbehalten wollen, bitte ich um Auszahlung des übrigen Betrags und um eine nachvollziehbare Begründung für den Einbehalt.`},
{id:"miete",cat:"home",f:["to","d1","mende","haerte","grund"],
n:t4("Возражение на расторжение аренды (§ 574 BGB)","Ijarani bekor qilishga eʼtiroz (§ 574 BGB)","Objection to your landlord's notice (§ 574 BGB)","Widerspruch gegen Kündigung (§ 574 BGB)"),
w:t4("Арендодатель расторгает договор, а переезд для вас — серьёзная тяжесть. Не позже чем за 2 месяца до конца аренды. Лучше вместе с Mieterverein.","Uy egasi shartnomani bekor qilmoqda, koʻchish esa siz uchun jiddiy qiyinchilik. Ijara tugashidan kamida 2 oy oldin. Mieterverein bilan birga qilgan maʼqul.","Your landlord gave notice and moving would be a serious hardship. At least 2 months before the tenancy ends. Best done with a tenants' association.","Kündigung durch den Vermieter, Umzug wäre eine Härte. Spätestens 2 Monate vor Mietende, am besten mit dem Mieterverein."),
s:v=>`Widerspruch gegen Ihre Kündigung vom ${v.d1}`,
b:v=>{const h=(v.haerte||[]).map(k=>pick("haerte",k)).filter(Boolean);return `Ihrer Kündigung vom ${v.d1}${v.mende&&v.mende!=="…"?` zum ${v.mende}`:""} widerspreche ich gemäß § 574 BGB und verlange die Fortsetzung des Mietverhältnisses auf unbestimmte Zeit.\n\n${h.length?`Die Beendigung des Mietverhältnisses wäre für mich eine Härte, die auch unter Würdigung Ihrer berechtigten Interessen nicht zu rechtfertigen ist, weil ${h.join("; ")}.`:"Die Beendigung des Mietverhältnisses wäre für mich eine nicht zu rechtfertigende Härte."}${v.grund?`\n\n${v.grund}`:""}\n\nDie Wirksamkeit der Kündigung lasse ich darüber hinaus rechtlich prüfen. Bitte bestätigen Sie mir den Eingang dieses Schreibens.`}},
{id:"belege",cat:"home",f:["to","jahr","d1"],
n:t4("Проверить счета за коммунальные (Belegeinsicht)","Kommunal hisoblarni tekshirish (Belegeinsicht)","Inspect utility receipts (Belegeinsicht)","Belegeinsicht zur Nebenkostenabrechnung"),
w:t4("Nebenkostenabrechnung кажется слишком большой. Вы просите показать оригиналы счетов.","Nebenkostenabrechnung juda katta tuyuladi. Asl hisob-fakturalarni koʻrsatishni soʻraysiz.","Your utility bill looks too high. You ask to see the original invoices.","Die Nebenkostenabrechnung erscheint zu hoch."),
s:v=>`Betriebskostenabrechnung${v.jahr?` ${v.jahr}`:""} vom ${v.d1} – Bitte um Belegeinsicht`,
b:v=>`zu Ihrer Betriebskostenabrechnung${v.jahr?` für ${v.jahr}`:""} vom ${v.d1} bitte ich um Einsicht in die Originalbelege (§ 259 BGB). Bitte nennen Sie mir hierfür einen Termin.\n\nBis zur Belegeinsicht mache ich bezüglich der geforderten Nachzahlung ein Zurückbehaltungsrecht geltend. Weitere Einwendungen gegen die Abrechnung behalte ich mir vor.`},
{id:"rundfunk",cat:"home",f:["to","az","mbname","mbnr","seit"],
n:t4("Rundfunkbeitrag: за квартиру уже платят","Rundfunkbeitrag: xonadon uchun toʻlanmoqda","Broadcasting fee: the flat already pays","Rundfunkbeitrag: Wohnung bereits angemeldet"),
w:t4("Живёте в WG или с семьёй, а письмо пришло и вам. В поле «Номер дела» — ваша Beitragsnummer, если есть.","WG yoki oila bilan yashaysiz, lekin xat sizga ham keldi. «Ish raqami» maydoniga — Beitragsnummer raqamingiz, boʻlsa.","You share a flat or live with family but got a letter too. Put your own Beitragsnummer in the reference field, if you have one.","WG oder Familie, trotzdem Post bekommen. Eigene Beitragsnummer ins Feld Aktenzeichen."),
s:v=>`Rundfunkbeitrag${v.az?` – Beitragsnummer ${v.az}`:""} – Wohnung bereits angemeldet`,
b:v=>`für meine Wohnung unter der oben genannten Anschrift wird der Rundfunkbeitrag bereits von ${v.mbname||"…"} unter der Beitragsnummer ${v.mbnr||"…"} gezahlt. Ich wohne dort seit dem ${v.seit}.\n\nBitte melden Sie mein Beitragskonto ab bzw. legen Sie kein eigenes Beitragskonto für mich an. Bitte bestätigen Sie mir dies schriftlich.`},
/* work */
{id:"krank_ag",cat:"work",f:["to","krankab","krankbis"],
n:t4("Сообщить работодателю о болезни","Ish beruvchiga kasallik haqida xabar berish","Tell your employer you're sick","Krankmeldung an den Arbeitgeber"),
w:t4("Заболели — сообщите в первый день до начала смены (лучше позвонить и отправить это письмо). Больничный от врача работодатель получит электронно.","Kasal boʻlsangiz — birinchi kuni smena boshlanishidan oldin xabar bering (qoʻngʻiroq qilib, bu xatni yuborgan maʼqul). Shifokor varaqasini ish beruvchi elektron oladi.","If you're sick, tell your employer on the first day before your shift (call and send this message). They get the doctor's note electronically.","Am ersten Tag vor Arbeitsbeginn melden (anrufen und diese Nachricht senden). Die AU ruft der Arbeitgeber elektronisch ab."),
s:v=>`Krankmeldung ab ${v.krankab}`,
b:v=>`leider bin ich erkrankt und kann ab dem ${v.krankab} nicht zur Arbeit kommen.${v.krankbis?` Voraussichtlich bin ich bis einschließlich ${v.krankbis} arbeitsunfähig.`:" Wie lange ich ausfalle, teile ich Ihnen nach dem Arztbesuch mit."}\n\nIch gehe heute zum Arzt; die Arbeitsunfähigkeitsbescheinigung wird elektronisch an meine Krankenkasse übermittelt und kann von Ihnen dort abgerufen werden.\n\nVielen Dank für Ihr Verständnis.`},
{id:"kuend_arbeit",cat:"work",f:["to","kzum"],
n:t4("Уволиться по собственному желанию","Oʻz xohishi bilan ishdan ketish","Resign from your job","Kündigung des Arbeitsvertrags"),
w:t4("Только на бумаге с подписью от руки — e-mail и WhatsApp недействительны. Проверьте срок в договоре. Сначала найдите новую работу или встаньте на учёт в Agentur für Arbeit — иначе возможен перерыв в пособии.","Faqat qogʻozda va qoʻlda imzo bilan — e-mail va WhatsApp haqiqiy emas. Shartnomadagi muddatni tekshiring. Avval yangi ish toping yoki Agentur für Arbeitda roʻyxatdan oʻting — aks holda nafaqada tanaffus boʻlishi mumkin.","Only on paper with a handwritten signature — email and WhatsApp don't count. Check the notice period in your contract. Find a new job or register with the employment agency first, or your benefits may be suspended.","Nur schriftlich mit Unterschrift — E-Mail/WhatsApp unwirksam. Kündigungsfrist im Vertrag prüfen. Vorher neuen Job oder arbeitsuchend melden, sonst droht eine Sperrzeit."),
s:v=>`Kündigung meines Arbeitsverhältnisses`,
b:v=>`hiermit kündige ich mein Arbeitsverhältnis ordentlich und fristgerecht ${v.kzum?`zum ${v.kzum}`:"zum nächstmöglichen Zeitpunkt"}.\n\nBitte bestätigen Sie mir den Erhalt der Kündigung sowie das genaue Ende des Arbeitsverhältnisses schriftlich. Ich bitte außerdem um ein qualifiziertes Arbeitszeugnis und um Abgeltung meines Resturlaubs, soweit dieser nicht mehr genommen werden kann.\n\nFür die gute Zusammenarbeit bedanke ich mich.`},
/* money */
{id:"raten",cat:"money",f:["to","az","betrag","rate","start"],
n:t4("Попросить рассрочку (Ratenzahlung)","Boʻlib toʻlashni soʻrash (Ratenzahlung)","Ask to pay in instalments","Ratenzahlung beantragen"),
w:t4("Долг правильный, но заплатить сразу не получается. Учтите: просьба о рассрочке почти всегда признаёт долг.","Qarz toʻgʻri, lekin darhol toʻlay olmaysiz. Eʼtibor bering: boʻlib toʻlashni soʻrash deyarli har doim qarzni tan olish demakdir.","The debt is correct but you can't pay at once. Note: asking for instalments almost always acknowledges the debt.","Die Forderung stimmt, aber Sie können nicht alles auf einmal zahlen. Achtung: Das gilt meist als Anerkenntnis."),
s:v=>`Antrag auf Ratenzahlung${v.az?` – ${v.az}`:""}`,
b:v=>`den offenen Betrag in Höhe von ${v.betrag||"…"} € kann ich aufgrund meiner aktuellen finanziellen Situation leider nicht in einer Summe begleichen.\n\nIch biete Ihnen an, den Betrag in monatlichen Raten von ${v.rate||"…"} € zu zahlen, beginnend am ${v.start}.\n\nBitte bestätigen Sie mir die Ratenzahlung schriftlich. Ich bitte darum, während der vereinbarten Ratenzahlung von weiteren Mahn- oder Inkassokosten abzusehen.`},
{id:"bestreiten",cat:"money",f:["to","az","d1","betrag","breason"],
n:t4("Оспорить долг (Forderung bestreiten)","Qarzga eʼtiroz bildirish (Forderung bestreiten)","Dispute a claim","Forderung bestreiten"),
w:t4("Mahnung или Inkasso за то, что вы не должны. Письмо также запрещает передавать ваши данные в SCHUFA.","Siz qarzdor boʻlmagan narsa uchun Mahnung yoki Inkasso. Xat maʼlumotlaringizni SCHUFAga berishni ham taqiqlaydi.","A reminder or debt collector for something you don't owe. The letter also objects to your data being passed to SCHUFA.","Mahnung oder Inkasso für etwas, das Sie nicht schulden — mit Widerspruch gegen SCHUFA-Meldung."),
s:v=>`Ihre Forderung vom ${v.d1}${v.az?`, Az.: ${v.az}`:""} – Widerspruch`,
b:v=>`Ihre Forderung vom ${v.d1}${v.betrag?` in Höhe von ${v.betrag} €`:""} bestreite ich hiermit.\n\n${pick("breason",v.breason)}\n\nIch fordere Sie auf, mir den zugrunde liegenden Vertrag sowie eine nachvollziehbare Aufstellung der Forderung vorzulegen. Bis dahin werde ich keine Zahlung leisten.\n\nDa die Forderung bestritten ist, widerspreche ich ausdrücklich einer Übermittlung meiner Daten an Auskunfteien wie die SCHUFA.`},
{id:"kuend",cat:"money",f:["to","az","sonder","d1"],
n:t4("Расторгнуть договор (связь, спортзал, свет)","Shartnomani bekor qilish (aloqa, sport zali, elektr)","Cancel a contract (phone, gym, electricity)","Vertrag kündigen (Handy, Fitness, Strom)"),
w:t4("Хотите закончить подписку или договор. Если было повышение цены — отметьте это.","Obuna yoki shartnomani tugatmoqchisiz. Narx oshgan boʻlsa — belgilang.","You want to end a subscription or contract. Tick the box if prices went up.","Sie möchten einen Vertrag beenden. Bei Preiserhöhung ankreuzen."),
s:v=>`Kündigung${v.az?` – Vertrags-/Kundennummer ${v.az}`:""}`,
b:v=>`hiermit kündige ich den oben genannten Vertrag fristgerecht zum nächstmöglichen Zeitpunkt.${v.sonder?`\n\nZugleich mache ich wegen Ihrer Preiserhöhung${v.d1&&v.d1!=="…"?` vom ${v.d1}`:""} von meinem Sonderkündigungsrecht Gebrauch.`:""}\n\nBitte bestätigen Sie mir die Kündigung sowie das genaue Vertragsende schriftlich. Eine erteilte Einzugsermächtigung widerrufe ich zum Vertragsende. Einer Kontaktaufnahme zu Werbe- oder Rückgewinnungszwecken widerspreche ich.`},
/* family */
{id:"kita_anfrage",cat:"family",f:["to","kname","kgeb","kab","kstd"],
n:t4("Заявка на место в детском саду","Bolalar bogʻchasida joy uchun ariza","Request a daycare place","Anfrage Kita-Platz"),
w:t4("Отправьте в несколько садов сразу и в Jugendamt — у ребёнка с 1 года есть право на место.","Bir nechta bogʻchaga va Jugendamtga birdaniga yuboring — 1 yoshdan bolaning joy olish huquqi bor.","Send it to several daycare centres and to the Jugendamt — children have a right to a place from age 1.","An mehrere Kitas und das Jugendamt senden — ab 1 Jahr besteht ein Rechtsanspruch."),
s:v=>`Anfrage Betreuungsplatz für ${v.kname||"mein Kind"} ab ${v.kab}`,
b:v=>`ich suche einen Betreuungsplatz für mein Kind ${v.kname||"…"}, geboren am ${v.kgeb}, ab dem ${v.kab}${v.kstd?` für etwa ${v.kstd} Stunden täglich`:""}.\n\nBitte teilen Sie mir mit, ob Sie zu diesem Zeitpunkt einen Platz anbieten können bzw. wie ich mein Kind auf Ihre Warteliste setzen kann. Gerne komme ich zu einem Kennenlerntermin vorbei.\n\nIch weise darauf hin, dass mein Kind einen Rechtsanspruch auf einen Betreuungsplatz nach § 24 SGB VIII hat.`}
];

i:{ru:"После окончания срока решение становится окончательным (bestandskräftig), и оспорить его почти невозможно.",uz:"Muddat tugagach, qaror yakuniy boʻladi (bestandskräftig) va unga eʼtiroz bildirish deyarli imkonsiz."}},
