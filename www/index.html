/* Layout: one narrow paper column, sticky letterhead on top, tab bar at the bottom like a phone app.
   Subject world: German official mail — recycled paper, ballpoint-blue ink, red "Frist" stamps, green "Erledigt" stamps. */
:root{
  --bg:#EFF0EA; --surface:#FBFBF7; --sunk:#E6E8E0; --ink:#17223B; --muted:#596277; --line:#D6D9CF;
  --accent:#2343A6; --accent-ink:#FFFFFF; --accent-soft:#E2E7F6;
  --stamp:#B3261E; --stamp-soft:#F6E1DE; --warn:#9A5800; --warn-soft:#F8ECD6; --ok:#2B6A4C; --ok-soft:#DDEDE3;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141C; --surface:#171D28; --sunk:#0C1017; --ink:#E6E9F0; --muted:#9AA3B6; --line:#283042;
  --accent:#8FA7FF; --accent-ink:#0E1630; --accent-soft:#1D274A;
  --stamp:#FF8A80; --stamp-soft:#3B1D1C; --warn:#F0B55A; --warn-soft:#382A13; --ok:#7FD0A5; --ok-soft:#163128; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#171D28; --sunk:#0C1017; --ink:#E6E9F0; --muted:#9AA3B6; --line:#283042;
  --accent:#8FA7FF; --accent-ink:#0E1630; --accent-soft:#1D274A;
  --stamp:#FF8A80; --stamp-soft:#3B1D1C; --warn:#F0B55A; --warn-soft:#382A13; --ok:#7FD0A5; --ok-soft:#163128; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 112px}

/* letterhead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:660px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;text-align:left}
.mark{width:32px;height:32px;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em;font-weight:700;display:block;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.langbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--stamp);color:var(--surface);font-size:10.5px;font-weight:700;line-height:17px}

/* common */
.sec{display:flex;flex-direction:column;gap:14px;padding-top:20px}
.h{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25;letter-spacing:-.01em}
.h2{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.3}
.sub{color:var(--muted);font-size:14.5px}
.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:6px 10px;font-size:13.5px;min-height:34px}
.btn.wide{width:100%}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--sunk);color:var(--ink)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=search],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13.5px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{font-size:13.5px;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;color:var(--muted)}
.back{align-self:flex-start;padding-left:0}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;gap:18px}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.ob-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.ob-step{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none}
.ob h1{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.25;letter-spacing:-.01em}
.ob .q-hint{color:var(--muted);font-size:15px;margin-top:-8px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:56px;width:100%}
.opt .oi{width:36px;height:36px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--accent)}
.opt .oi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.opt .ot{display:flex;flex-direction:column;min-width:0;flex:1}
.opt .ot b{font-weight:600;font-size:16px;line-height:1.3}
.opt .ot small{color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px}
.opt .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.multi .ck{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .ck::after{content:"";width:10px;height:6px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ob-nav{display:flex;gap:10px;margin-top:auto;padding-top:8px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);padding-bottom:env(safe-area-inset-bottom,0px)}
.ob-nav .btn{flex:1;min-height:50px;font-size:16px}
.ob-nav .btn.ghost{flex:0 0 auto}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang-grid .opt{flex-direction:column;align-items:flex-start;gap:2px;min-height:72px}
.lang-grid .opt b{font-size:17px}
.welcome-art{display:flex;align-items:center;gap:14px}
.welcome-art svg{width:56px;height:56px;flex:none}
.welcome-art b{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.01em}

/* plan */
.hello{display:flex;flex-direction:column;gap:10px}
.prog-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prog-big .n{font-family:var(--f-mono);font-weight:600;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.prog-big .of{color:var(--muted);font-size:15px}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--stamp-soft);gap:2px}
.meter .g{background:var(--ok)} .meter .y{background:var(--warn)} .meter .r{background:var(--stamp);opacity:.8}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

task({id:"anmeldung",ph:1,ic:"home",prio:10,off:"buergeramt",due:{from:"arrival",days:14},tpl:["wgb"],links:["bund"],when:p=>!sheltered(p)},{
ru:["Зарегистрировать адрес (Anmeldung)","Это первый и главный шаг: без справки о регистрации (Meldebescheinigung) не откроют счёт, не дадут Steuer-ID, ВНЖ и пособия. Сделать нужно в течение 2 недель после заселения. Услуга бесплатная.",
["Попросите у арендодателя или главного квартиросъёмщика бланк Wohnungsgeberbestätigung — он обязан его выдать.","Запишитесь на термин в Bürgeramt онлайн. Если свободных мест нет, проверяйте сайт рано утром — термины часто освобождаются.","Заполните бланк Anmeldung (есть на сайте города) и приходите со всеми документами. Регистрируйте сразу всю семью.","Получите Meldebescheinigung и храните её — её будут спрашивать постоянно."],
["Загранпаспорт или ID","Wohnungsgeberbestätigung","Заполненный бланк Anmeldung","Свидетельства о браке и рождении детей с переводом (если регистрируете семью)"]],
uz:["Manzilni roʻyxatdan oʻtkazish (Anmeldung)","Bu birinchi va eng muhim qadam: roʻyxat maʼlumotnomasisiz (Meldebescheinigung) hisob ochilmaydi, Steuer-ID, yashash ruxsatnomasi va nafaqalar berilmaydi. Koʻchib kelgandan keyin 2 hafta ichida qilish kerak. Xizmat bepul.",
["Uy egasi yoki asosiy ijarachidan Wohnungsgeberbestätigung blankasini soʻrang — u berishga majbur.","Bürgeramtda onlayn terminga yoziling. Boʻsh joy boʻlmasa, saytni erta tongda tekshiring — terminlar tez-tez boʻshaydi.","Anmeldung blankasini toʻldiring (shahar saytida bor) va barcha hujjatlar bilan keling. Butun oilani birdaniga roʻyxatdan oʻtkazing.","Meldebescheinigungni oling va saqlang — uni doim soʻrashadi."],
["Xorijiy pasport yoki ID","Wohnungsgeberbestätigung","Toʻldirilgan Anmeldung blankasi","Tarjima qilingan nikoh va bolalar tugʻilganlik guvohnomalari (oilani roʻyxatdan oʻtkazsangiz)"]],
en:["Register your address (Anmeldung)","This is the first and most important step: without the registration certificate (Meldebescheinigung) you can't open a bank account or get a tax ID, residence permit or benefits. Do it within 2 weeks of moving in. It's free.",
["Ask your landlord or main tenant for the Wohnungsgeberbestätigung form — they must give it to you.","Book an appointment at the Bürgeramt online. If nothing is free, check early in the morning — slots open up often.","Fill in the Anmeldung form (on the city website) and bring all documents. Register your whole family at once.","Keep the Meldebescheinigung safe — you will be asked for it again and again."],
["Passport or ID card","Wohnungsgeberbestätigung","Completed Anmeldung form","Marriage and children's birth certificates with translation (if registering family)"]],
de:["Wohnsitz anmelden (Anmeldung)","Der erste und wichtigste Schritt: Ohne Meldebescheinigung gibt es kein Konto, keine Steuer-ID, keinen Aufenthaltstitel und keine Leistungen. Frist: 2 Wochen nach Einzug. Die Anmeldung ist kostenlos.",
["Wohnungsgeberbestätigung beim Vermieter oder Hauptmieter anfordern — er muss sie ausstellen.","Online einen Termin beim Bürgeramt buchen. Ist nichts frei, früh morgens nachsehen — Termine werden oft wieder frei.","Anmeldeformular ausfüllen (auf der Website der Stadt) und mit allen Unterlagen hingehen. Die ganze Familie gleich mit anmelden.","Meldebescheinigung gut aufbewahren — sie wird immer wieder verlangt."],
["Reisepass oder Personalausweis","Wohnungsgeberbestätigung","Ausgefülltes Anmeldeformular","Heirats- und Geburtsurkunden mit Übersetzung (bei Familienanmeldung)"]]
});

task({id:"insurance",ph:1,ic:"shield",prio:20,links:["gkv","k116117"],when:p=>arrived(p)||has(p.extra,"noins")},{
ru:["Оформить медицинскую страховку","В Германии страховка обязательна для всех. Без неё вас не возьмут на работу или учёбу, а лечение придётся оплачивать самому.",
["Работаете или в Ausbildung — выберите государственную больничную кассу (TK, AOK, Barmer, DAK и др.) и подайте заявление онлайн. Взнос делится с работодателем.","Отдайте работодателю подтверждение членства (Mitgliedsbescheinigung).","Студентам страховка нужна для зачисления; получаете пособие от Jobcenter — страховку оформляет Jobcenter; в процедуре убежища — лечение через Sozialamt.","Получите карту eGK (касса попросит фото) и всегда берите её к врачу."],
["Паспорт / ВНЖ","Meldebescheinigung","Договор о работе или зачисление","Фото для карты"]],
uz:["Tibbiy sugʻurta rasmiylashtirish","Germaniyada sugʻurta hamma uchun majburiy. Usiz ishga yoki oʻqishga olishmaydi, davolanish uchun esa oʻzingiz toʻlashingiz kerak boʻladi.",
["Ishlasangiz yoki Ausbildungda boʻlsangiz — davlat kasalxona kassasini tanlang (TK, AOK, Barmer, DAK va b.) va onlayn ariza bering. Badal ish beruvchi bilan boʻlinadi.","Ish beruvchiga aʼzolik tasdigʻini (Mitgliedsbescheinigung) bering.","Talabalarga sugʻurta qabul uchun kerak; Jobcenterdan nafaqa olsangiz — sugʻurtani Jobcenter rasmiylashtiradi; boshpana jarayonida — davolanish Sozialamt orqali.","eGK kartasini oling (kassa surat soʻraydi) va shifokorga doim olib boring."],
["Pasport / yashash ruxsatnomasi","Meldebescheinigung","Ish shartnomasi yoki qabul","Karta uchun surat"]],
en:["Get health insurance","Health insurance is mandatory for everyone in Germany. Without it you can't start work or study, and you'd pay for treatment yourself.",
["If you work or do an Ausbildung, choose a statutory health insurer (TK, AOK, Barmer, DAK etc.) and apply online. Your employer pays half.","Give your employer the membership certificate (Mitgliedsbescheinigung).","Students need insurance to enrol; if you get Jobcenter benefits, the Jobcenter insures you; in the asylum procedure, care is arranged by the Sozialamt.","Get your eGK card (the insurer asks for a photo) and always take it to the doctor."],
["Passport / residence permit","Meldebescheinigung","Employment contract or admission letter","Photo for the card"]],
de:["Krankenversicherung abschließen","In Deutschland ist eine Krankenversicherung Pflicht. Ohne sie kein Arbeits- oder Studienbeginn — und Behandlungen müssten Sie selbst zahlen.",
["Bei Arbeit oder Ausbildung eine gesetzliche Krankenkasse wählen (TK, AOK, Barmer, DAK usw.) und online beantragen. Der Arbeitgeber zahlt die Hälfte.","Die Mitgliedsbescheinigung beim Arbeitgeber abgeben.","Studierende brauchen die Versicherung zur Einschreibung; mit Leistungen vom Jobcenter versichert Sie das Jobcenter; im Asylverfahren läuft die Versorgung über das Sozialamt.","Gesundheitskarte (eGK) bekommen (Foto nötig) und immer zum Arzt mitnehmen."],
["Pass / Aufenthaltstitel","Meldebescheinigung","Arbeitsvertrag oder Zulassung","Foto für die Karte"]]
});

task({id:"bank",ph:1,ic:"card",prio:30,off:"bank",when:p=>arrived(p)},{
ru:["Открыть банковский счёт","Зарплата, пособия, аренда и почти все счета в Германии проходят через банковский перевод. По закону каждому, кто законно находится в ЕС, положен базовый счёт (Basiskonto).",
["Сравните банки: Sparkasse и Volksbank — с отделениями; онлайн-банки — дешевле, но принимают не все паспорта.","Возьмите паспорт и Meldebescheinigung; некоторые банки просят ВНЖ.","Если отказали — попросите Basiskonto: банк обязан объяснить отказ письменно.","Подключите онлайн-банк и сообщите IBAN работодателю и ведомствам."],
["Загранпаспорт","Meldebescheinigung","ВНЖ или виза"]],
uz:["Bank hisobi ochish","Maosh, nafaqalar, ijara va deyarli barcha hisoblar Germaniyada bank oʻtkazmasi orqali boʻladi. Qonunga koʻra YeIda qonuniy boʻlgan har kimga asosiy hisob (Basiskonto) beriladi.",
["Banklarni solishtiring: Sparkasse va Volksbank — filiallari bor; onlayn banklar — arzonroq, lekin hamma pasportni qabul qilmaydi.","Pasport va Meldebescheinigungni oling; baʼzi banklar yashash ruxsatnomasini soʻraydi.","Rad etishsa — Basiskonto soʻrang: bank rad sababini yozma tushuntirishi shart.","Onlayn bankni ulang va IBANni ish beruvchi va idoralarga xabar qiling."],
["Xorijiy pasport","Meldebescheinigung","Yashash ruxsatnomasi yoki viza"]],
en:["Open a bank account","Salary, benefits, rent and nearly all bills in Germany go by bank transfer. By law, anyone legally in the EU is entitled to a basic account (Basiskonto).",
["Compare banks: Sparkasse and Volksbank have branches; online banks are cheaper but don't accept every passport.","Bring your passport and Meldebescheinigung; some banks ask for your residence permit.","If refused, ask for a Basiskonto — the bank must explain any refusal in writing.","Set up online banking and give your IBAN to your employer and authorities."],
["Passport","Meldebescheinigung","Residence permit or visa"]],
de:["Bankkonto eröffnen","Lohn, Leistungen, Miete und fast alle Rechnungen laufen per Überweisung. Jede Person mit rechtmäßigem Aufenthalt in der EU hat Anspruch auf ein Basiskonto.",
["Banken vergleichen: Sparkasse und Volksbank mit Filialen; Onlinebanken sind günstiger, akzeptieren aber nicht jeden Pass.","Pass und Meldebescheinigung mitnehmen; manche Banken wollen den Aufenthaltstitel sehen.","Bei Ablehnung ein Basiskonto verlangen — die Bank muss eine Ablehnung schriftlich begründen.","Onlinebanking einrichten und die IBAN an Arbeitgeber und Ämter geben."],
["Reisepass","Meldebescheinigung","Aufenthaltstitel oder Visum"]]
});

task({id:"permit_first",ph:1,ic:"card",prio:15,off:"abh",due:{from:"valid"},tpl:["abh_termin","sachstand"],links:["bamf"],when:p=>p.status==="visa"},{
ru:["Получить ВНЖ вместо визы","Национальная виза действует ограниченное время. До её окончания нужно подать заявление на вид на жительство (Aufenthaltstitel) в Ausländerbehörde, иначе пребывание станет незаконным.",
["Посмотрите, до какого числа действует виза, и укажите дату ниже — мы посчитаем срок.","Сразу после Anmeldung запишитесь в Ausländerbehörde: очереди бывают на месяцы.","Если до окончания визы термина нет — отправьте заявление письменно или по e-mail ДО окончания визы (шаблон ниже). Тогда пребывание считается законным до решения.","Принесите документы; карту (eAT) изготовят за несколько недель."],
["Паспорт с визой","Биометрическое фото","Meldebescheinigung","Подтверждение медстраховки","Договор о работе, Ausbildung или зачисление","Договор аренды","Заполненное заявление (Antrag auf Erteilung eines Aufenthaltstitels)"]],
uz:["Viza oʻrniga yashash ruxsatnomasi olish","Milliy viza cheklangan muddat amal qiladi. U tugashidan oldin Ausländerbehördega yashash ruxsatnomasi (Aufenthaltstitel) uchun ariza berish kerak, aks holda yashashingiz noqonuniy boʻladi.",
["Viza qaysi sanagacha amal qilishini qarang va pastda koʻrsating — muddatni hisoblaymiz.","Anmeldungdan keyin darhol Ausländerbehördega yoziling: navbatlar oylab boʻladi.","Viza tugaguncha termin boʻlmasa — arizani viza tugashidan OLDIN yozma yoki e-mail orqali yuboring (pastdagi shablon). Shunda qaror chiqquncha yashash qonuniy hisoblanadi.","Hujjatlarni olib keling; karta (eAT) bir necha haftada tayyorlanadi."],
["Vizali pasport","Biometrik surat","Meldebescheinigung","Tibbiy sugʻurta tasdigʻi","Ish, Ausbildung shartnomasi yoki qabul","Ijara shartnomasi","Toʻldirilgan ariza (Antrag auf Erteilung eines Aufenthaltstitels)"]],
en:["Get a residence permit to replace your visa","A national visa is only valid for a limited time. Before it expires you must apply for a residence permit (Aufenthaltstitel) at the Ausländerbehörde, otherwise your stay becomes unlawful.",
["Check the expiry date of your visa and enter it below — we'll calculate the deadline.","Right after your Anmeldung, book an appointment at the Ausländerbehörde: waiting times can be months.","If you can't get an appointment before your visa expires, send the application in writing or by email BEFORE it expires (template below). Your stay then counts as lawful until a decision.","Bring your documents; the card (eAT) takes a few weeks to produce."],
["Passport with visa","Biometric photo","Meldebescheinigung","Proof of health insurance","Employment / Ausbildung contract or university admission","Tenancy agreement","Completed application form"]],
de:["Aufenthaltstitel nach dem Visum beantragen","Das nationale Visum gilt nur befristet. Vor Ablauf müssen Sie bei der Ausländerbehörde einen Aufenthaltstitel beantragen, sonst wird der Aufenthalt unrechtmäßig.",
["Ablaufdatum des Visums prüfen und unten eintragen — wir berechnen die Frist.","Direkt nach der Anmeldung einen Termin bei der Ausländerbehörde anfragen: Wartezeiten von Monaten sind möglich.","Gibt es keinen Termin vor Ablauf, den Antrag VOR Ablauf schriftlich oder per E-Mail stellen (Vorlage unten). Dann gilt der Aufenthalt bis zur Entscheidung als erlaubt.","Unterlagen mitbringen; die Karte (eAT) wird in einigen Wochen hergestellt."],
["Pass mit Visum","Biometrisches Foto","Meldebescheinigung","Nachweis Krankenversicherung","Arbeits-/Ausbildungsvertrag oder Immatrikulation","Mietvertrag","Ausgefüllter Antrag auf Erteilung eines Aufenthaltstitels"]]
});

task({id:"ua_register",ph:1,ic:"shield",prio:12,off:"abh",links:["ua","bamfnavi"],when:p=>p.purpose==="ukraine"&&arrived(p)},{
ru:["Оформить статус временной защиты (§ 24)","Карта ВНЖ по § 24 даёт право жить, работать, учиться и получать помощь. Срок защиты продлевается решениями ЕС — следите за новостями на germany4ukraine.de.",
["Сделайте Anmeldung по месту жительства.","Подайте заявление на Aufenthaltserlaubnis по § 24 в Ausländerbehörde; пока его рассматривают, вы получите Fiktionsbescheinigung.","Обратитесь за выплатами: в зависимости от даты приезда отвечает Jobcenter или Sozialamt — уточните у них.","Запишитесь на интеграционный курс — вы имеете на него право."],
["Загранпаспорт или ID-карта Украины","Свидетельства о рождении детей","Meldebescheinigung","Биометрическое фото"]],
uz:["Vaqtinchalik himoya maqomini rasmiylashtirish (§ 24)","§ 24 boʻyicha karta yashash, ishlash, oʻqish va yordam olish huquqini beradi. Himoya muddati YeI qarorlari bilan uzaytiriladi — germany4ukraine.de saytida yangiliklarni kuzating.",
["Yashash joyingiz boʻyicha Anmeldung qiling.","Ausländerbehördega § 24 boʻyicha Aufenthaltserlaubnis arizasini bering; koʻrib chiqilguncha Fiktionsbescheinigung olasiz.","Toʻlovlar uchun murojaat qiling: kelgan sanangizga qarab Jobcenter yoki Sozialamt javob beradi — ulardan aniqlang.","Integratsiya kursiga yoziling — bunga haqingiz bor."],
["Ukraina xorijiy pasporti yoki ID kartasi","Bolalarning tugʻilganlik guvohnomalari","Meldebescheinigung","Biometrik surat"]],
en:["Register for temporary protection (§ 24)","The § 24 residence permit lets you live, work, study and receive support. Protection is extended by EU decisions — follow the news on germany4ukraine.de.",
["Do your Anmeldung at your place of residence.","Apply for the § 24 residence permit at the Ausländerbehörde; while it is processed you get a Fiktionsbescheinigung.","Apply for support: depending on your arrival date, the Jobcenter or the Sozialamt is responsible — ask them.","Sign up for an integration course — you are entitled to one."],
["Ukrainian passport or ID card","Children's birth certificates","Meldebescheinigung","Biometric photo"]],
de:["Vorübergehenden Schutz beantragen (§ 24)","Der Aufenthaltstitel nach § 24 erlaubt Wohnen, Arbeiten, Lernen und Unterstützung. Der Schutz wird durch EU-Beschlüsse verlängert — Neuigkeiten auf germany4ukraine.de.",
["Wohnsitz anmelden.","Aufenthaltserlaubnis nach § 24 bei der Ausländerbehörde beantragen; während der Bearbeitung gibt es eine Fiktionsbescheinigung.","Leistungen beantragen: je nach Einreisedatum ist Jobcenter oder Sozialamt zuständig — dort nachfragen.","Für einen Integrationskurs anmelden — Sie haben einen Anspruch."],
["Ukrainischer Pass oder ID-Karte","Geburtsurkunden der Kinder","Meldebescheinigung","Biometrisches Foto"]]
});

task({id:"asyl_steps",ph:1,ic:"shield",prio:12,off:"asyl",links:["proasyl","bamf","bamfnavi"],when:p=>p.purpose==="protection"},{
ru:["Подготовиться к процедуре убежища","Главный момент — собеседование (Anhörung) в BAMF: решение основано на ваших словах. Хорошая подготовка сильно влияет на результат. Если у вас уже Duldung, тоже обязательно получите консультацию — бывают пути к ВНЖ.",
["Найдите бесплатную консультацию по процедуре убежища (Asylverfahrensberatung) — до собеседования.","На Anhörung рассказывайте всё подробно и по порядку, с датами; принесите все доказательства. Вы имеете право на переводчика на вашем языке.","В конце попросите перевести протокол и исправьте ошибки до подписи.","Всегда сообщайте новый адрес — письма из BAMF приходят по почте, и сроки ответа короткие.","Работать можно только с разрешением Ausländerbehörde — спросите о нём."],
["Ankunftsnachweis / Aufenthaltsgestattung","Паспорт и любые документы личности","Доказательства: справки, фото, документы","Письма от BAMF"]],
uz:["Boshpana jarayoniga tayyorlanish","Eng muhimi — BAMFdagi suhbat (Anhörung): qaror sizning soʻzlaringizga asoslanadi. Yaxshi tayyorgarlik natijaga kuchli taʼsir qiladi. Agar sizda Duldung boʻlsa ham, albatta maslahat oling — yashash ruxsatnomasiga yoʻllar boʻladi.",
["Boshpana jarayoni boʻyicha bepul maslahatni (Asylverfahrensberatung) suhbatdan oldin toping.","Anhörungda hammasini batafsil va tartib bilan, sanalar bilan aytib bering; barcha dalillarni olib keling. Oʻz tilingizda tarjimonga haqingiz bor.","Oxirida bayonnomani tarjima qilishni soʻrang va imzolashdan oldin xatolarni tuzating.","Yangi manzilni doim xabar qiling — BAMF xatlari pochta orqali keladi, javob muddatlari qisqa.","Faqat Ausländerbehörde ruxsati bilan ishlash mumkin — u haqda soʻrang."],
["Ankunftsnachweis / Aufenthaltsgestattung","Pasport va har qanday shaxs hujjatlari","Dalillar: maʼlumotnomalar, suratlar, hujjatlar","BAMF xatlari"]],
en:["Prepare for the asylum procedure","The key moment is the interview (Anhörung) at the BAMF: the decision rests on what you say. Good preparation makes a big difference. If you already have a Duldung, get advice too — there can be routes to a residence permit.",
["Find free asylum procedure advice (Asylverfahrensberatung) before your interview.","At the Anhörung, tell everything in detail and in order, with dates, and bring all evidence. You have the right to an interpreter in your language.","At the end, ask for the record to be translated back and correct mistakes before signing.","Always report a new address — BAMF letters come by post and reply deadlines are short.","You may only work with permission from the Ausländerbehörde — ask about it."],
["Arrival certificate / Aufenthaltsgestattung","Passport and any identity papers","Evidence: certificates, photos, documents","Letters from the BAMF"]],
de:["Auf das Asylverfahren vorbereiten","Entscheidend ist die Anhörung beim BAMF: Die Entscheidung beruht auf Ihren Aussagen. Gute Vorbereitung macht viel aus. Auch mit Duldung unbedingt beraten lassen — es gibt Wege zu einem Aufenthaltstitel.",
["Vor der Anhörung eine kostenlose Asylverfahrensberatung suchen.","In der Anhörung alles ausführlich, der Reihe nach und mit Daten erzählen; alle Beweise mitbringen. Sie haben Anspruch auf Dolmetschung in Ihrer Sprache.","Am Ende die Rückübersetzung des Protokolls verlangen und Fehler vor der Unterschrift korrigieren.","Neue Adressen immer melden — BAMF-Post kommt per Brief, die Fristen sind kurz.","Arbeiten nur mit Erlaubnis der Ausländerbehörde — danach fragen."],
["Ankunftsnachweis / Aufenthaltsgestattung","Pass und alle Identitätsdokumente","Beweise: Bescheinigungen, Fotos, Dokumente","Briefe vom BAMF"]]
});

task({id:"spaet_steps",ph:1,ic:"home",prio:12,off:"buergeramt",links:["bva","drv"],when:p=>p.purpose==="spaet"},{
ru:["Оформить документы позднего переселенца","Справка позднего переселенца (Spätaussiedlerbescheinigung) подтверждает немецкое гражданство. С ней вы получаете паспорт ФРГ, право на бесплатный интеграционный курс и признание стажа для пенсии.",
["Получите Spätaussiedlerbescheinigung в BVA (обычно оформляется после регистрации во Friedland) — храните оригинал.","Сделайте Anmeldung и закажите немецкий Personalausweis и Reisepass в Bürgeramt.","В Standesamt можно подать заявление о немецкой форме имени и фамилии (Namenserklärung).","Сообщите о стаже в Deutsche Rentenversicherung — трудовые годы на родине могут учитываться для пенсии.","Подайте документы на признание диплома."],
["Spätaussiedlerbescheinigung","Registrierschein","Паспорт страны выезда","Свидетельства о рождении и браке","Трудовая книжка"]],
uz:["Kech koʻchib kelgan hujjatlarini rasmiylashtirish","Kech koʻchib kelgan maʼlumotnomasi (Spätaussiedlerbescheinigung) Germaniya fuqaroligini tasdiqlaydi. U bilan GFR pasporti, bepul integratsiya kursi va pensiya uchun stajni tan olish huquqini olasiz.",
["BVAdan Spätaussiedlerbescheinigung oling (odatda Friedlandda roʻyxatdan oʻtgandan keyin) — aslini saqlang.","Anmeldung qiling va Bürgeramtda nemis Personalausweis va Reisepass buyurtma qiling.","Standesamtda ism va familiyaning nemischa shakli haqida ariza (Namenserklärung) berish mumkin.","Deutsche Rentenversicherungga stajingiz haqida xabar bering — vatandagi ish yillari pensiya uchun hisobga olinishi mumkin.","Diplomni tan olish uchun hujjat topshiring."],
["Spätaussiedlerbescheinigung","Registrierschein","Chiqib kelgan davlat pasporti","Tugʻilganlik va nikoh guvohnomalari","Mehnat daftarchasi"]],
en:["Sort out your late-repatriate papers","The late-repatriate certificate (Spätaussiedlerbescheinigung) proves your German citizenship. With it you get a German passport, a free integration course and your work years counted for your pension.",
["Get your Spätaussiedlerbescheinigung from the BVA (usually issued after registration in Friedland) — keep the original safe.","Do your Anmeldung and order a German ID card and passport at the Bürgeramt.","At the Standesamt you can declare a German form of your first and last name (Namenserklärung).","Report your work history to the Deutsche Rentenversicherung — years worked abroad may count towards your pension.","Apply for recognition of your qualifications."],
["Spätaussiedlerbescheinigung","Registrierschein","Passport of your former country","Birth and marriage certificates","Employment record book"]],
de:["Unterlagen als Spätaussiedler/in erledigen","Die Spätaussiedlerbescheinigung belegt Ihre deutsche Staatsangehörigkeit. Damit bekommen Sie einen deutschen Pass, einen kostenlosen Integrationskurs und Ihre Arbeitsjahre für die Rente berücksichtigt.",
["Spätaussiedlerbescheinigung vom BVA erhalten (meist nach der Registrierung in Friedland) — Original sicher aufbewahren.","Anmelden und beim Bürgeramt Personalausweis und Reisepass beantragen.","Beim Standesamt ist eine Namenserklärung möglich (deutsche Form von Vor- und Nachnamen).","Arbeitszeiten bei der Deutschen Rentenversicherung melden — Beschäftigung im Herkunftsland kann für die Rente zählen.","Anerkennung der Berufsabschlüsse beantragen."],
["Spätaussiedlerbescheinigung","Registrierschein","Pass des Herkunftslandes","Geburts- und Heiratsurkunden","Arbeitsbuch"]]
});

task({id:"eu_steps",ph:1,ic:"star",prio:40,links:["handbook"],when:p=>p.purpose==="eu"&&earlyStay(p)},{
ru:["Права гражданина ЕС","Вам не нужны виза и ВНЖ: можно сразу жить и работать. Нужны те же бытовые шаги, что и всем.",
["Сделайте Anmeldung — это обязательно и для граждан ЕС.","Оформите медстраховку: европейская карта EHIC подходит только для временного пребывания.","Через 5 лет законного проживания у вас автоматически право на постоянное пребывание.","Члены семьи не из ЕС получают карту «Aufenthaltskarte» в Ausländerbehörde."],
["Паспорт или ID-карта ЕС","Wohnungsgeberbestätigung"]],
uz:["YeI fuqarosining huquqlari","Sizga viza va yashash ruxsatnomasi kerak emas: darhol yashash va ishlash mumkin. Hamma kabi maishiy qadamlar kerak.",
["Anmeldung qiling — YeI fuqarolari uchun ham majburiy.","Tibbiy sugʻurta rasmiylashtiring: Yevropa EHIC kartasi faqat vaqtinchalik boʻlish uchun mos.","5 yil qonuniy yashagandan keyin avtomatik doimiy yashash huquqi paydo boʻladi.","YeIdan boʻlmagan oila aʼzolari Ausländerbehördedan «Aufenthaltskarte» oladi."],
["YeI pasporti yoki ID kartasi","Wohnungsgeberbestätigung"]],
en:["Your rights as an EU citizen","You don't need a visa or residence permit: you can live and work here straight away. The everyday steps are the same as for everyone.",
["Do your Anmeldung — it's mandatory for EU citizens too.","Get health insurance: the EHIC card only covers temporary stays.","After 5 years of lawful residence you automatically have the right of permanent residence.","Non-EU family members get a residence card (Aufenthaltskarte) from the Ausländerbehörde."],
["EU passport or ID card","Wohnungsgeberbestätigung"]],
de:["Ihre Rechte als EU-Bürger/in","Sie brauchen weder Visum noch Aufenthaltstitel und dürfen sofort leben und arbeiten. Die Alltagsschritte sind dieselben wie für alle.",
["Wohnsitz anmelden — auch für EU-Bürger/innen Pflicht.","Krankenversicherung abschließen: die EHIC gilt nur für vorübergehende Aufenthalte.","Nach 5 Jahren rechtmäßigem Aufenthalt besteht automatisch ein Daueraufenthaltsrecht.","Familienangehörige ohne EU-Pass bekommen bei der Ausländerbehörde eine Aufenthaltskarte."],
["EU-Pass oder Personalausweis","Wohnungsgeberbestätigung"]]
});

task({id:"uni_enroll",ph:1,ic:"cap",prio:25,links:["daad","stw"],when:p=>p.purpose==="study"||has(p.doing,"uni")},{
ru:["Зачислиться в вуз и организовать учёбу","После приезда нужно завершить зачисление (Immatrikulation), иначе вы не студент — а от этого зависит ВНЖ.",
["Оформите медстраховку: без подтверждения вуз не зачислит.","Оплатите семестровый взнос (Semesterbeitrag) и пройдите Immatrikulation — получите Studienbescheinigung.","Активируйте Sperrkonto, чтобы ежемесячно получать деньги на свой счёт.","Подайте заявление на ВНЖ для учёбы, пока действует виза.","Подайте заявку на общежитие в Studierendenwerk как можно раньше — очередь длинная."],
["Паспорт с визой","Письмо о зачислении (Zulassungsbescheid)","Подтверждение медстраховки","Подтверждение оплаты Semesterbeitrag","Аттестат и дипломы"]],
uz:["OTMga qabul qilinish va oʻqishni tashkil qilish","Kelgandan keyin qabulni (Immatrikulation) yakunlash kerak, aks holda talaba emassiz — yashash ruxsatnomasi esa shunga bogʻliq.",
["Tibbiy sugʻurta rasmiylashtiring: tasdiqsiz OTM qabul qilmaydi.","Semestr badalini (Semesterbeitrag) toʻlang va Immatrikulationdan oʻting — Studienbescheinigung olasiz.","Har oy pulni hisobingizga olish uchun Sperrkontoni faollashtiring.","Viza amal qilayotganda oʻqish uchun yashash ruxsatnomasiga ariza bering.","Studierendenwerkdagi yotoqxonaga imkon qadar erta ariza bering — navbat uzun."],
["Vizali pasport","Qabul xati (Zulassungsbescheid)","Tibbiy sugʻurta tasdigʻi","Semesterbeitrag toʻlov tasdigʻi","Attestat va diplomlar"]],
en:["Enrol at university and get set up","After arrival you must complete your enrolment (Immatrikulation) — only then are you a student, and your residence permit depends on it.",
["Get health insurance: the university won't enrol you without proof.","Pay the semester fee (Semesterbeitrag) and enrol — you get a certificate of enrolment.","Activate your blocked account (Sperrkonto) so the monthly amount is paid to your account.","Apply for your student residence permit while your visa is still valid.","Apply for a student dorm at the Studierendenwerk as early as possible — waiting lists are long."],
["Passport with visa","Admission letter (Zulassungsbescheid)","Proof of health insurance","Proof of semester fee payment","School and university certificates"]],
de:["Einschreiben und Studium organisieren","Nach der Ankunft müssen Sie die Immatrikulation abschließen — erst dann sind Sie Student/in, und davon hängt der Aufenthaltstitel ab.",
["Krankenversicherung abschließen: ohne Nachweis keine Einschreibung.","Semesterbeitrag zahlen und immatrikulieren — Sie bekommen die Studienbescheinigung.","Sperrkonto aktivieren, damit der Monatsbetrag aufs Girokonto fließt.","Aufenthaltserlaubnis zum Studium beantragen, solange das Visum gilt.","So früh wie möglich beim Studierendenwerk für ein Wohnheim bewerben — die Wartelisten sind lang."],
["Pass mit Visum","Zulassungsbescheid","Nachweis Krankenversicherung","Zahlungsnachweis Semesterbeitrag","Schul- und Hochschulzeugnisse"]]
});

task({id:"steuerid",ph:1,ic:"doc",prio:35,links:["drv"],when:p=>working(p)||p.purpose==="work"||p.purpose==="ausb"},{
ru:["Steuer-ID и номер соцстрахования для работодателя","Без налогового номера (Steuer-ID) работодатель удержит налог по самому дорогому классу VI. Без номера соцстрахования вас нельзя правильно оформить.",
["Steuer-ID приходит сама по почте через несколько недель после Anmeldung. Не пришла — запросите её на сайте Bundeszentralamt für Steuern.","Номер соцстрахования (Sozialversicherungsnummer) присваивает Deutsche Rentenversicherung — обычно после первой регистрации у работодателя или через больничную кассу.","Передайте работодателю оба номера, IBAN и подтверждение страховки.","Сохраните письма с номерами — они нужны на всю жизнь."],
["Письмо со Steuer-ID","Письмо с номером соцстрахования (Sozialversicherungsausweis)","IBAN","Mitgliedsbescheinigung больничной кассы"]],
uz:["Ish beruvchi uchun Steuer-ID va ijtimoiy sugʻurta raqami","Soliq raqamisiz (Steuer-ID) ish beruvchi soliqni eng qimmat VI sinf boʻyicha ushlaydi. Ijtimoiy sugʻurta raqamisiz sizni toʻgʻri rasmiylashtirib boʻlmaydi.",
["Steuer-ID Anmeldungdan bir necha hafta keyin pochta orqali oʻzi keladi. Kelmasa — Bundeszentralamt für Steuern saytida soʻrang.","Ijtimoiy sugʻurta raqamini (Sozialversicherungsnummer) Deutsche Rentenversicherung beradi — odatda ish beruvchida birinchi roʻyxatdan keyin yoki kasalxona kassasi orqali.","Ikkala raqamni, IBAN va sugʻurta tasdigʻini ish beruvchiga bering.","Raqamli xatlarni saqlang — ular umrbod kerak."],
["Steuer-ID xati","Ijtimoiy sugʻurta raqami xati (Sozialversicherungsausweis)","IBAN","Kasalxona kassasi Mitgliedsbescheinigung"]],
en:["Tax ID and social security number for your employer","Without your tax ID (Steuer-ID) your employer deducts tax at the most expensive class VI. Without a social security number you can't be registered correctly.",
["Your Steuer-ID arrives by post a few weeks after your Anmeldung. If it doesn't, request it on the Federal Central Tax Office website.","The social security number is issued by the Deutsche Rentenversicherung — usually after your employer first registers you or via your health insurer.","Give both numbers, your IBAN and proof of insurance to your employer.","Keep the letters with these numbers — you need them for life."],
["Letter with your Steuer-ID","Social security number letter","IBAN","Health insurance membership certificate"]],
de:["Steuer-ID und Sozialversicherungsnummer für den Arbeitgeber","Ohne Steuer-ID muss der Arbeitgeber nach der teuren Steuerklasse VI abrechnen. Ohne Sozialversicherungsnummer ist keine korrekte Anmeldung möglich.",
["Die Steuer-ID kommt einige Wochen nach der Anmeldung per Post. Falls nicht, beim Bundeszentralamt für Steuern online anfordern.","Die Sozialversicherungsnummer vergibt die Deutsche Rentenversicherung — meist nach der ersten Meldung durch den Arbeitgeber oder über die Krankenkasse.","Beide Nummern, IBAN und Versicherungsnachweis beim Arbeitgeber abgeben.","Briefe mit den Nummern aufbewahren — sie gelten ein Leben lang."],
["Brief mit Steuer-ID","Sozialversicherungsausweis","IBAN","Mitgliedsbescheinigung der Krankenkasse"]]
});

task({id:"rundfunk",ph:1,ic:"tv",prio:60,tpl:["rundfunk"],links:["rundfunk"],when:p=>arrived(p)&&(p.housing==="own"||p.housing==="wg")},{
ru:["Rundfunkbeitrag — взнос за ТВ и радио","Это обязательный взнос с каждой квартиры, даже если у вас нет телевизора. Если не зарегистрироваться, через время придёт счёт сразу за все месяцы.",
["Живёте один или первым въехали в квартиру — зарегистрируйтесь на rundfunkbeitrag.de.","Живёте в WG или с семьёй — платит один человек. Сообщите номер (Beitragsnummer) того, кто уже платит (шаблон ниже).","Получаете Grundsicherungsgeld, BAföG или BAB (и живёте не у родителей) — подайте заявление на освобождение (Befreiung).","Пришло письмо, хотя за квартиру уже платят, — ответьте, не игнорируйте."],
["Дата въезда","Beitragsnummer соседа (если он платит)","Bescheid о пособии (для освобождения)"]],
uz:["Rundfunkbeitrag — televizor va radio badali","Bu har bir xonadondan olinadigan majburiy badal, hatto televizoringiz boʻlmasa ham. Roʻyxatdan oʻtmasangiz, keyinroq barcha oylar uchun birdaniga hisob keladi.",
["Yolgʻiz yashasangiz yoki kvartiraga birinchi koʻchib kirgan boʻlsangiz — rundfunkbeitrag.de saytida roʻyxatdan oʻting.","WG yoki oila bilan yashasangiz — bitta odam toʻlaydi. Allaqachon toʻlayotgan kishining raqamini (Beitragsnummer) xabar qiling (pastdagi shablon).","Grundsicherungsgeld, BAföG yoki BAB olsangiz (va ota-onangiz bilan yashamasangiz) — ozod qilish (Befreiung) uchun ariza bering.","Xonadon uchun toʻlanayotgan boʻlsa-da, xat kelsa — javob bering, eʼtiborsiz qoldirmang."],
["Koʻchib kirish sanasi","Qoʻshningiz Beitragsnummer raqami (u toʻlasa)","Nafaqa haqidagi Bescheid (ozod qilish uchun)"]],
en:["Broadcasting fee (Rundfunkbeitrag)","Every household must pay it, even without a TV. If you don't register, you'll later get a bill for all past months at once.",
["If you live alone or moved in first, register at rundfunkbeitrag.de.","In a shared flat or with family, only one person pays. Report the payer's Beitragsnummer (template below).","If you receive Grundsicherungsgeld, BAföG or BAB (and don't live with your parents), apply for an exemption (Befreiung).","If you get a letter although your flat is already paying, reply — don't ignore it."],
["Move-in date","Flatmate's Beitragsnummer (if they pay)","Benefit notice (for exemption)"]],
de:["Rundfunkbeitrag","Jede Wohnung muss ihn zahlen, auch ohne Fernseher. Wer sich nicht anmeldet, bekommt später eine Rechnung für alle Monate auf einmal.",
["Allein wohnend oder als Erste/r eingezogen: auf rundfunkbeitrag.de anmelden.","In WG oder Familie zahlt nur eine Person. Beitragsnummer der zahlenden Person mitteilen (Vorlage unten).","Mit Grundsicherungsgeld, BAföG oder BAB (nicht bei den Eltern wohnend) Befreiung beantragen.","Kommt trotzdem Post, obwohl die Wohnung schon zahlt — antworten, nicht ignorieren."],
["Einzugsdatum","Beitragsnummer der Mitbewohner/innen (falls diese zahlen)","Leistungsbescheid (für die Befreiung)"]]
});

task({id:"sos",ph:1,ic:"phone",prio:70,info:true,when:p=>true},{
ru:["Сохранить экстренные номера","В экстренной ситуации нет времени искать номера. Звонки бесплатные с любого телефона, даже без SIM-карты.",
["112 — скорая помощь и пожарные.","110 — полиция.","116 117 — дежурный врач ночью и в выходные, когда это не угроза жизни.","Добавьте их в контакты телефона и расскажите детям. Все номера есть в разделе «Ещё»."],[]],
uz:["Favqulodda raqamlarni saqlash","Favqulodda vaziyatda raqam qidirishga vaqt yoʻq. Qoʻngʻiroqlar har qanday telefondan, hatto SIM-kartasiz ham bepul.",
["112 — tez yordam va oʻt oʻchiruvchilar.","110 — politsiya.","116 117 — hayotga xavf boʻlmaganda tunda va dam olish kunlari navbatchi shifokor.","Ularni telefon kontaktlariga qoʻshing va bolalarga ayting. Barcha raqamlar «Yana» boʻlimida."],[]],
en:["Save the emergency numbers","In an emergency there's no time to look them up. Calls are free from any phone, even without a SIM card.",
["112 — ambulance and fire brigade.","110 — police.","116 117 — doctor on call at night and at weekends when it's not life-threatening.","Save them in your contacts and tell your children. All numbers are in the “More” section."],[]],
de:["Notrufnummern speichern","Im Notfall bleibt keine Zeit zum Suchen. Die Anrufe sind kostenlos, auch ohne SIM-Karte.",
["112 — Rettungsdienst und Feuerwehr.","110 — Polizei.","116 117 — ärztlicher Bereitschaftsdienst nachts und am Wochenende, wenn es nicht lebensbedrohlich ist.","In den Kontakten speichern und den Kindern erklären. Alle Nummern stehen unter „Mehr“."],[]]
});

task({id:"integration",ph:2,ic:"lang",prio:10,off:"vhs",links:["bamfnavi","bamf"],when:p=>arrived(p)&&p.german!=null&&below(p,"B1")&&p.purpose!=="study"},{
ru:["Записаться на интеграционный курс","Курс BAMF — самый быстрый путь к B1: около 600 часов немецкого и 100 часов о жизни в Германии. Сертификат B1 нужен для ПМЖ, гражданства и хорошей работы. Часто курс бесплатный или почти бесплатный.",
["Найдите курс рядом в BAMF-NAvI — есть утренние, вечерние, интенсивные и онлайн-курсы.","Право на курс обычно указано при выдаче ВНЖ. Если нет — подайте заявление на допуск (Antrag auf Zulassung) в BAMF.","Получаете пособие от Jobcenter — курс может быть обязательным; спросите там.","Курс заканчивается экзаменом DTZ (A2/B1) и тестом «Leben in Deutschland» — готовьтесь заранее."],
["Паспорт / ВНЖ","Berechtigungsschein (если выдали)","Meldebescheinigung","Bescheid о пособии (для освобождения от оплаты)"]],
uz:["Integratsiya kursiga yozilish","BAMF kursi — B1ga eng tez yoʻl: taxminan 600 soat nemis tili va Germaniyadagi hayot haqida 100 soat. B1 sertifikati doimiy yashash, fuqarolik va yaxshi ish uchun kerak. Koʻpincha kurs bepul yoki deyarli bepul.",
["BAMF-NAvIda yaqin atrofdagi kursni toping — ertalabki, kechki, jadal va onlayn kurslar bor.","Kursga huquq odatda yashash ruxsatnomasi berilganda koʻrsatiladi. Boʻlmasa — BAMFga qabul haqida ariza (Antrag auf Zulassung) bering.","Jobcenterdan nafaqa olsangiz — kurs majburiy boʻlishi mumkin; u yerdan soʻrang.","Kurs DTZ imtihoni (A2/B1) va «Leben in Deutschland» testi bilan tugaydi — oldindan tayyorlaning."],
["Pasport / yashash ruxsatnomasi","Berechtigungsschein (berilgan boʻlsa)","Meldebescheinigung","Nafaqa haqidagi Bescheid (toʻlovdan ozod qilish uchun)"]],
en:["Join an integration course","The BAMF course is the fastest way to B1: about 600 hours of German plus 100 hours on life in Germany. A B1 certificate is needed for permanent residence, citizenship and better jobs. The course is often free or nearly free.",
["Find a course near you in BAMF-NAvI — morning, evening, intensive and online options exist.","Your entitlement is usually noted when you get your residence permit. If not, apply for admission (Antrag auf Zulassung) at the BAMF.","If you receive Jobcenter benefits, the course may be compulsory — ask there.","The course ends with the DTZ exam (A2/B1) and the “Leben in Deutschland” test — prepare early."],
["Passport / residence permit","Berechtigungsschein (if issued)","Meldebescheinigung","Benefit notice (for fee exemption)"]],
de:["Integrationskurs besuchen","Der BAMF-Kurs ist der schnellste Weg zu B1: rund 600 Stunden Deutsch und 100 Stunden Orientierung. B1 brauchen Sie für Niederlassung, Einbürgerung und bessere Jobs. Oft ist der Kurs kostenlos oder fast kostenlos.",
["Kurs in der Nähe über BAMF-NAvI finden — es gibt Vormittags-, Abend-, Intensiv- und Onlinekurse.","Die Berechtigung steht meist schon beim Aufenthaltstitel. Sonst Antrag auf Zulassung beim BAMF stellen.","Mit Leistungen vom Jobcenter kann der Kurs verpflichtend sein — dort nachfragen.","Der Kurs endet mit dem DTZ (A2/B1) und dem Test „Leben in Deutschland“ — früh vorbereiten."],
["Pass / Aufenthaltstitel","Berechtigungsschein (falls vorhanden)","Meldebescheinigung","Leistungsbescheid (für Kostenbefreiung)"]]
});

task({id:"learn_german",ph:2,ic:"lang",prio:15,links:["vhs","dw"],when:p=>p.german!=null&&below(p,"C1")},{
ru:["Учить немецкий каждый день","Язык открывает всё: работу по профессии, гражданство, общение с ведомствами без переводчика. 20–30 минут в день дают больше, чем 3 часа раз в неделю.",
["Бесплатно: vhs-Lernportal (от A1 до B1) и курсы Deutsche Welle (до C1).","Для работы есть бесплатные Berufssprachkurse (профессиональный немецкий B1–C1) — спросите в Agentur für Arbeit или Jobcenter.","Найдите тандем-партнёра или разговорное кафе (Sprachcafé) в своём городе.","Смотрите новости на немецком в упрощённом формате («Nachrichten in einfacher Sprache»)."],[]],
uz:["Har kuni nemis tilini oʻrganish","Til hamma narsani ochadi: kasbingiz boʻyicha ish, fuqarolik, idoralar bilan tarjimonsiz muloqot. Kuniga 20–30 daqiqa haftada bir marta 3 soatdan koʻp foyda beradi.",
["Bepul: vhs-Lernportal (A1 dan B1 gacha) va Deutsche Welle kurslari (C1 gacha).","Ish uchun bepul Berufssprachkurse (kasbiy nemis tili B1–C1) bor — Agentur für Arbeit yoki Jobcenterdan soʻrang.","Shahringizda tandem-sherik yoki suhbat kafesini (Sprachcafé) toping.","Soddalashtirilgan nemischa yangiliklarni koʻring («Nachrichten in einfacher Sprache»)."],[]],
en:["Learn German every day","German opens everything: work in your profession, citizenship, dealing with offices without an interpreter. 20–30 minutes a day beats 3 hours once a week.",
["Free: the vhs learning portal (A1 to B1) and Deutsche Welle courses (up to C1).","For work there are free job-related language courses (Berufssprachkurse, B1–C1) — ask the employment agency or Jobcenter.","Find a tandem partner or a language café (Sprachcafé) in your city.","Watch news in simple German (“Nachrichten in einfacher Sprache”)."],[]],
de:["Jeden Tag Deutsch lernen","Deutsch öffnet alle Türen: Arbeit im Beruf, Einbürgerung, Behördengänge ohne Dolmetscher. 20–30 Minuten täglich bringen mehr als 3 Stunden einmal pro Woche.",
["Kostenlos: vhs-Lernportal (A1 bis B1) und Kurse der Deutschen Welle (bis C1).","Für den Beruf gibt es kostenlose Berufssprachkurse (B1–C1) — bei Agentur für Arbeit oder Jobcenter fragen.","Tandempartner/in oder ein Sprachcafé in Ihrer Stadt suchen.","Nachrichten in einfacher Sprache hören und sehen."],[]]
});

task({id:"doctor",ph:2,ic:"heart",prio:30,off:"arzt",links:["k116117"],when:p=>arrived(p)},{
ru:["Найти семейного врача (Hausarzt)","Hausarzt — ваш первый врач при любых жалобах: он лечит, выписывает больничный и направляет к специалистам. Найти его стоит заранее, пока вы здоровы.",
["Найдите врачей рядом через 116117.de или карту и звоните в приёмную — спросите, берут ли новых пациентов («Nehmen Sie neue Patienten auf?»).","Возьмите карту больничной кассы (eGK) на первый приём.","Для детей нужен отдельный детский врач (Kinderarzt) — ищите его сразу.","Не можете получить термин у специалиста — позвоните в службу записи 116 117."],
["Карта больничной кассы (eGK)","Список лекарств и прошлые диагнозы (если есть)","Прививочный паспорт"]],
uz:["Oilaviy shifokor (Hausarzt) topish","Hausarzt — har qanday shikoyatda birinchi shifokoringiz: u davolaydi, kasallik varaqasini yozadi va mutaxassislarga yuboradi. Uni sogʻligingizda, oldindan topgan maʼqul.",
["116117.de yoki xarita orqali yaqin atrofdagi shifokorlarni toping va qabulxonaga qoʻngʻiroq qiling — yangi bemorlarni qabul qilishlarini soʻrang («Nehmen Sie neue Patienten auf?»).","Birinchi qabulga kassa kartasini (eGK) olib boring.","Bolalar uchun alohida bolalar shifokori (Kinderarzt) kerak — uni darhol qidiring.","Mutaxassisga termin ololmasangiz — 116 117 yozilish xizmatiga qoʻngʻiroq qiling."],
["Kasalxona kassasi kartasi (eGK)","Dorilar roʻyxati va oldingi tashxislar (boʻlsa)","Emlash pasporti"]],
en:["Find a family doctor (Hausarzt)","Your Hausarzt is the first doctor for any complaint: they treat you, issue sick notes and refer you to specialists. Find one early, while you're healthy.",
["Search for doctors near you on 116117.de or the map and call the practice — ask if they take new patients (“Nehmen Sie neue Patienten auf?”).","Take your health insurance card (eGK) to the first visit.","Children need their own paediatrician (Kinderarzt) — look for one straight away.","Can't get a specialist appointment? Call the appointment service on 116 117."],
["Health insurance card (eGK)","List of medicines and past diagnoses (if any)","Vaccination record"]],
de:["Hausarzt oder Hausärztin finden","Die Hausarztpraxis ist bei allen Beschwerden die erste Anlaufstelle: Behandlung, Krankschreibung, Überweisung. Suchen Sie sie, solange Sie gesund sind.",
["Praxen in der Nähe über 116117.de oder die Karte finden und anrufen: „Nehmen Sie neue Patienten auf?“","Zum ersten Termin die Gesundheitskarte (eGK) mitnehmen.","Für Kinder eine Kinderarztpraxis suchen — am besten sofort.","Kein Facharzttermin? Die Terminservicestelle unter 116 117 anrufen."],
["Gesundheitskarte (eGK)","Medikamentenliste und frühere Diagnosen","Impfpass"]]

task({id:"haftpflicht",ph:2,ic:"shield",prio:60,when:p=>arrived(p)},{
ru:["Оформить страховку ответственности (Haftpflicht)","Если вы случайно что-то сломаете у других — залили соседей, поцарапали машину, — платить придётся вам, иногда тысячи евро. Haftpflichtversicherung стоит несколько евро в месяц и это покрывает. Её часто ждут арендодатели.",
["Сравните тарифы на нескольких сайтах или в Verbraucherzentrale.","Семье подходит один семейный тариф.","Не покупайте лишние страховки у агентов «у двери» и не подписывайте договоры, которых не понимаете.","Можно добавить Hausrat (страховка вещей в квартире) — по желанию."],[]],
uz:["Javobgarlik sugʻurtasi (Haftpflicht) rasmiylashtirish","Agar tasodifan boshqalarning narsasini buzsangiz — qoʻshnilarni suv bossa, mashinani tirnab qoʻysangiz — oʻzingiz toʻlaysiz, baʼzan minglab yevro. Haftpflichtversicherung oyiga bir necha yevro turadi va buni qoplaydi. Uy egalari koʻpincha uni kutadi.",
["Bir nechta saytda yoki Verbraucherzentraleda tariflarni solishtiring.","Oilaga bitta oilaviy tarif yetarli.","«Eshik oldida» agentlardan keraksiz sugʻurtalar sotib olmang va tushunmagan shartnomalarga imzo chekmang.","Hausrat (kvartiradagi narsalar sugʻurtasi) qoʻshish mumkin — ixtiyoriy."],[]],
en:["Get personal liability insurance (Haftpflicht)","If you accidentally damage someone else's property — flood the neighbours, scratch a car — you pay, sometimes thousands of euros. Liability insurance costs a few euros a month and covers this. Landlords often expect it.",
["Compare offers on several websites or at the consumer advice centre.","A single family policy covers your household.","Don't buy extra insurance from door-to-door agents and never sign contracts you don't understand.","Contents insurance (Hausrat) is optional."],[]],
de:["Private Haftpflichtversicherung abschließen","Wer aus Versehen fremdes Eigentum beschädigt — Wasserschaden beim Nachbarn, Kratzer am Auto — muss zahlen, manchmal Tausende Euro. Eine Haftpflicht kostet wenige Euro im Monat. Vermieter erwarten sie oft.",
["Tarife auf mehreren Vergleichsseiten oder bei der Verbraucherzentrale vergleichen.","Für die Familie reicht ein Familientarif.","Keine unnötigen Versicherungen an der Haustür kaufen und nichts unterschreiben, was Sie nicht verstehen.","Hausratversicherung ist optional."],[]]
});

task({id:"seek_register",ph:2,ic:"search",prio:12,off:"aa",links:["ba"],when:p=>has(p.doing,"seek")||has(p.ev,"joblost")},{
ru:["Встать на учёт как ищущий работу","Agentur für Arbeit помогает найти работу, оплачивает курсы и выплачивает пособие. Если работа заканчивается, сроки строгие: опоздание может стоить пособия.",
["Знаете, что работа закончится, — сообщите в Agentur für Arbeit (arbeitsuchend melden) не позже чем за 3 месяца, а если узнали позже — в течение 3 дней. Можно онлайн.","В первый день без работы зарегистрируйтесь как безработный (arbeitslos melden).","Пособие Arbeitslosengeld положено, если вы были застрахованы минимум 12 месяцев за последние 30. Если нет — обращайтесь в Jobcenter.","Составьте немецкое резюме (Lebenslauf) и ищите вакансии в Jobbörse Агентства."],
["Паспорт / ВНЖ","Письмо об увольнении или договор","Arbeitsbescheinigung от работодателя","Резюме","IBAN"]],
uz:["Ish qidiruvchi sifatida roʻyxatdan oʻtish","Agentur für Arbeit ish topishga yordam beradi, kurslarni toʻlaydi va nafaqa beradi. Ish tugayotgan boʻlsa, muddatlar qatʼiy: kechikish nafaqadan mahrum qilishi mumkin.",
["Ish tugashini bilsangiz — Agentur für Arbeitga kamida 3 oy oldin, keyinroq bilgan boʻlsangiz — 3 kun ichida xabar bering (arbeitsuchend melden). Onlayn mumkin.","Ishsiz birinchi kuningizda ishsiz sifatida roʻyxatdan oʻting (arbeitslos melden).","Oxirgi 30 oyda kamida 12 oy sugʻurtalangan boʻlsangiz, Arbeitslosengeld beriladi. Aks holda — Jobcenterga murojaat qiling.","Nemischa rezyume (Lebenslauf) tuzing va Agentlik Jobbörsesida vakansiya qidiring."],
["Pasport / yashash ruxsatnomasi","Ishdan boʻshatish xati yoki shartnoma","Ish beruvchidan Arbeitsbescheinigung","Rezyume","IBAN"]],
en:["Register as a job seeker","The employment agency helps you find work, pays for courses and pays benefits. If your job is ending, deadlines are strict — being late can cost you benefits.",
["If you know your job will end, register as job-seeking (arbeitsuchend melden) at least 3 months before — or within 3 days if you learn later. You can do it online.","On your first day without work, register as unemployed (arbeitslos melden).","Unemployment benefit (Arbeitslosengeld) requires at least 12 months of insurance in the last 30 months. Otherwise, go to the Jobcenter.","Write a German CV (Lebenslauf) and search vacancies on the agency's job portal."],
["Passport / residence permit","Notice of termination or contract","Employer's certificate (Arbeitsbescheinigung)","CV","IBAN"]],
de:["Arbeitsuchend melden","Die Agentur für Arbeit hilft bei der Jobsuche, finanziert Kurse und zahlt Arbeitslosengeld. Endet Ihr Job, sind die Fristen streng — wer zu spät kommt, riskiert eine Sperre.",
["Wissen Sie vom Ende Ihres Jobs: spätestens 3 Monate vorher arbeitsuchend melden, bei späterer Kenntnis innerhalb von 3 Tagen. Online möglich.","Am ersten Tag ohne Arbeit arbeitslos melden.","Arbeitslosengeld gibt es nach mindestens 12 Monaten Versicherung in den letzten 30 Monaten. Sonst ist das Jobcenter zuständig.","Deutschen Lebenslauf schreiben und in der Jobbörse der Agentur suchen."],
["Pass / Aufenthaltstitel","Kündigung oder Vertrag","Arbeitsbescheinigung","Lebenslauf","IBAN"]]
});

task({id:"jc_rules",ph:2,ic:"coins",prio:14,off:"jc",tpl:["jc_aenderung","termin","widerspruch","unterlagen","frist"],links:["jcdigital"],when:p=>has(p.doing,"jc")},{
ru:["Правила Grundsicherungsgeld (Jobcenter)","С 1 июля 2026 года Bürgergeld называется Grundsicherungsgeld, и правила стали строже. Пропущенные встречи и несообщённые изменения быстро приводят к сокращению денег.",
["Приходите на все термины. Не можете — сообщите ДО встречи и подтвердите причину (больничный и т. п.). За повторные пропуски выплаты уменьшают, а при систематических — могут остановить полностью.","Сразу сообщайте об изменениях (Veränderungsmitteilung): новая работа или доход, переезд, рождение ребёнка, кто-то въехал или выехал.","Посмотрите в Bescheid, до какого числа назначены выплаты, и заранее подайте Weiterbewilligungsantrag.","С решением не согласны — Widerspruch в течение месяца.","Удобно всё отправлять через jobcenter.digital; на бумаге — просите штамп о получении."],
["Последний Bescheid","Выписки со счёта","Договор аренды и счета за коммунальные","Справки о доходах"]],
uz:["Grundsicherungsgeld (Jobcenter) qoidalari","2026-yil 1-iyuldan Bürgergeld Grundsicherungsgeld deb ataladi va qoidalar qattiqlashdi. Qoldirilgan uchrashuvlar va xabar qilinmagan oʻzgarishlar tezda pul kamayishiga olib keladi.",
["Barcha terminlarga keling. Kela olmasangiz — uchrashuvdan OLDIN xabar bering va sababni tasdiqlang (kasallik varaqasi va h.k.). Takroriy qoldirishlar uchun toʻlovlar kamaytiriladi, muntazam boʻlsa — butunlay toʻxtatilishi mumkin.","Oʻzgarishlar haqida darhol xabar bering (Veränderungsmitteilung): yangi ish yoki daromad, koʻchish, farzand tugʻilishi, kimdir koʻchib kirdi yoki chiqdi.","Bescheidda toʻlovlar qaysi sanagacha tayinlanganini qarang va Weiterbewilligungsantragni oldindan bering.","Qarorga rozi boʻlmasangiz — bir oy ichida Widerspruch.","Hammasini jobcenter.digital orqali yuborish qulay; qogʻozda — qabul muhrini soʻrang."],
["Oxirgi Bescheid","Hisob koʻchirmalari","Ijara shartnomasi va kommunal hisoblar","Daromad maʼlumotnomalari"]],
en:["Grundsicherungsgeld rules (Jobcenter)","Since 1 July 2026, Bürgergeld is called Grundsicherungsgeld and the rules are stricter. Missed appointments and unreported changes quickly lead to cuts.",
["Attend every appointment. If you can't, say so BEFORE the meeting and prove the reason (sick note etc.). Repeated no-shows reduce your payments; persistent ones can stop them completely.","Report changes immediately (Veränderungsmitteilung): new job or income, moving, a birth, someone moving in or out.","Check in your Bescheid until when payments are approved and file the continuation application (Weiterbewilligungsantrag) in time.","If you disagree with a decision, file a Widerspruch within one month.","Use jobcenter.digital to send things; on paper, ask for a receipt stamp."],
["Latest Bescheid","Bank statements","Tenancy agreement and utility bills","Proof of income"]],
de:["Regeln beim Grundsicherungsgeld (Jobcenter)","Seit 1. Juli 2026 heißt das Bürgergeld Grundsicherungsgeld, und die Regeln sind strenger. Versäumte Termine und nicht gemeldete Änderungen führen schnell zu Kürzungen.",
["Alle Termine wahrnehmen. Wenn es nicht geht, VOR dem Termin absagen und den Grund nachweisen (AU usw.). Wiederholte Versäumnisse mindern die Leistung, dauerhafte können sie ganz entfallen lassen.","Änderungen sofort mitteilen (Veränderungsmitteilung): neuer Job oder Einkommen, Umzug, Geburt, Ein- oder Auszug von Personen.","Im Bescheid den Bewilligungszeitraum prüfen und den Weiterbewilligungsantrag rechtzeitig stellen.","Bei falschen Bescheiden innerhalb eines Monats Widerspruch einlegen.","Am einfachsten über jobcenter.digital einreichen; auf Papier den Eingangsstempel geben lassen."],
["Letzter Bescheid","Kontoauszüge","Mietvertrag und Nebenkostenabrechnung","Einkommensnachweise"]]
});

task({id:"anerkennung",ph:2,ic:"doc",prio:20,tpl:["sachstand"],links:["anerkennung","bamfnavi"],when:p=>has(p.extra,"diploma")},{
ru:["Признать диплом или профессию","Для врачей, медсестёр, учителей, воспитателей и ряда других профессий работать без признания нельзя. Для остальных признание помогает получить работу и зарплату по квалификации.",
["Пройдите «Anerkennungs-Finder» на anerkennung-in-deutschland.de — он покажет, какое ведомство отвечает за вашу профессию и город.","Для вузовских дипломов без регулируемой профессии закажите оценку диплома (Zeugnisbewertung) в ZAB.","Сделайте заверенные копии и переводы у присяжного переводчика.","Расходы на признание часто может оплатить Agentur für Arbeit или Jobcenter — спросите ДО подачи.","Есть бесплатные консультации по признанию (например, сеть IQ) — найдите в своём городе."],
["Диплом и приложение с оценками","Заверенные переводы","Резюме в табличной форме","Подтверждение опыта работы","Паспорт"]],
uz:["Diplom yoki kasbni tan oldirish","Shifokor, hamshira, oʻqituvchi, tarbiyachi va boshqa baʼzi kasblar uchun tan olinmasdan ishlab boʻlmaydi. Qolganlar uchun tan olinish malakaga mos ish va maosh olishga yordam beradi.",
["anerkennung-in-deutschland.de saytida «Anerkennungs-Finder»dan oʻting — u kasbingiz va shahringiz uchun masʼul idorani koʻrsatadi.","Tartibga solinmagan kasbdagi OTM diplomlari uchun ZABda diplom bahosini (Zeugnisbewertung) buyurtma qiling.","Qasamyod qilgan tarjimonda tasdiqlangan nusxalar va tarjimalar qiling.","Tan olish xarajatlarini koʻpincha Agentur für Arbeit yoki Jobcenter toʻlashi mumkin — topshirishdan OLDIN soʻrang.","Tan olish boʻyicha bepul maslahatlar bor (masalan, IQ tarmogʻi) — shahringizda toping."],
["Diplom va baholar ilovasi","Tasdiqlangan tarjimalar","Jadval shaklidagi rezyume","Ish tajribasi tasdigʻi","Pasport"]],
en:["Get your degree or trade recognised","Doctors, nurses, teachers, educators and some other professions can't work without recognition. For everyone else it helps to get a job and pay that match your skills.",
["Use the “Anerkennungs-Finder” on anerkennung-in-deutschland.de — it shows the office responsible for your profession and city.","For university degrees in non-regulated professions, request a statement of comparability (Zeugnisbewertung) from the ZAB.","Get certified copies and translations by a sworn translator.","The employment agency or Jobcenter can often pay the fees — ask BEFORE you apply.","Free recognition advice exists (e.g. the IQ network) — find it in your city."],
["Diploma and transcript","Certified translations","CV in table form","Proof of work experience","Passport"]],
de:["Abschluss anerkennen lassen","Ärzt/innen, Pflegekräfte, Lehrkräfte, Erzieher/innen und einige andere Berufe dürfen ohne Anerkennung nicht arbeiten. Für alle anderen hilft sie bei Jobsuche und Gehalt.",
["Den „Anerkennungs-Finder“ auf anerkennung-in-deutschland.de nutzen — er nennt die zuständige Stelle für Beruf und Ort.","Für Hochschulabschlüsse in nicht reglementierten Berufen eine Zeugnisbewertung bei der ZAB beantragen.","Beglaubigte Kopien und Übersetzungen von vereidigten Übersetzer/innen besorgen.","Die Kosten übernimmt oft die Agentur für Arbeit oder das Jobcenter — VOR dem Antrag fragen.","Es gibt kostenlose Anerkennungsberatung (z. B. IQ Netzwerk) — vor Ort suchen."],
["Zeugnis und Fächer-/Notenübersicht","Beglaubigte Übersetzungen","Tabellarischer Lebenslauf","Nachweise über Berufserfahrung","Pass"]]
});

task({id:"license",ph:2,ic:"car",prio:25,off:"fs",due:{from:"arrival",months:6},links:["bund"],when:p=>has(p.extra,"license")},{
ru:["Поменять водительские права","Права не из ЕС действуют в Германии только 6 месяцев после переезда. Потом ездить по ним нельзя — это вождение без прав.",
["Права из ЕС менять не нужно.","Для России, Узбекистана и большинства других стран вне специального списка нужны теоретический и практический экзамены. Автошкола не обязательна, но несколько уроков помогут сдать.","Подайте заявление в Führerscheinstelle заранее — оформление занимает время.","Для Украины действуют особые правила — уточните в Führerscheinstelle."],
["Иностранные права и перевод","Паспорт / ВНЖ","Meldebescheinigung","Биометрическое фото","Справка о проверке зрения (Sehtest)","Сертификат курса первой помощи (Erste-Hilfe-Kurs)"]],
uz:["Haydovchilik guvohnomasini almashtirish","YeIdan boʻlmagan guvohnoma Germaniyada koʻchib kelgandan keyin faqat 6 oy amal qiladi. Keyin u bilan haydash mumkin emas — bu guvohnomasiz haydash hisoblanadi.",
["YeI guvohnomalarini almashtirish shart emas.","Rossiya, Oʻzbekiston va maxsus roʻyxatda boʻlmagan boshqa koʻp davlatlar uchun nazariy va amaliy imtihonlar kerak. Avtomaktab majburiy emas, lekin bir nechta dars topshirishga yordam beradi.","Führerscheinstellega oldindan ariza bering — rasmiylashtirish vaqt oladi.","Ukraina uchun alohida qoidalar amal qiladi — Führerscheinstelledan aniqlang."],
["Chet el guvohnomasi va tarjimasi","Pasport / yashash ruxsatnomasi","Meldebescheinigung","Biometrik surat","Koʻrish tekshiruvi maʼlumotnomasi (Sehtest)","Birinchi yordam kursi sertifikati (Erste-Hilfe-Kurs)"]],
en:["Exchange your driving licence","A non-EU licence is only valid for 6 months after you move to Germany. After that, driving with it counts as driving without a licence.",
["EU licences don't need to be exchanged.","For Russia, Uzbekistan and most other countries not on the special list, you need a theory and a practical test. Driving school is not compulsory, but a few lessons help you pass.","Apply at the driving licence office early — processing takes time.","Special rules apply to Ukrainian licences — ask the office."],
["Foreign licence and translation","Passport / residence permit","Meldebescheinigung","Biometric photo","Eye test certificate (Sehtest)","First aid course certificate (Erste-Hilfe-Kurs)"]],
de:["Führerschein umschreiben","Ein Führerschein aus einem Nicht-EU-Land gilt nach dem Zuzug nur 6 Monate. Danach ist Fahren damit Fahren ohne Fahrerlaubnis.",
["EU-Führerscheine müssen nicht umgeschrieben werden.","Für Russland, Usbekistan und die meisten Staaten außerhalb der Sonderliste sind theoretische und praktische Prüfung nötig. Fahrschule ist keine Pflicht, ein paar Stunden helfen aber.","Antrag frühzeitig bei der Führerscheinstelle stellen — die Bearbeitung dauert.","Für ukrainische Führerscheine gelten Sonderregeln — bei der Führerscheinstelle nachfragen."],
["Ausländischer Führerschein mit Übersetzung","Pass / Aufenthaltstitel","Meldebescheinigung","Biometrisches Foto","Sehtest","Erste-Hilfe-Kurs-Bescheinigung"]]
});

task({id:"kita_school",ph:2,ic:"child",prio:18,off:"kita",tpl:["kita_anfrage"],links:["famportal"],when:p=>kids(p)&&arrived(p)},{
ru:["Устроить детей в садик или школу","В Германии школа обязательна. С 1 года у ребёнка есть право на место в детском саду (Kita), но очереди длинные — подавайте заявку как можно раньше.",
["Школа: обратитесь в ближайшую школу или в Schulamt — детей без немецкого часто сначала направляют в подготовительный класс.","Kita: подайте заявки в несколько садов сразу (через портал города или Jugendamt); в некоторых городах сначала нужен Kita-Gutschein.","Для садика и школы обязательно подтверждение прививки от кори (Masernschutz).","При небольшом доходе подайте на Bildung und Teilhabe — оплата обедов, экскурсий, школьных принадлежностей."],
["Свидетельство о рождении ребёнка","Meldebescheinigung","Прививочный паспорт (корь)","Табели из прежней школы"]],
uz:["Bolalarni bogʻcha yoki maktabga joylashtirish","Germaniyada maktab majburiy. 1 yoshdan bola bolalar bogʻchasida (Kita) joy olish huquqiga ega, lekin navbatlar uzun — arizani imkon qadar erta bering.",
["Maktab: eng yaqin maktabga yoki Schulamtga murojaat qiling — nemis tilini bilmagan bolalar koʻpincha avval tayyorlov sinfiga yuboriladi.","Kita: birdaniga bir nechta bogʻchaga ariza bering (shahar portali yoki Jugendamt orqali); baʼzi shaharlarda avval Kita-Gutschein kerak.","Bogʻcha va maktab uchun qizamiqqa qarshi emlash tasdigʻi (Masernschutz) majburiy.","Daromad kichik boʻlsa, Bildung und Teilhabe ga ariza bering — tushlik, ekskursiya, maktab buyumlari toʻlovi."],
["Bolaning tugʻilganlik guvohnomasi","Meldebescheinigung","Emlash pasporti (qizamiq)","Oldingi maktab tabellari"]],
en:["Find a daycare or school place","School is compulsory in Germany. From age 1, children have a legal right to a daycare place (Kita), but waiting lists are long — apply as early as possible.",
["School: contact the nearest school or the Schulamt — children without German often start in a preparatory class.","Kita: apply to several daycare centres at once (via the city portal or Jugendamt); some cities first require a Kita voucher.","Proof of measles vaccination (Masernschutz) is required for daycare and school.","On a low income, apply for Bildung und Teilhabe — it pays for lunches, trips and school supplies."],
["Child's birth certificate","Meldebescheinigung","Vaccination record (measles)","Previous school reports"]],
de:["Kita- oder Schulplatz finden","In Deutschland gilt Schulpflicht. Ab dem 1. Geburtstag besteht ein Rechtsanspruch auf einen Kitaplatz, aber die Wartelisten sind lang — früh bewerben.",
["Schule: an die nächste Schule oder das Schulamt wenden — Kinder ohne Deutsch kommen oft zuerst in eine Vorbereitungsklasse.","Kita: bei mehreren Kitas gleichzeitig bewerben (Portal der Stadt oder Jugendamt); in manchen Städten braucht man zuerst einen Kita-Gutschein.","Für Kita und Schule ist der Masernschutz-Nachweis Pflicht.","Bei geringem Einkommen Bildung und Teilhabe beantragen — Mittagessen, Ausflüge, Schulbedarf."],
["Geburtsurkunde des Kindes","Meldebescheinigung","Impfpass (Masern)","Zeugnisse der bisherigen Schule"]]
