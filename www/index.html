n:{ru:"Приглашение в Jobcenter / Agentur für Arbeit",uz:"Jobcenter / Agentur für Arbeit taklifnomasi"},
w:{ru:"Вас вызывают на встречу в определённый день и час. Это обязательное приглашение, а не просьба.",uz:"Sizni maʼlum kun va soatda uchrashuvga chaqirishmoqda. Bu iltimos emas, majburiy taklif."},
d:{ru:["Приходите вовремя. Возьмите письмо, паспорт и документы, перечисленные в письме.","Не можете прийти — сообщите ДО встречи и назовите важную причину: болезнь (нужен больничный), собеседование на работу, экзамен.","Попросите новую дату письменно и сохраните доказательство отправки."],
uz:["Oʻz vaqtida keling. Xat, pasport va xatda sanab oʻtilgan hujjatlarni oling.","Kela olmasangiz, uchrashuvdan OLDIN xabar bering va jiddiy sababni ayting: kasallik (kasallik varaqasi kerak), ish suhbati, imtihon.","Yangi sanani yozma ravishda soʻrang va yuborganingiz isbotini saqlang."]},
i:{ru:"Пропуск без важной причины — выплаты могут уменьшить (Leistungsminderung).",uz:"Jiddiy sababsiz kelmaslik — toʻlovlar kamaytirilishi mumkin (Leistungsminderung)."}},
{id:"mitwirkung",u:3,tpl:["unterlagen","frist"],
kw:[["mitwirkung",4],["§ 60 sgb i",4],["§ 66 sgb i",4],["fehlende unterlagen",3],["folgende unterlagen",2],["reichen sie",2],["nachweise",2],["versagung",3],["kontoauszüge",2],["weiterbewilligungsantrag",2]],
n:{ru:"Запрос документов (Mitwirkung)",uz:"Hujjat soʻrovi (Mitwirkung)"},
w:{ru:"Ведомство просит прислать документы: выписки из банка, договор аренды, справки о доходах и т. п. Без них заявление не рассмотрят.",uz:"Idora hujjatlarni yuborishni soʻramoqda: bank koʻchirmalari, ijara shartnomasi, daromad maʼlumotnomalari va h.k. Ularsiz arizangiz koʻrib chiqilmaydi."},
d:{ru:["Выпишите, что именно просят — обычно это список по пунктам.","Отправляйте копии, не оригиналы. На каждой странице напишите ваш номер (BG-Nummer или Aktenzeichen).","Не успеваете — попросите продлить срок письменно, пока он не закончился.","Лучше отдать лично и получить штамп о приёме (Eingangsstempel) на копии."],
uz:["Aynan nima soʻralganini yozib oling — odatda bandlar roʻyxati boʻladi.","Asl nusxani emas, nusxalarni yuboring. Har sahifaga raqamingizni yozing (BG-Nummer yoki Aktenzeichen).","Ulgurmasangiz, muddat tugamasdan yozma ravishda uzaytirishni soʻrang.","Shaxsan topshirib, nusxaga qabul muhrini (Eingangsstempel) olgan maʼqul."]},
i:{ru:"Выплаты могут остановить или отказать (Versagung), пока документы не придут.",uz:"Hujjatlar kelmaguncha toʻlovlar toʻxtatilishi yoki rad etilishi mumkin (Versagung)."}},
{id:"finanzamt",u:2,fr:{m:1},tpl:["einspruch","raten"],
kw:[["finanzamt",3],["steuerbescheid",4],["einkommensteuer",3],["einspruch",2],["steuernummer",2],["lohnsteuer",2],["abgabenordnung",2],["veranlagung",2],["steuererklärung",2],["erstattung",1],["nachzahlung",1]],
n:{ru:"Письмо из налоговой (Finanzamt)",uz:"Soliq idorasidan xat (Finanzamt)"},
w:{ru:"Обычно это налоговое решение (Steuerbescheid): сколько вернут или сколько нужно доплатить. Или напоминание подать декларацию.",uz:"Odatda bu soliq qarori (Steuerbescheid): qancha qaytariladi yoki qancha qoʻshimcha toʻlash kerak. Yoki deklaratsiya topshirish haqida eslatma."},
d:{ru:["Сравните суммы со своей декларацией — особенно расходы (Werbungskosten), которые вы указывали.","Нашли ошибку — подайте Einspruch в течение месяца: через ELSTER или письмом.","Нужно доплатить — оплатите до даты в письме или попросите отсрочку (Stundung) или рассрочку."],
uz:["Summalarni deklaratsiyangiz bilan solishtiring — ayniqsa koʻrsatgan xarajatlaringizni (Werbungskosten).","Xato topsangiz, bir oy ichida Einspruch yuboring: ELSTER orqali yoki xat bilan.","Qoʻshimcha toʻlash kerak boʻlsa, xatdagi sanagacha toʻlang yoki kechiktirish (Stundung) yoki boʻlib toʻlashni soʻrang."]},
i:{ru:"Через месяц решение окончательное, а за неоплату начисляют пени (Säumniszuschläge).",uz:"Bir oydan keyin qaror yakuniy boʻladi, toʻlamaslik uchun esa penya hisoblanadi (Säumniszuschläge)."}},
{id:"mahnung",u:2,tpl:["bestreiten","raten"],
kw:[["mahnung",4],["zahlungserinnerung",3],["mahngebühr",3],["offener betrag",2],["offene forderung",2],["zahlungsverzug",3],["noch nicht beglichen",3],["letzte mahnung",3],["verzugszinsen",2],["rechnung vom",1]],
n:{ru:"Напоминание об оплате (Mahnung)",uz:"Toʻlov haqida eslatma (Mahnung)"},
w:{ru:"Компания считает, что вы не оплатили счёт, и просит заплатить — часто с доплатой за напоминание.",uz:"Kompaniya siz hisobni toʻlamagan deb hisoblaydi va toʻlashni soʻraydi — koʻpincha eslatma uchun qoʻshimcha haq bilan."},
d:{ru:["Проверьте: был ли такой договор и не оплатили ли вы уже (посмотрите выписку из банка).","Долг верный — заплатите или письменно попросите рассрочку.","Долг неверный — оспорьте письменно и не платите «на всякий случай».","Платите только на реквизиты, которые совпадают с вашим договором."],
uz:["Tekshiring: bunday shartnoma boʻlganmi va siz allaqachon toʻlamaganmisiz (bank koʻchirmasiga qarang).","Qarz toʻgʻri boʻlsa — toʻlang yoki yozma ravishda boʻlib toʻlashni soʻrang.","Qarz notoʻgʻri boʻlsa — yozma eʼtiroz bildiring va «har ehtimolga qarshi» toʻlamang.","Faqat shartnomangizga mos rekvizitlarga toʻlang."]},
i:{ru:"Дело могут передать коллекторам (Inkasso) или в суд (Mahnbescheid) — сумма вырастет.",uz:"Ish kollektorlarga (Inkasso) yoki sudga (Mahnbescheid) berilishi mumkin — summa oshadi."}},
{id:"inkasso",u:3,tpl:["bestreiten","raten"],
kw:[["inkasso",5],["forderungsmanagement",3],["inkassokosten",4],["hauptforderung",3],["gläubiger",2],["mandant",2],["schufa",2],["titulierung",2]],
n:{ru:"Письмо от коллекторов (Inkasso)",uz:"Kollektorlardan xat (Inkasso)"},
w:{ru:"Коллекторская фирма требует долг от имени компании. Особых прав у неё нет: без решения суда она не может арестовать ваше имущество.",uz:"Kollektorlik firmasi kompaniya nomidan qarzni talab qilmoqda. Unda alohida huquq yoʻq: sud qarorisiz mol-mulkingizni xatlay olmaydi."},
d:{ru:["Проверьте, кто изначальный кредитор (Auftraggeber) и за что долг.","Проверьте фирму в реестре rechtsdienstleistungsregister.de — мошенники часто выдают себя за Inkasso.","Долг неверный — оспорьте письменно. Верный — договоритесь о рассрочке.","Не подписывайте признание долга (Schuldanerkenntnis), не разобравшись."],
uz:["Asl kreditor kim (Auftraggeber) va qarz nima uchun ekanini tekshiring.","Firmani rechtsdienstleistungsregister.de reyestrida tekshiring — firibgarlar koʻpincha oʻzini Inkasso deb koʻrsatadi.","Qarz notoʻgʻri boʻlsa — yozma eʼtiroz bildiring. Toʻgʻri boʻlsa — boʻlib toʻlashga kelishing.","Tushunmasdan qarzni tan olish (Schuldanerkenntnis) hujjatiga imzo qoʻymang."]},
i:{ru:"Возможен судебный приказ (Mahnbescheid) и запись в SCHUFA — с ней трудно снять квартиру и взять кредит.",uz:"Sud buyrugʻi (Mahnbescheid) va SCHUFAga yozuv boʻlishi mumkin — u bilan uy ijaraga olish va kredit olish qiyin."}},
{id:"mahnbescheid",u:3,fr:{d:14,del:1},tpl:[],
kw:[["mahnbescheid",6],["mahngericht",4],["vollstreckungsbescheid",4],["antragsgegner",3],["antragsteller",2],["amtsgericht",2]],
n:{ru:"Судебный приказ о долге (Mahnbescheid)",uz:"Qarz boʻyicha sud buyrugʻi (Mahnbescheid)"},
w:{ru:"Это уже суд. Обычно приходит в жёлтом конверте. Суд не проверял, прав ли кредитор, — он только передаёт требование.",uz:"Bu endi sud. Odatda sariq konvertda keladi. Sud kreditor haqmi-yoʻqmi tekshirmagan — u faqat talabni yetkazadi."},
d:{ru:["Запишите дату с жёлтого конверта — от неё считаются 2 недели.","Не согласны — заполните бланк Widerspruch, который приложен к письму, и отправьте в суд.","Согласны — оплатите долг вместе с расходами из приказа.","Сразу идите на бесплатную консультацию (Verbraucherzentrale, Schuldnerberatung)."],
uz:["Sariq konvertdagi sanani yozib oling — 2 hafta shundan hisoblanadi.","Rozi boʻlmasangiz, xatga ilova qilingan Widerspruch blankasini toʻldirib, sudga yuboring.","Rozi boʻlsangiz, qarzni buyruqdagi xarajatlar bilan birga toʻlang.","Darhol bepul maslahatga boring (Verbraucherzentrale, Schuldnerberatung)."]},
i:{ru:"Выдадут Vollstreckungsbescheid — после него могут арестовать счёт и часть зарплаты.",uz:"Vollstreckungsbescheid chiqariladi — undan keyin hisob va maoshning bir qismi xatlanishi mumkin."}},
{id:"miete",u:3,tpl:["miete"],
kw:[["mietverhältnis",4],["eigenbedarf",4],["räumung",3],["mietrückstand",3],["herausgabe der wohnung",3],["§ 573",3],["§ 543",3],["mietvertrag",2],["vermieter",2],["hausverwaltung",2],["fristlos",2],["kündigung",2],["kündige",2],["kündigen",1]],
n:{ru:"Расторжение аренды (Kündigung Mietvertrag)",uz:"Ijarani bekor qilish (Kündigung Mietvertrag)"},
w:{ru:"Арендодатель хочет закончить договор аренды. Во многих таких письмах есть ошибки по форме или причине — тогда они недействительны.",uz:"Uy egasi ijara shartnomasini tugatmoqchi. Bunday xatlarning koʻpida shakl yoki sabab boʻyicha xatolar boʻladi — unda ular haqiqiy emas."},
d:{ru:["Не съезжайте и ничего не подписывайте сразу.","Проверьте: письмо подписано от руки (не e-mail и не WhatsApp), указана причина и правильный срок.","Обратитесь в Mieterverein (союз арендаторов) — после вступления консультация стоит недорого.","Если переезд для вас особенно тяжёл (болезнь, дети и школа, нет жилья), подайте Widerspruch по § 574 BGB не позже чем за 2 месяца до конца аренды."],
uz:["Darhol koʻchib ketmang va hech narsaga imzo qoʻymang.","Tekshiring: xat qoʻlda imzolanganmi (e-mail yoki WhatsApp emas), sabab va toʻgʻri muddat koʻrsatilganmi.","Mieterverein (ijarachilar ittifoqi)ga murojaat qiling — aʼzo boʻlgach maslahat arzon.","Koʻchish siz uchun ayniqsa ogʻir boʻlsa (kasallik, bolalar va maktab, uy yoʻq), ijara tugashidan kamida 2 oy oldin § 574 BGB boʻyicha Widerspruch yuboring."]},
i:{ru:"Арендодатель может подать иск о выселении (Räumungsklage), и судебные расходы лягут на вас.",uz:"Uy egasi koʻchirish daʼvosini (Räumungsklage) berishi mumkin, sud xarajatlari esa sizga tushadi."}},
{id:"erhoehung",u:2,fr:{sp:"e2m"},tpl:[],
kw:[["mieterhöhung",5],["vergleichsmiete",4],["erhöhung der miete",4],["mietspiegel",3],["§ 558",4],["indexmiete",3],["staffelmiete",2],["zustimmung",2],["neue miete",2]],
n:{ru:"Повышение аренды (Mieterhöhung)",uz:"Ijara haqini oshirish (Mieterhöhung)"},
w:{ru:"Арендодатель хочет поднять плату. Обычно он просит вашего согласия (Zustimmung) — у вас есть время подумать.",uz:"Uy egasi toʻlovni oshirmoqchi. Odatda u roziligingizni (Zustimmung) soʻraydi — oʻylashga vaqtingiz bor."},
d:{ru:["Сравните новую цену с Mietspiegel вашего города.","Новая цена может действовать не раньше чем через 15 месяцев после прошлого повышения, и за 3 года — не больше чем +20 % (во многих городах +15 %).","Не соглашайтесь сразу: сначала проверьте в Mieterverein.","Ответить нужно до конца второго месяца после получения письма."],
uz:["Yangi narxni shahringiz Mietspiegel bilan solishtiring.","Yangi narx oldingi oshirishdan kamida 15 oy oʻtgach amal qilishi mumkin, 3 yilda esa +20 % dan (koʻp shaharlarda +15 %) oshmasligi kerak.","Darhol rozi boʻlmang: avval Mietervereinda tekshiring.","Javobni xat olingandan keyingi ikkinchi oyning oxirigacha berish kerak."]},
i:{ru:"Молчание — не согласие. Но арендодатель может подать в суд, чтобы получить согласие.",uz:"Jim turish rozilik emas. Lekin uy egasi rozilik olish uchun sudga murojaat qilishi mumkin."}},
{id:"nebenkosten",u:1,fr:{m:12,soft:1},tpl:["belege","raten"],
kw:[["nebenkostenabrechnung",5],["betriebskostenabrechnung",5],["abrechnungszeitraum",3],["umlageschlüssel",3],["heizkosten",2],["guthaben",2],["vorauszahlung",2],["nachzahlung",1]],
n:{ru:"Счёт за коммунальные (Nebenkostenabrechnung)",uz:"Kommunal toʻlovlar hisobi (Nebenkostenabrechnung)"},
w:{ru:"Годовой расчёт расходов на отопление, воду, мусор и т. п. Итог — доплата (Nachzahlung) или возврат (Guthaben).",uz:"Isitish, suv, chiqindi va boshqalar uchun yillik hisob. Natija — qoʻshimcha toʻlov (Nachzahlung) yoki qaytarish (Guthaben)."},
d:{ru:["Проверьте период: расчёт должен прийти не позже чем через 12 месяцев после его конца, иначе доплату требовать нельзя.","Сравните с прошлым годом — резкий рост стоит проверить.","Вы имеете право посмотреть оригиналы счетов (Belegeinsicht).","Возражения можно подать в течение 12 месяцев после получения."],
uz:["Davrni tekshiring: hisob davr tugaganidan keyin 12 oydan kechikmay kelishi kerak, aks holda qoʻshimcha toʻlovni talab qilib boʻlmaydi.","Oʻtgan yil bilan solishtiring — keskin oʻsishni tekshirish kerak.","Asl hisob-fakturalarni koʻrishga haqingiz bor (Belegeinsicht).","Eʼtirozlarni olingandan keyin 12 oy ichida bildirish mumkin."]},
i:{ru:"Неоплаченную доплату взыщут, а большой долг по аренде может стать причиной расторжения.",uz:"Toʻlanmagan qoʻshimcha toʻlov undiriladi, katta ijara qarzi esa bekor qilishga sabab boʻlishi mumkin."}},
{id:"rundfunk",u:1,tpl:["rundfunk"],
kw:[["rundfunkbeitrag",5],["beitragsservice",5],["ard zdf",4],["ard, zdf",4],["beitragsnummer",3],["festsetzungsbescheid",3]],
n:{ru:"Взнос за ТВ и радио (Rundfunkbeitrag)",uz:"Televizor va radio badali (Rundfunkbeitrag)"},
w:{ru:"Обязательный взнос с каждой квартиры, а не с каждого человека — даже если у вас нет телевизора.",uz:"Har bir odamdan emas, har bir xonadondan olinadigan majburiy badal — hatto televizoringiz boʻlmasa ham."},
d:{ru:["Живёте в WG или с семьёй — платит один человек на квартиру. Сообщите номер (Beitragsnummer) того, кто уже платит.","Получаете социальную помощь, BAföG или BAB — можно получить освобождение (Befreiung).","Заявления и ответы — на сайте rundfunkbeitrag.de."],
uz:["WG yoki oila bilan yashasangiz — bir xonadondan bir kishi toʻlaydi. Allaqachon toʻlayotgan kishining raqamini (Beitragsnummer) xabar qiling.","Ijtimoiy yordam, BAföG yoki BAB olsangiz — ozod qilinish (Befreiung) mumkin.","Arizalar va javoblar — rundfunkbeitrag.de saytida."]},
i:{ru:"Долг передадут на принудительное взыскание через город (Vollstreckung).",uz:"Qarz shahar orqali majburiy undirishga (Vollstreckung) beriladi."}},
{id:"bussgeld",u:2,fr:{d:14,del:1},frIf:/bußgeldbescheid|bussgeldbescheid/,tpl:[],
kw:[["bußgeldbescheid",6],["bussgeldbescheid",6],["anhörungsbogen",5],["zeugenfragebogen",4],["verwarnungsgeld",4],["ordnungswidrigkeit",4],["tatvorwurf",3],["fahrverbot",3],["flensburg",3],["geschwindigkeit",2]],
n:{ru:"Штраф за нарушение (Bußgeld)",uz:"Qoidabuzarlik uchun jarima (Bußgeld)"},
w:{ru:"Вас обвиняют в нарушении, чаще всего на дороге. Anhörungsbogen — сначала вас спрашивают. Bußgeldbescheid — уже решение о штрафе.",uz:"Sizni qoidabuzarlikda ayblashmoqda, koʻpincha yoʻlda. Anhörungsbogen — avval sizdan soʻrashadi. Bußgeldbescheid — jarima haqida qaror."},
d:{ru:["В Anhörungsbogen обязательно указать только личные данные. Признавать вину вы не обязаны.","Если за рулём был ваш родственник, называть его вы не обязаны.","На Bußgeldbescheid можно подать Einspruch в течение 2 недель со дня вручения (дата на конверте).","Грозит Fahrverbot или много баллов — лучше к адвокату по транспортному праву."],
uz:["Anhörungsbogen da faqat shaxsiy maʼlumotlarni koʻrsatish majburiy. Aybni tan olishga majbur emassiz.","Rulda qarindoshingiz boʻlgan boʻlsa, uni aytishga majbur emassiz.","Bußgeldbescheid ga topshirilgan kundan (konvertdagi sana) 2 hafta ichida Einspruch berish mumkin.","Fahrverbot yoki koʻp ball xavfi boʻlsa — transport huquqi advokatiga boring."]},
i:{ru:"Штраф станет окончательным и его взыщут; баллы попадут в реестр Flensburg.",uz:"Jarima yakuniy boʻladi va undiriladi; ballar Flensburg reyestriga tushadi."}},
{id:"abh",u:3,tpl:["abh_termin","sachstand","unterlagen","widerspruch"],
kw:[["ausländerbehörde",5],["migrationsamt",4],["aufenthaltstitel",4],["aufenthaltserlaubnis",4],["fiktionsbescheinigung",4],["niederlassungserlaubnis",3],["aufenthaltsgesetz",3],["aufenthg",3],["blaue karte",3],["duldung",3],["ausreise",3],["visum",2],["vorsprache",2]],
n:{ru:"Ведомство по делам иностранцев (Ausländerbehörde)",uz:"Chet elliklar idorasi (Ausländerbehörde)"},
w:{ru:"Письмо о вашем виде на жительство: запись на приём, запрос документов, продление или решение.",uz:"Yashash ruxsatnomangiz haqida xat: qabulga yozilish, hujjat soʻrovi, uzaytirish yoki qaror."},
d:{ru:["Относитесь к срокам максимально серьёзно — подайте всё до даты в письме.","Подавайте на продление ДО окончания карты: тогда вы остаётесь легально, пока решают (Fiktionsbescheinigung).","Отказ или слово «Ausreise» в письме — сразу в бесплатную миграционную консультацию (MBE, Jugendmigrationsdienst) или к адвокату.","Делайте копии всего, что отдаёте."],
uz:["Muddatlarga juda jiddiy qarang — hammasini xatdagi sanagacha topshiring.","Uzaytirishga karta muddati tugashidan OLDIN ariza bering: shunda qaror chiqquncha qonuniy qolasiz (Fiktionsbescheinigung).","Rad javobi yoki xatda «Ausreise» soʻzi boʻlsa — darhol bepul migratsiya maslahatiga (MBE, Jugendmigrationsdienst) yoki advokatga boring.","Topshirgan hamma narsangizdan nusxa oling."]},
i:{ru:"Пропущенный срок может повлиять на право жить и работать в Германии.",uz:"Oʻtkazib yuborilgan muddat Germaniyada yashash va ishlash huquqingizga taʼsir qilishi mumkin."}},

d:{ru:["Анкету (Fragebogen) верните к сроку — иначе могут назначить максимальный взнос.","Долг по взносам — сразу договоритесь о рассрочке: при долгах лечение ограничивают.","Повышение Zusatzbeitrag даёт право перейти в другую кассу (Sonderkündigungsrecht)."],
uz:["Soʻrovnomani (Fragebogen) muddatida qaytaring — aks holda maksimal badal belgilanishi mumkin.","Badal qarzi boʻlsa — darhol boʻlib toʻlashga kelishing: qarzda davolanish cheklanadi.","Zusatzbeitrag oshirilsa, boshqa kassaga oʻtish huquqi paydo boʻladi (Sonderkündigungsrecht)."]},
i:{ru:"Растут долг и пени, лечение ограничивают экстренной помощью.",uz:"Qarz va penya oshadi, davolanish shoshilinch yordam bilan cheklanadi."}},

w:{ru:"Изменение цены, продление договора или подтверждение тарифа.",uz:"Narx oʻzgarishi, shartnomani uzaytirish yoki tarif tasdigʻi."},
d:{ru:["Повышение цены обычно даёт право расторгнуть договор досрочно (Sonderkündigungsrecht). Срок указан в письме.","Договоры, заключённые после 1 марта 2022 года, после первого срока можно расторгнуть с уведомлением за 1 месяц.","Расторжение отправляйте письменно и требуйте подтверждение (Kündigungsbestätigung)."],
uz:["Narx oshishi odatda shartnomani muddatidan oldin bekor qilish huquqini beradi (Sonderkündigungsrecht). Muddat xatda koʻrsatilgan.","2022-yil 1-martdan keyin tuzilgan shartnomalarni birinchi muddatdan keyin 1 oylik ogohlantirish bilan bekor qilish mumkin.","Bekor qilishni yozma yuboring va tasdiq talab qiling (Kündigungsbestätigung)."]},
i:{ru:"Договор продлится автоматически, уже по новой цене.",uz:"Shartnoma avtomatik ravishda, yangi narxda uzayadi."}},

n:{ru:"Kindergeld / Elterngeld",uz:"Kindergeld / Elterngeld"},
w:{ru:"Проверка права на детские выплаты, запрос справок или требование вернуть деньги.",uz:"Bolalar toʻlovlariga huquqni tekshirish, maʼlumotnoma soʻrovi yoki pulni qaytarish talabi."},
d:{ru:["Пришлите запрошенные справки (школа, Ausbildung, вуз) до срока.","Требуют вернуть деньги — проверьте период. Можно подать Einspruch в течение месяца или попросить рассрочку."],
uz:["Soʻralgan maʼlumotnomalarni (maktab, Ausbildung, OTM) muddatgacha yuboring.","Pulni qaytarishni talab qilishsa — davrni tekshiring. Bir oy ichida Einspruch berish yoki boʻlib toʻlashni soʻrash mumkin."]},
i:{ru:"Выплаты остановят, а уже полученное потребуют вернуть.",uz:"Toʻlovlar toʻxtatiladi, olinganlarini esa qaytarishni talab qilishadi."}},
{id:"arbeit",u:3,fr:{d:21,del:1},frIf:/kündigung des arbeitsverhältnisses|kündigen (?:wir )?(?:hiermit )?das (?:mit ihnen bestehende )?arbeitsverhältnis|kündigen hiermit das arbeitsverhältnis/,tpl:[],
kw:[["kündigung des arbeitsverhältnisses",6],["arbeitsverhältnis",4],["abmahnung",5],["kündigungsschutzklage",4],["arbeitgeber",2],["arbeitsvertrag",2],["probezeit",2],["arbeitszeugnis",2],["nächstmöglichen zeitpunkt",2]],
n:{ru:"Работа: предупреждение или увольнение",uz:"Ish: ogohlantirish yoki ishdan boʻshatish"},
w:{ru:"Abmahnung — официальное предупреждение за нарушение. Kündigung — увольнение.",uz:"Abmahnung — qoidabuzarlik uchun rasmiy ogohlantirish. Kündigung — ishdan boʻshatish."},
d:{ru:["Увольнение: иск в суд по трудовым делам (Kündigungsschutzklage) можно подать только в течение 3 недель после получения.","В течение 3 дней сообщите в Agentur für Arbeit, что ищете работу (arbeitssuchend melden), иначе пособие могут урезать.","Abmahnung: можно письменно изложить свою версию и попросить приложить её к личному делу.","Ничего не подписывайте (например, Aufhebungsvertrag) без консультации профсоюза или адвоката."],
uz:["Ishdan boʻshatish: mehnat sudiga daʼvo (Kündigungsschutzklage) olingandan keyin faqat 3 hafta ichida beriladi.","3 kun ichida Agentur für Arbeitga ish qidirayotganingizni xabar qiling (arbeitssuchend melden), aks holda nafaqa kamaytirilishi mumkin.","Abmahnung: oʻz versiyangizni yozma bayon qilib, shaxsiy ishingizga qoʻshishni soʻrashingiz mumkin.","Kasaba uyushmasi yoki advokat maslahatisiz hech narsaga (masalan, Aufhebungsvertrag) imzo qoʻymang."]},
i:{ru:"Через 3 недели увольнение считается действительным, даже если в нём были ошибки.",uz:"3 haftadan keyin ishdan boʻshatish, xatolar boʻlsa ham, haqiqiy hisoblanadi."}}

/* English and German texts for the letter types */
const TYPES_X={
bescheid:{n:["Official decision (Bescheid)","Bescheid einer Behörde"],
w:["An official decision: something was granted, refused, recalculated, or money is being reclaimed. At the bottom there is usually a “Rechtsbehelfsbelehrung” explaining how and by when you can object.","Eine amtliche Entscheidung: etwas wurde bewilligt, abgelehnt, neu berechnet oder Geld wird zurückgefordert. Unten steht meist die Rechtsbehelfsbelehrung — dort steht, wie und bis wann Sie widersprechen können."],
d:[["Check amounts, dates and your personal details — mistakes are common.","If you disagree, file a written Widerspruch before the deadline. You can add the reasons later.","Send it so you have proof: in person with a stamp on your copy, by fax or by registered mail.","Keep the letter and a copy of your reply."],["Beträge, Daten und persönliche Angaben prüfen — Fehler sind häufig.","Wenn Sie nicht einverstanden sind, vor Fristende schriftlich Widerspruch einlegen. Die Begründung kann nachgereicht werden.","Mit Nachweis versenden: persönlich mit Eingangsstempel, per Fax oder Einschreiben.","Brief und Kopie Ihrer Antwort aufbewahren."]],
i:["After the deadline the decision becomes final (bestandskräftig) and is very hard to challenge.","Nach Fristablauf wird der Bescheid bestandskräftig und ist kaum noch anfechtbar."]},
jc:{n:["Invitation from the Jobcenter / employment agency","Einladung vom Jobcenter / der Agentur für Arbeit"],
w:["You are being called to a meeting on a set day and time. It's a mandatory invitation, not a request.","Sie werden zu einem festen Termin eingeladen. Das ist verpflichtend, keine Bitte."],
d:[["Be on time. Bring the letter, your passport and the documents listed.","If you can't come, say so BEFORE the appointment with an important reason: illness (sick note needed), job interview, exam.","Ask for a new date in writing and keep proof that you sent it."],["Pünktlich erscheinen. Brief, Pass und die genannten Unterlagen mitbringen.","Wenn es nicht geht, VOR dem Termin absagen und einen wichtigen Grund nennen: Krankheit (AU nötig), Vorstellungsgespräch, Prüfung.","Schriftlich um einen neuen Termin bitten und den Versand nachweisen können."]],
i:["Missing it without an important reason can reduce your payments; repeated no-shows can stop them completely.","Versäumen ohne wichtigen Grund kann die Leistung mindern; wiederholt kann sie ganz entfallen."]},
mitwirkung:{n:["Request for documents (Mitwirkung)","Aufforderung zur Mitwirkung"],
w:["The office wants documents: bank statements, tenancy agreement, proof of income, etc. Your application won't be processed without them.","Die Behörde verlangt Unterlagen: Kontoauszüge, Mietvertrag, Einkommensnachweise usw. Ohne sie wird der Antrag nicht bearbeitet."],
d:[["Write down exactly what they ask for — usually a numbered list.","Send copies, not originals. Put your reference number (BG-Nummer or Aktenzeichen) on every page.","If you can't make it in time, ask for an extension in writing before the deadline ends.","Best: hand them in personally and get a receipt stamp (Eingangsstempel) on your copy."],["Genau notieren, was verlangt wird — meist eine nummerierte Liste.","Kopien schicken, keine Originale. Auf jede Seite die BG-Nummer oder das Aktenzeichen schreiben.","Wenn es nicht rechtzeitig klappt, vor Fristende schriftlich um Verlängerung bitten.","Am besten persönlich abgeben und den Eingangsstempel auf Ihrer Kopie geben lassen."]],
i:["Payments can be stopped or refused (Versagung) until the documents arrive.","Leistungen können versagt oder entzogen werden, bis die Unterlagen da sind."]},
finanzamt:{n:["Letter from the tax office (Finanzamt)","Schreiben vom Finanzamt"],
w:["Usually a tax assessment (Steuerbescheid): how much you get back or must pay. Or a reminder to file your return.","Meist ein Steuerbescheid: Erstattung oder Nachzahlung. Oder eine Erinnerung zur Steuererklärung."],
d:[["Compare the figures with your return — especially the work expenses (Werbungskosten) you claimed.","If you find an error, file an Einspruch within one month — via ELSTER or by letter.","If you owe money, pay by the date in the letter or ask for deferral (Stundung) or instalments."],["Zahlen mit Ihrer Erklärung vergleichen — besonders die Werbungskosten.","Bei Fehlern innerhalb eines Monats Einspruch einlegen — über ELSTER oder per Brief.","Bei Nachzahlung bis zum genannten Datum zahlen oder Stundung bzw. Raten beantragen."]],
i:["After one month the assessment is final, and late payment incurs penalties (Säumniszuschläge).","Nach einem Monat ist der Bescheid bestandskräftig; bei verspäteter Zahlung fallen Säumniszuschläge an."]},
mahnung:{n:["Payment reminder (Mahnung)","Mahnung / Zahlungserinnerung"],
w:["A company thinks you haven't paid a bill and asks you to pay — often with a reminder fee.","Ein Unternehmen meint, eine Rechnung sei offen, und fordert Zahlung — oft mit Mahngebühr."],
d:[["Check: did you have this contract, and haven't you already paid (look at your bank statement)?","If the debt is correct, pay or ask in writing for instalments.","If it's wrong, dispute it in writing and don't pay “just in case”.","Only pay to account details that match your contract."],["Prüfen: Gab es den Vertrag, und haben Sie nicht schon gezahlt (Kontoauszug)?","Stimmt die Forderung, zahlen oder schriftlich Raten anbieten.","Stimmt sie nicht, schriftlich bestreiten und nicht „sicherheitshalber“ zahlen.","Nur auf Kontodaten zahlen, die zum Vertrag passen."]],
i:["The case may go to a debt collector (Inkasso) or court (Mahnbescheid) — the amount will grow.","Es kann zu Inkasso oder einem gerichtlichen Mahnbescheid kommen — die Summe wächst."]},
inkasso:{n:["Debt collection letter (Inkasso)","Inkassoschreiben"],
w:["A debt collection firm is claiming money on behalf of a company. It has no special powers: without a court decision it cannot seize your property.","Ein Inkassobüro fordert Geld für ein Unternehmen. Es hat keine besonderen Befugnisse: Ohne Gerichtstitel kann es nichts pfänden."],
d:[["Check who the original creditor (Auftraggeber) is and what the debt is for.","Check the firm in the official register rechtsdienstleistungsregister.de — scammers often pose as debt collectors.","If the claim is wrong, dispute it in writing. If correct, agree on instalments.","Don't sign an acknowledgement of debt (Schuldanerkenntnis) without understanding it."],["Prüfen, wer der ursprüngliche Gläubiger ist und wofür die Forderung besteht.","Firma im Rechtsdienstleistungsregister prüfen — Betrüger geben sich oft als Inkasso aus.","Falsche Forderungen schriftlich bestreiten, berechtigte in Raten zahlen.","Kein Schuldanerkenntnis unterschreiben, ohne es zu verstehen."]],
i:["A court order (Mahnbescheid) and a SCHUFA entry are possible — making it hard to rent a flat or get credit.","Mahnbescheid und SCHUFA-Eintrag sind möglich — das erschwert Wohnungssuche und Kredite."]},
mahnbescheid:{n:["Court payment order (Mahnbescheid)","Gerichtlicher Mahnbescheid"],
w:["This comes from a court, usually in a yellow envelope. The court has not checked whether the creditor is right — it only passes on the claim.","Das kommt vom Gericht, meist im gelben Umschlag. Das Gericht hat nicht geprüft, ob die Forderung stimmt."],
d:[["Note the date on the yellow envelope — the 2 weeks run from that day.","If you disagree, fill in the enclosed Widerspruch form and send it to the court.","If you agree, pay the debt plus the costs stated in the order.","Get free advice straight away (Verbraucherzentrale, Schuldnerberatung)."],["Datum auf dem gelben Umschlag notieren — die 2 Wochen laufen ab diesem Tag.","Wenn Sie nicht einverstanden sind, das beiliegende Widerspruchsformular ausfüllen und ans Gericht senden.","Wenn die Forderung stimmt, Betrag und Kosten zahlen.","Sofort kostenlose Beratung suchen (Verbraucherzentrale, Schuldnerberatung)."]],
i:["An enforcement order (Vollstreckungsbescheid) follows — then your account and part of your wages can be seized.","Es folgt ein Vollstreckungsbescheid — dann sind Kontopfändung und Lohnpfändung möglich."]},
miete:{n:["Termination of tenancy (Kündigung)","Kündigung des Mietverhältnisses"],
w:["Your landlord wants to end the tenancy. Many such letters contain errors of form or reason, which makes them invalid.","Der Vermieter will den Mietvertrag beenden. Viele Kündigungen haben Form- oder Begründungsfehler und sind dann unwirksam."],
d:[["Don't move out or sign anything straight away.","Check: is it signed by hand (not email or WhatsApp), with a reason and the correct notice period?","Contact a tenants' association (Mieterverein) — after joining, advice is inexpensive.","If moving would be especially hard (illness, children at school, no housing), object under § 574 BGB at least 2 months before the tenancy ends."],["Nicht sofort ausziehen und nichts unterschreiben.","Prüfen: eigenhändig unterschrieben (nicht E-Mail/WhatsApp), mit Grund und richtiger Frist?","Mieterverein kontaktieren — nach dem Beitritt ist Beratung günstig.","Wäre der Umzug eine besondere Härte (Krankheit, Kinder, keine Wohnung), spätestens 2 Monate vor Mietende nach § 574 BGB widersprechen."]],
i:["The landlord may sue for eviction (Räumungsklage), and you would bear the court costs.","Der Vermieter kann auf Räumung klagen — die Prozesskosten trügen Sie."]},
erhoehung:{n:["Rent increase (Mieterhöhung)","Mieterhöhung"],
w:["Your landlord wants to raise the rent. Usually they ask for your consent (Zustimmung) — you have time to think.","Der Vermieter will die Miete erhöhen. Meist braucht er Ihre Zustimmung — Sie haben Bedenkzeit."],
d:[["Compare the new rent with your city's rent index (Mietspiegel).","A new rent can apply at the earliest 15 months after the last increase, and within 3 years it may not rise by more than 20% (15% in many cities).","Don't agree straight away: check with a tenants' association first.","You must reply by the end of the second month after receiving the letter."],["Neue Miete mit dem Mietspiegel vergleichen.","Frühestens 15 Monate nach der letzten Erhöhung; in 3 Jahren höchstens +20 % (vielerorts +15 %).","Nicht sofort zustimmen — erst beim Mieterverein prüfen lassen.","Antwort bis zum Ende des zweiten Monats nach Zugang."]],
i:["Silence is not consent — but the landlord can sue to obtain it.","Schweigen ist keine Zustimmung — der Vermieter kann aber auf Zustimmung klagen."]},
nebenkosten:{n:["Utility bill (Nebenkostenabrechnung)","Nebenkostenabrechnung"],
w:["The annual statement for heating, water, rubbish etc. The result is a back payment (Nachzahlung) or a refund (Guthaben).","Jahresabrechnung für Heizung, Wasser, Müll usw. Ergebnis: Nachzahlung oder Guthaben."],
d:[["Check the period: the statement must arrive within 12 months after it ends, otherwise no back payment can be demanded.","Compare with last year — a sharp increase is worth checking.","You have the right to see the original invoices (Belegeinsicht).","Objections can be raised within 12 months of receipt."],["Zeitraum prüfen: Die Abrechnung muss spätestens 12 Monate nach Ende kommen, sonst keine Nachzahlung.","Mit dem Vorjahr vergleichen — starke Steigerungen prüfen.","Sie haben ein Recht auf Belegeinsicht.","Einwendungen innerhalb von 12 Monaten nach Zugang."]],
i:["An unpaid back payment will be collected, and large rent arrears can lead to termination.","Unbezahlte Nachzahlungen werden eingetrieben; hohe Mietrückstände können zur Kündigung führen."]},
rundfunk:{n:["Broadcasting fee (Rundfunkbeitrag)","Rundfunkbeitrag"],
w:["A mandatory fee per household, not per person — even if you don't own a TV.","Pflichtbeitrag pro Wohnung, nicht pro Person — auch ohne Fernseher."],
d:[["In a shared flat or family, one person pays per flat. Report the Beitragsnummer of the person who already pays.","If you receive social benefits, BAföG or BAB, you can get an exemption (Befreiung).","Forms and replies are on rundfunkbeitrag.de."],["In WG oder Familie zahlt eine Person pro Wohnung. Beitragsnummer der zahlenden Person mitteilen.","Mit Sozialleistungen, BAföG oder BAB ist eine Befreiung möglich.","Formulare auf rundfunkbeitrag.de."]],
i:["The debt is passed to the city for enforcement (Vollstreckung).","Die Schuld wird über die Stadt vollstreckt."]},
bussgeld:{n:["Fine for an offence (Bußgeld)","Bußgeld / Anhörung"],
w:["You're accused of an offence, most often in traffic. An Anhörungsbogen asks for your side first; a Bußgeldbescheid is the actual fine.","Ihnen wird eine Ordnungswidrigkeit vorgeworfen, meist im Verkehr. Anhörungsbogen = erst Ihre Stellungnahme; Bußgeldbescheid = die Entscheidung."],
d:[["On the Anhörungsbogen you only have to give your personal details. You don't have to admit anything.","If a relative was driving, you don't have to name them.","You can object (Einspruch) to a Bußgeldbescheid within 2 weeks of delivery (date on the envelope).","If a driving ban or many points are at stake, see a traffic lawyer."],["Im Anhörungsbogen sind nur die Angaben zur Person Pflicht. Sie müssen nichts zugeben.","War ein Angehöriger am Steuer, müssen Sie ihn nicht nennen.","Gegen einen Bußgeldbescheid innerhalb von 2 Wochen ab Zustellung Einspruch einlegen.","Bei Fahrverbot oder vielen Punkten zur Fachanwältin bzw. zum Fachanwalt für Verkehrsrecht."]],
i:["The fine becomes final and is collected; points go into the Flensburg register.","Das Bußgeld wird rechtskräftig und eingetrieben; Punkte kommen ins Fahreignungsregister in Flensburg."]},
abh:{n:["Immigration office (Ausländerbehörde)","Schreiben der Ausländerbehörde"],
w:["A letter about your residence: an appointment, a request for documents, an extension or a decision.","Ein Schreiben zu Ihrem Aufenthalt: Termin, Unterlagen, Verlängerung oder Entscheidung."],
d:[["Take the deadlines very seriously — submit everything by the date in the letter.","Apply for an extension BEFORE your card expires: you then stay legal until a decision (Fiktionsbescheinigung).","If it's a refusal or mentions “Ausreise”, go straight to free migration advice (MBE, Jugendmigrationsdienst) or a lawyer.","Copy everything you hand in."],["Fristen sehr ernst nehmen — alles bis zum genannten Datum einreichen.","Verlängerung VOR Ablauf der Karte beantragen: Dann gilt der Aufenthalt bis zur Entscheidung fort (Fiktionsbescheinigung).","Bei Ablehnung oder dem Wort „Ausreise“ sofort zur Migrationsberatung oder zu einer Anwältin bzw. einem Anwalt.","Von allem, was Sie abgeben, Kopien machen."]],
i:["A missed deadline can affect your right to live and work in Germany.","Eine versäumte Frist kann Ihr Aufenthalts- und Arbeitsrecht gefährden."]},
kk:{n:["Health insurance fund (Krankenkasse)","Schreiben der Krankenkasse"],
w:["Insurance matters: confirmation, an income questionnaire, unpaid contributions or a change in rates.","Versicherungsfragen: Bestätigung, Einkommensfragebogen, Beitragsrückstand oder Tarifänderung."],
d:[["Return the questionnaire (Fragebogen) on time — otherwise the maximum contribution may be charged.","If you owe contributions, agree on instalments right away: with arrears, treatment is restricted.","A higher additional contribution (Zusatzbeitrag) gives you the right to switch to another fund."],["Fragebogen fristgerecht zurückschicken — sonst droht der Höchstbeitrag.","Bei Beitragsrückständen sofort Raten vereinbaren: Mit Rückständen ist die Behandlung eingeschränkt.","Bei Erhöhung des Zusatzbeitrags besteht ein Sonderkündigungsrecht."]],
i:["Debt and penalties grow, and treatment is limited to emergencies.","Schulden und Säumniszuschläge wachsen; Leistungen werden auf Notfälle beschränkt."]},
vertrag:{n:["Contract or subscription (phone, internet, gym, power)","Vertrag oder Abo (Handy, Internet, Fitness, Strom)"],
w:["A price change, contract renewal or tariff confirmation.","Preisänderung, Vertragsverlängerung oder Tarifbestätigung."],
d:[["A price increase usually gives you the right to cancel early (Sonderkündigungsrecht). The deadline is in the letter.","Contracts signed after 1 March 2022 can be cancelled with 1 month's notice after the initial term.","Cancel in writing and ask for a confirmation (Kündigungsbestätigung)."],["Eine Preiserhöhung gibt meist ein Sonderkündigungsrecht — die Frist steht im Schreiben.","Verträge ab dem 1. März 2022 sind nach der Erstlaufzeit monatlich kündbar.","Schriftlich kündigen und eine Kündigungsbestätigung verlangen."]],
i:["The contract renews automatically at the new price.","Der Vertrag verlängert sich automatisch zum neuen Preis."]},
familie:{n:["Kindergeld / Elterngeld","Kindergeld / Elterngeld"],
w:["A check of your entitlement to family benefits, a request for certificates, or a demand to repay money.","Prüfung des Anspruchs, Anforderung von Bescheinigungen oder Rückforderung."],
d:[["Send the requested certificates (school, Ausbildung, university) before the deadline.","If they want money back, check the period. You can object (Einspruch) within a month or ask for instalments."],["Angeforderte Bescheinigungen (Schule, Ausbildung, Studium) fristgerecht einreichen.","Bei Rückforderung den Zeitraum prüfen. Einspruch innerhalb eines Monats oder Raten beantragen."]],
i:["Payments stop and money already received may be reclaimed.","Die Zahlung wird eingestellt, bereits Gezahltes kann zurückgefordert werden."]},
arbeit:{n:["Work: warning or dismissal","Arbeit: Abmahnung oder Kündigung"],
w:["An Abmahnung is a formal warning for misconduct. A Kündigung is a dismissal.","Abmahnung = förmliche Rüge eines Fehlverhaltens. Kündigung = Beendigung des Arbeitsverhältnisses."],
d:[["Dismissal: you can only sue at the labour court (Kündigungsschutzklage) within 3 weeks of receiving it.","Within 3 days, tell the employment agency you're looking for work, or your benefits may be cut.","Abmahnung: you can write down your side and ask for it to be added to your personnel file.","Don't sign anything (e.g. a termination agreement) without advice from a union or lawyer."],["Kündigung: Kündigungsschutzklage nur innerhalb von 3 Wochen nach Zugang.","Innerhalb von 3 Tagen bei der Agentur für Arbeit arbeitsuchend melden, sonst droht eine Sperrzeit.","Abmahnung: Gegendarstellung schreiben und zur Personalakte nehmen lassen.","Nichts unterschreiben (z. B. Aufhebungsvertrag) ohne Beratung durch Gewerkschaft oder Anwalt."]],
i:["After 3 weeks the dismissal is treated as valid even if it contained errors.","Nach 3 Wochen gilt die Kündigung als wirksam, auch wenn sie Fehler hatte."]}
};

function analyze(text,override){
  const low=text.toLowerCase();
  const sc=TYPES.map(t=>({t,s:t.kw.reduce((a,[k,w])=>a+(low.includes(k)?w:0),0)})).sort((a,b)=>b.s-a.s);
  const type=sc[0].s>=3?sc[0].t:null;
  const alt=type?sc.slice(1).filter(x=>x.s>=4&&x.s>=sc[0].s*0.6).slice(0,2).map(x=>x.t):[];
  const dates=[];const dre=new RegExp(DATE,"gi");let m;
  while((m=dre.exec(text))){const d=fromM(m);if(d&&!dates.some(x=>+x===+d))dates.push(d)}
  const amounts=[];const are=/(\d{1,3}(?:\.\d{3})*,\d{2})\s?(?:€|eur\b|euro\b)|€\s?(\d{1,3}(?:\.\d{3})*,\d{2})/gi;
  while((m=are.exec(text))){const v=(m[1]||m[2])+" €";if(!amounts.includes(v))amounts.push(v)}
  const refs=[];const rre=/(aktenzeichen|az\.|bg-nummer|nummer der bedarfsgemeinschaft|kundennummer|steuernummer|beitragsnummer|vertragsnummer|rechnungsnummer|mitgliedsnummer|geschäftszeichen|kassenzeichen|unser zeichen)\s*:?\s*(\d{2,4}(?: \d{2,4}){1,4}(?!\w)|[a-z0-9][a-z0-9\/\-\.]{3,24})/gi;
  while((m=rre.exec(text))){const v=m[2].replace(/[.\-\/]+$/,"");if(/\d/.test(v)&&!refs.some(r=>r[1]===v))refs.push([m[1],v])}
  const t0=today();
  let ld=null;
  if((m=text.match(new RegExp("(?:^|\\n)\\s*(?:datum|date)\\s*:?\\s*(?:"+DATE+")","i"))))ld=fromM(m);
  if(!ld&&(m=text.match(new RegExp("(?:^|\\n)\\s*[A-ZÄÖÜ][A-Za-zÄÖÜäöüß\\-. ]{2,30},\\s*(?:den\\s+)?(?:"+DATE+")"))))ld=fromM(m);
  if(!ld){const past=dates.filter(d=>d<=t0&&diff(d,t0)<200).sort((a,b)=>b-a);ld=past[0]||null}
  const ldAuto=ld;if(override)ld=override;
  let appt=null;
  if((m=text.match(new RegExp("(?:\\bam|für den|termin\\s*:?)\\s+(?:(?:montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag),?\\s+)?(?:den\\s+)?(?:"+DATE+")\\s*,?\\s*(?:um\\s+)?(\\d{1,2}[:.]\\d{2})\\s*uhr","i")))){const d=fromM(m);if(d)appt={d,time:m[7].replace(".",":")}}
  let dl=null,basis=null;
  const ex=text.match(new RegExp("(?:bis\\s+(?:spätestens\\s+)?(?:zum\\s+|am\\s+)?|spätestens\\s+(?:bis\\s+)?(?:zum\\s+|am\\s+)?|frist\\s*(?:bis|:)?\\s*(?:zum\\s+)?)(?:"+DATE+")","i"));
  const exD=ex?fromM(ex):null;
  const rel=text.match(/(?:innerhalb|binnen)\s+(?:von\s+)?(einem|eines|einer|zwei|drei|vier|sechs|acht|zehn|vierzehn|\d{1,2})\s+(tag|tage|tagen|woche|wochen|monat|monats|monate|monaten)\b/i);
  const NW={einem:1,eines:1,einer:1,zwei:2,drei:3,vier:4,sechs:6,acht:8,zehn:10,vierzehn:14};
  const fr=type&&type.fr&&(!type.frIf||type.frIf.test(low))?type.fr:null;
  if(exD&&(!ld||exD>=ld)){dl=exD;basis="explicit"}
  else if(rel&&ld){const n=NW[rel[1].toLowerCase()]||+rel[1];const u=rel[2].toLowerCase();const del=fr&&fr.del;const base=del?ld:addD(ld,4);
    dl=shiftWE(u.startsWith("tag")?addD(base,n):u.startsWith("woche")?addD(base,7*n):addM(base,n));basis=del?"delivery":"calc"}
  else if(fr&&ld){
    if(fr.sp==="e2m"){const r=addD(ld,4);dl=shiftWE(new Date(r.getFullYear(),r.getMonth()+3,0,12));basis="calc"}
    else if(fr.del){dl=shiftWE(addD(ld,fr.d));basis="delivery"}
    else{const r=addD(ld,4);dl=shiftWE(fr.m?addM(r,fr.m):addD(r,fr.d));basis=fr.soft?"soft":"calc"}}
  else if(type&&type.id==="miete"&&ld){const mz=text.match(new RegExp("zum\\s+(?:"+DATE+")","i"));const me=mz?fromM(mz):null;
    if(me&&me>ld){dl=addM(me,-2);basis="miete"}}
  if(!dl&&appt){dl=appt.d;basis="appt"}
  const words=GL.filter(g=>(g[3]||[g[0].toLowerCase().replace(/\s*\(.*\)/,"")]).some(k=>low.includes(k))).slice(0,14);
  const scam=SCAM.some(k=>low.includes(k));
  return {type,alt,dates,amounts,refs,ld,ldAuto,appt,dl,basis,words,scam};
}

  if(t.due.from==="valid"){const v=fromIso(S.vd[t.id]);return v?addD(v,-56):null}

}
function nextTask(list){

    ${q.city?`<label class="field"><span>${esc(l.pf.city)}</span><input type="text" id="ob-city" list="cities" value="${esc(S.p.city||"")}" placeholder="Bremen" autocomplete="address-level2"><datalist id="cities">${CITIES.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>`:""}

/* ---------- plan ---------- */
function vPlan(){

  else if(nTotal)h+=`<div class="next" style="border-color:var(--ok)"><span class="lbl" style="color:var(--ok)">✓</span><b>${esc(l.allDoneH)}</b><span class="sub">${esc(l.allDoneP)}</span></div>`;
  const F=[["all",l.fAll],["open",l.fOpen],["doing",l.fDoing],["done",l.fDone]];
  h+=`<div class="filters" role="group">${F.map(([k,n])=>`<button class="fchip" data-act="filter" data-v="${k}" aria-pressed="${S.filter===k}">${esc(n)}</button>`).join("")}</div>`;
  for(const [ph,name] of PHASES){

  h+=`<div class="card" style="display:flex;flex-direction:column;gap:10px"><b>${esc(l.eventsH)}</b><span class="note">${esc(l.eventsP)}</span><div class="events">${EVENTS.map(e=>`<button class="fchip" data-act="event" data-v="${e[0]}" aria-pressed="${(S.p.ev||[]).includes(e[0])}">${esc(tr(e[2]))}</button>`).join("")}</div></div>`;
  h+=`<button class="btn" data-act="editprofile" style="align-self:flex-start">${ic("user")}${esc(l.editProfile)}</button>`;

}

function vDl(){
  const l=L(),t0=today();
  const items=[...S.dl].sort((a,b)=>(a.done-b.done)||a.date.localeCompare(b.date));
  const fromPlan=planTasks().map(t=>[t,taskDue(t)]).filter(([t,d])=>d&&!["done","skip"].includes(tStatus(t.id))).sort((a,b)=>a[1]-b[1]);
  let h=`<section class="sec"><div class="row" style="justify-content:space-between"><h1 class="h">${esc(l.dlH)}</h1>${S.dlForm?"":`<button class="btn sm" data-act="dlform">+ ${esc(l.dlAdd)}</button>`}</div>`;
  if(S.dlForm)h+=`<form class="card" id="dlf" style="display:grid;gap:12px">
    <label class="field"><span>${esc(l.dlTitle)}</span><input type="text" id="dlt" required></label>
    <div class="grid2"><label class="field"><span>${esc(l.dlDate)}</span><input type="date" id="dld" required value="${iso(addD(t0,7))}"></label>
    <label class="field"><span>${esc(l.dlNote)}</span><input type="text" id="dln"></label></div>
    <div class="row"><button class="btn primary" type="submit">${esc(l.save)}</button><button class="btn ghost" type="button" data-act="dlcancel">${esc(l.cancel)}</button></div></form>`;
  if(!items.length&&!fromPlan.length&&!S.dlForm)h+=`<div class="empty">${esc(l.dlEmpty)}</div>`;
  h+=`<div class="dl-list">`+items.map(x=>{
    const d=fromIso(x.date);if(!d)return "";const n=diff(t0,d),u=x.done?0:(n<0?3:urgOf(n));
    const title=dlTitle(x);
    const cal=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${x.date.replace(/-/g,"")}/${iso(addD(d,1)).replace(/-/g,"")}&details=${encodeURIComponent((x.note?x.note+"\n":"")+"Briefklar")}`;
    return `<div class="dl${x.done?" done":""}"><div class="cal u${u}"><div class="m">${MS[S.lang][d.getMonth()]}</div><div class="d">${d.getDate()}</div></div>
    <div style="min-width:0"><h3>${esc(title)}</h3><div class="meta"><span class="mono">${fmt(d)}</span>${x.done?`<span>✓ ${esc(l.doneList)}</span>`:`<span class="left l${u}" style="padding:1px 8px;font-size:12.5px">${esc(l.left(n))}</span>`}${x.note?`<span class="mono">${esc(x.note)}</span>`:""}</div>
    <div class="acts">${S.delAsk===x.id?`<span class="note" style="align-self:center">${esc(l.delQ)}</span><button class="btn sm" data-act="dldel" data-v="${x.id}">${esc(l.yesDel)}</button><button class="btn ghost sm" data-act="dlnodel">${esc(l.no)}</button>`:
    `<button class="btn sm" data-act="dldone" data-v="${x.id}">${x.done?esc(l.undo):"✓ "+esc(l.done)}</button>${x.done?"":`<a class="btn ghost sm" href="${cal}" target="_blank" rel="noopener">${esc(l.cal)}</a>`}<button class="btn ghost sm" data-act="dlask" data-v="${x.id}">${esc(l.del)}</button>`}</div></div></div>`}).join("")+`</div>`;
  if(fromPlan.length){
    h+=`<div class="phase"><div class="phase-h"><h2 class="h2">${esc(l.fromPlan)}</h2></div>${fromPlan.map(([t])=>vTaskRow(t)).join("")}</div>`;
  }
  return h+`</section>`;
}
function dlTitle(x){
  if(x.tid){const ty=TYPES.find(y=>y.id===x.tid);if(ty)return tr(ty.n)}
  if(x.task){const tk=TASKS.find(y=>y.id===x.task);if(tk)return tk.c[S.lang][0]}
  return x.title;
}

function letterVals(){
  const t=TPL.find(x=>x.id===S.tpl),v={};
  for(const f of t.f){const F=FIELDS[f];let x=S.tv[f];
    if(F.t==="date")x=x?fmt(fromIso(x)):(F.opt?"":"…");
    else if(F.t==="select")x=x||F.o[0][0];
    else if(typeof x==="string")x=x.trim();
    v[f]=x}
  return v;
}
function letterText(){
  const t=TPL.find(x=>x.id===S.tpl),v=letterVals(),me=S.me;
  const city=(me.city||"").replace(/^\s*\d{4,5}\s*/,"").trim();
  const head=[me.name||"Vorname Nachname",me.street||"Straße Hausnummer",me.city||"PLZ Ort"].join("\n");

}
function letterHTML(){const x=letterText();return `${esc(x.head)}\n\n\n${esc(x.to)}\n\n\n${esc(x.date)}\n\n<span class="subj">${esc(x.subj)}</span>\n\n${esc(x.body)}`}

function mailHref(){if(!S.tpl)return "#";const x=letterText();return `mailto:${encodeURIComponent((S.mailto||"").trim())}?subject=${encodeURIComponent(x.subj)}&body=${encodeURIComponent(x.body+"\n"+[S.me.street,S.me.city].filter(Boolean).join("\n"))}`}

function openTpl(id,prefill){

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2000)}
function setStatus(id,v){
  if(v==="todo")delete S.ts[id];else S.ts[id]=v;st.set("ts",S.ts);
  render();if(v==="done")toast(L().taskDoneToast);

function runAnalyze(fromSample){
  const p=document.getElementById("paste");if(p)S.text=p.value;
  if(!S.text.trim()){S.res=null;render();return}
  S.res=analyze(S.text,null);S.isSample=!!fromSample;S.fresh=true;S.added=false;render();
  const r=document.getElementById("result");if(r)r.scrollIntoView({behavior:"smooth",block:"start"});
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="closesheet"&&e.target!==b&&!e.target.closest("button[data-act=closesheet]"))return;
  switch(a){
  case "home":S.tab="plan";S.sub=null;render();window.scrollTo(0,0);break;
  case "tab":S.tab=v;S.sub=null;S.delAsk=null;S.confirm=null;try{if(history.state&&history.state.sub)history.replaceState(null,"")}catch(err){}render();window.scrollTo(0,0);break;
  case "back":closeSub();break;
  case "langsheet":S.sheet="lang";render();break;
  case "closesheet":S.sheet=null;render();break;
  case "setlang":S.lang=v;st.set("lang",v);S.sheet=null;render();break;
  case "startob":case "editprofile":S.sub=null;startOnboarding();break;
  case "oblater":S.ob=null;S.obDone=true;st.set("obDone",true);render();break;
  case "obback":S.ob=Math.max(0,S.ob-1);render();window.scrollTo(0,0);break;
  case "obnext":{
    const ar=document.getElementById("ob-arrival");if(ar)S.p.arrival=ar.value;
    const ci=document.getElementById("ob-city");if(ci)S.p.city=ci.value.trim();
    saveP();const steps=obSteps();S.ob=Math.min(S.ob+1,steps.length-1);if(steps[S.ob]==="ready")obFinishProfile();render();window.scrollTo(0,0);break}
  case "obpick":{
    const q=Q.find(x=>x.id===b.dataset.q);
    const ar=document.getElementById("ob-arrival");if(ar)S.p.arrival=ar.value;
    const ci=document.getElementById("ob-city");if(ci)S.p.city=ci.value.trim();
    if(q.type==="many"){const c=new Set(S.p[q.id]||[]);c.has(v)?c.delete(v):c.add(v);S.p[q.id]=[...c];saveP();render()}
    else{S.p[q.id]=v;if(q.id==="purpose"){const allow=statusOptions(S.p);if(!allow.includes(S.p.status))S.p.status=null}saveP();
      if(q.date){render()}else{const steps=obSteps();S.ob=Math.min(S.ob+1,steps.length-1);if(steps[S.ob]==="ready")obFinishProfile();render();window.scrollTo(0,0)}}
    break}
  case "obgo":S.ob=null;S.obDone=true;st.set("obDone",true);S.tab="plan";S.sub=null;render();window.scrollTo(0,0);break;
  case "filter":S.filter=v;render();break;
  case "togglehidden":S.showHidden=!S.showHidden;render();break;
  case "event":{const c=new Set(S.p.ev||[]);c.has(v)?c.delete(v):c.add(v);S.p.ev=[...c];saveP();render();break}
  case "task":openSub({type:"task",id:v});break;
  case "setstatus":setStatus(b.dataset.id,v);break;
  case "taskdl":{const t=TASKS.find(x=>x.id===v),d=taskDue(t);if(d&&!S.dl.some(x=>x.task===v)){S.dl.push({id:Date.now().toString(36),task:v,title:t.c.ru[0],date:iso(d),note:"",done:false});st.set("dl",S.dl)}toast(L().added);break}
  case "analyze":runAnalyze(false);break;
  case "sample":S.text=samples()[+v];runAnalyze(true);break;
  case "clear":S.text="";S.res=null;render();break;
  case "addfromres":{const r=S.res;S.dl.push({id:Date.now().toString(36),tid:r.type?r.type.id:"",title:r.type?tr(r.type.n):L().deadline,date:iso(r.dl),note:r.refs[0]?r.refs[0][1]:"",done:false});st.set("dl",S.dl);S.added=true;render();toast(L().added);break}
  case "tplfromres":{const r=S.res,pf={};
    if(r.refs[0])pf.az=r.refs[0][1];if(r.ld)pf.d1=iso(r.ld);if(r.appt){pf.tdate=iso(r.appt.d);pf.ttime=r.appt.time}
    if(r.dl&&r.basis==="explicit")pf.fbis=iso(r.dl);
    const s0=r.refs.find(x=>/steuernummer/i.test(x[0]));if(s0)pf.stnr=s0[1];
    if(r.amounts.length)pf.betrag=r.amounts[r.amounts.length-1].replace(" €","");
    if(!S.isSample){const lines=S.text.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,3);if(lines.length)pf.to=lines.join("\n")}
    S.tab="tpl";openTpl(v,pf);break}
  case "tpl":openTpl(v);break;
  case "copy":{const txt=letterPlain();
    const fallback=()=>{const el=document.getElementById("letter");const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(txt).then(()=>toast(L().copied),fallback)}catch(err){fallback()}break}
  case "dlform":S.dlForm=true;render();setTimeout(()=>{const i=document.getElementById("dlt");i&&i.focus()},0);break;
  case "dlcancel":S.dlForm=false;render();break;
  case "dldone":{const x=S.dl.find(x=>x.id===v);if(x){x.done=!x.done;st.set("dl",S.dl);render()}break}
  case "dlask":S.delAsk=v;render();break;
  case "dlnodel":S.delAsk=null;render();break;
  case "dldel":S.dl=S.dl.filter(x=>x.id!==v);S.delAsk=null;st.set("dl",S.dl);render();break;
  case "morepage":openSub({type:"more",id:v});break;
  case "askreset":S.confirm="reset";render();break;
  case "noreset":S.confirm=null;render();break;
  case "doreset":{st.clear();const lang=S.lang;Object.assign(S,{p:Object.assign({},DEFAULT_PROFILE),obDone:false,ts:{},docs:{},vd:{},dl:[],me:{name:"",street:"",city:""},confirm:null,sub:null,tab:"plan"});st.set("lang",lang);toast(L().resetDone);startOnboarding();break}
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="dlf")return;e.preventDefault();
  const t=document.getElementById("dlt").value.trim(),d=document.getElementById("dld").value;if(!t||!d)return;
  S.dl.push({id:Date.now().toString(36),title:t,date:d,note:document.getElementById("dln").value.trim(),done:false});st.set("dl",S.dl);S.dlForm=false;render();
});
function rerenderKeepFocus(id){const el=document.getElementById(id);const pos=el?el.selectionStart:0;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="paste"){S.text=el.value;return}
  if(el.id==="tq"){S.tq=el.value;rerenderKeepFocus("tq");return}
  if(el.id==="gq"){S.gq=el.value;rerenderKeepFocus("gq");return}
  if(el.id==="mailto"){S.mailto=el.value;updLetter();return}
  if(el.dataset.me){S.me[el.dataset.me]=el.value;st.set("me",S.me);updLetter();return}
  if(el.dataset.f&&el.type!=="checkbox"){S.tv[el.dataset.f]=el.value;updLetter();return}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="ld"){const d=fromIso(el.value);if(d){S.res=analyze(S.text,d);S.added=false;render()}return}
  if(el.dataset.vd){S.vd[el.dataset.vd]=el.value;st.set("vd",S.vd);render();return}
  if(el.dataset.doc){const id=el.dataset.doc,i=+el.value;const c=new Set(S.docs[id]||[]);el.checked?c.add(i):c.delete(i);S.docs[id]=[...c];st.set("docs",S.docs);
    const lab=el.closest("label");if(lab)lab.classList.toggle("on",el.checked);const t=TASKS.find(x=>x.id===id);const lb=el.closest(".blk").querySelector(".lbl");if(lb&&t)lb.textContent=`${L().docsH} · ${S.docs[id].length}/${t.c[S.lang][3].length}`;return}
  if(el.dataset.fc){const f=el.dataset.fc;const cur=new Set(S.tv[f]||[]);el.checked?cur.add(el.value):cur.delete(el.value);S.tv[f]=[...cur];updLetter();return}
  if(el.dataset.f){S.tv[el.dataset.f]=el.type==="checkbox"?el.checked:el.value;updLetter();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=null;render()}});

/* ---------- boot ---------- */
(function boot(){
  if(!S.obDone&&!S.p.purpose)S.ob=0;
  render();
})();

</script>

</body></html>
